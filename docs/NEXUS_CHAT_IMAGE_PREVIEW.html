<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Nexus Chat Image Preview</title>
  <style>
    body { font-family: Arial, sans-serif; background:#f8fafc; padding:24px; }
    .card { background:#fff; border:1px solid #e5e7eb; border-radius:16px; padding:24px; margin-bottom:20px; box-shadow:0 10px 30px rgba(15,23,42,0.05); }
    .row { display:flex; align-items:center; gap:16px; margin-bottom:16px; }
    .preview { width:96px; height:96px; display:flex; align-items:center; justify-content:center; background:#eef2ff; border-radius:24px; }
    h1 { margin:0 0 16px 0; font-size:24px; color:#0f172a; }
    p { margin:0; color:#334155; }
    code { background:#f1f5f9; padding:4px 8px; border-radius:6px; color:#0f172a; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Nexus Chat Asset Preview</h1>
    <div class="row">
      <div class="preview">
        <img src="../force-app/main/default/staticresources/nexusChatAssets/service-rep-avatar.svg" alt="Service Rep Avatar" width="80" height="80" />
      </div>
      <div>
        <p><strong>Service Rep Avatar</strong></p>
        <p><code>service-rep-avatar.svg</code></p>
      </div>
    </div>
    <div class="row">
      <div class="preview">
        <img src="../force-app/main/default/staticresources/nexusChatAssets/ai-agent-icon.svg" alt="AI Agent Icon" width="80" height="80" />
      </div>
      <div>
        <p><strong>AI Agent Avatar</strong></p>
        <p><code>ai-agent-icon.svg</code></p>
      </div>
    </div>
    <div class="row">
      <div class="preview">
        <img src="../force-app/main/default/staticresources/nexusChatAssets/nexus-logo.svg" alt="Nexus Logo" width="80" height="80" />
      </div>
      <div>
        <p><strong>Logo</strong></p>
        <p><code>nexus-logo.svg</code></p>
      </div>
    </div>
    <div class="row">
      <div class="preview">
        <img src="../force-app/main/default/staticresources/nexusChatAssets/chat-button-icon.svg" alt="Chat Button Icon" width="80" height="80" />
      </div>
      <div>
        <p><strong>Chat Button</strong></p>
        <p><code>chat-button-icon.svg</code></p>
      </div>
    </div>
    <p>Open this file in your browser to preview the SVGs before deployment.</p>
  </div>
</body>
</html>

<template>
<div class="tlx-shell">

    <!-- ══ SIDEBAR ══════════════════════════════════════════════════════════ -->
    <aside class="tlx-sidebar">

        <!-- Brand -->
        <div class="tlx-brand">
            <div class="tlx-logo-mark">T</div>
            <div class="tlx-brand-text">
                <span class="tlx-brand-name">TALCORE</span>
                <span class="tlx-brand-sub">Admin Console</span>
            </div>
        </div>

        <!-- Navigation -->
        <nav class="tlx-nav">
            <template for:each={navItems} for:item="nav">
                <button key={nav.id} class={nav.cls} data-id={nav.id} onclick={handleNav}>
                    <span class="nav-icon">{nav.icon}</span>
                    <span class="nav-label">{nav.label}</span>
                    <template if:true={nav.hasBadge}>
                        <span class="nav-badge">{nav.badge}</span>
                    </template>
                </button>
            </template>
        </nav>

        <!-- Quick stats -->
        <div class="tlx-sidebar-stats">
            <div class="ss-row">
                <span class="ss-dot ss-dot-orange"></span>
                <span class="ss-label">Leads en attente</span>
                <span class="ss-val">{pendingLeadsCount}</span>
            </div>
            <div class="ss-row">
                <span class="ss-dot ss-dot-yellow"></span>
                <span class="ss-label">Devis présentés</span>
                <span class="ss-val">{pendingQuotesCount}</span>
            </div>
            <div class="ss-row">
                <span class="ss-dot ss-dot-red"></span>
                <span class="ss-label">Cases ouverts</span>
                <span class="ss-val">{openCasesCount}</span>
            </div>
        </div>

    </aside>

    <!-- ══ WORKSPACE ════════════════════════════════════════════════════════ -->
    <div class="tlx-workspace">

        <!-- Header -->
        <header class="tlx-header">
            <div class="tlx-header-left">
                <p class="tlx-greeting">{greeting}</p>
                <h1 class="tlx-section-title">{activeSectionLabel}</h1>
            </div>
            <div class="tlx-header-right">
                <div class="tlx-clock">
                    <span class="clock-time">{currentTime}</span>
                    <span class="clock-date">{currentDate}</span>
                </div>
            </div>
        </header>

        <!-- Loading -->
        <template if:true={loading}>
            <div class="tlx-loader">
                <div class="tlx-spinner"></div>
                <p>Chargement du tableau de bord…</p>
            </div>
        </template>

        <!-- ══ VUE D'ENSEMBLE ════════════════════════════════════════════ -->
        <template if:true={isOverview}>
            <div class="tlx-content">

                <!-- KPI Strip -->
                <div class="kpi-strip">
                    <template for:each={kpiCards} for:item="card">
                        <div key={card.id} class={card.cls}>
                            <div class="kpi-top">
                                <span class="kpi-icon">{card.icon}</span>
                                <span class="kpi-value">{card.value}</span>
                            </div>
                            <div class="kpi-label">{card.label}</div>
                            <div class="kpi-sub">{card.sub}</div>
                        </div>
                    </template>
                </div>

                <!-- Charts row -->
                <div class="overview-charts">
                    <div class="ov-card">
                        <div class="ov-card-header">
                            <div>
                                <span class="ov-card-icon">📊</span>
                                <span class="ov-card-title">Pipeline par Étape</span>
                            </div>
                            <button class="ov-view-all" data-id="pipeline" onclick={handleNav}>Voir tout →</button>
                        </div>
                        <template if:true={hasStageGroups}>
                            <div class="pipeline-bars">
                                <template for:each={stageGroups} for:item="sg">
                                    <div key={sg.label} class="pipe-row">
                                        <div class="pipe-name">{sg.label}</div>
                                        <div class="pipe-track">
                                            <div class="pipe-fill" style={sg.barStyle}></div>
                                        </div>
                                        <div class="pipe-right">
                                            <span class="pipe-count">{sg.count}</span>
                                            <span class="pipe-amt">{sg.amountFmt}</span>
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </template>
                        <template if:false={hasStageGroups}>
                            <p class="empty-hint">Aucune opportunité ouverte.</p>
                        </template>
                    </div>

                    <div class="ov-card">
                        <div class="ov-card-header">
                            <div>
                                <span class="ov-card-icon">🎯</span>
                                <span class="ov-card-title">Leads par Statut</span>
                            </div>
                            <button class="ov-view-all" data-id="leads" onclick={handleNav}>Voir tout →</button>
                        </div>
                        <template if:true={hasStatusGroups}>
                            <div class="status-bars">
                                <template for:each={statusGroups} for:item="sg">
                                    <div key={sg.label} class="stat-row">
                                        <div class="stat-dot" style={sg.dotStyle}></div>
                                        <div class="stat-name">{sg.label}</div>
                                        <div class="stat-track">
                                            <div class="stat-fill" style={sg.segStyle}></div>
                                        </div>
                                        <div class="stat-pct">{sg.pct}%</div>
                                        <div class="stat-cnt">({sg.count})</div>
                                    </div>
                                </template>
                            </div>
                        </template>
                        <template if:false={hasStatusGroups}>
                            <p class="empty-hint">Aucun lead.</p>
                        </template>
                    </div>
                </div>

                <!-- Mini tables row -->
                <div class="overview-tables">
                    <div class="ov-card">
                        <div class="ov-card-header">
                            <h3 class="ov-card-title">Leads récents</h3>
                            <button class="ov-view-all" data-id="leads" onclick={handleNav}>Voir tout →</button>
                        </div>
                        <template for:each={recentLeadsMini} for:item="l">
                            <div key={l.leadId} class="mini-row">
                                <div class="mini-avatar" style={l.avatarStyle}>{l.initials}</div>
                                <div class="mini-info">
                                    <div class="mini-name">{l.name}</div>
                                    <div class="mini-sub">{l.company}</div>
                                </div>
                                <span class="mini-status-chip">{l.status}</span>
                            </div>
                        </template>
                    </div>

                    <div class="ov-card">
                        <div class="ov-card-header">
                            <h3 class="ov-card-title">Opportunités récentes</h3>
                            <button class="ov-view-all" data-id="pipeline" onclick={handleNav}>Voir tout →</button>
                        </div>
                        <template for:each={recentOppsMini} for:item="o">
                            <div key={o.oppId} class="mini-row">
                                <div class="mini-stage-dot" style={o.stageDotStyle}></div>
                                <div class="mini-info">
                                    <div class="mini-name">{o.name}</div>
                                    <div class="mini-sub">{o.accountName}</div>
                                </div>
                                <span class="mini-amount">{o.formattedAmount} €</span>
                            </div>
                        </template>
                    </div>
                </div>

            </div>
        </template>

        <!-- ══ LEADS ══════════════════════════════════════════════════════ -->
        <template if:true={isLeads}>
            <div class="tlx-content">

                <div class="leads-header">
                    <div class="leads-count-badge">{pendingLeadsCount} leads à convertir</div>
                    <div class="leads-filters">
                        <template for:each={leadFilterOptions} for:item="f">
                            <button key={f.value} class={f.cls}
                                    data-value={f.value} onclick={handleLeadFilter}>
                                {f.label}
                                <template if:true={f.count}>
                                    <span class="lf-badge">{f.count}</span>
                                </template>
                            </button>
                        </template>
                    </div>
                </div>

                <template if:true={hasFilteredLeads}>
                    <div class="leads-grid">
                        <template for:each={filteredLeads} for:item="lead">
                            <div key={lead.leadId} class={lead.cardCls}>

                                <div class="lc-header">
                                    <div class="lc-avatar" style={lead.avatarStyle}>{lead.initials}</div>
                                    <div class="lc-identity">
                                        <div class="lc-name">{lead.name}</div>
                                        <div class="lc-company">{lead.company}
                                            <template if:true={lead.industry}>
                                                <span class="lc-industry"> · {lead.industry}</span>
                                            </template>
                                        </div>
                                    </div>
                                    <div class="lc-header-right">
                                        <span class={lead.statusCls}>{lead.statusLabel}</span>
                                        <div class="lc-time">{lead.relativeTime}</div>
                                    </div>
                                </div>

                                <div class="lc-contact">
                                    <template if:true={lead.email}>
                                        <span class="lc-contact-item">📧 {lead.email}</span>
                                    </template>
                                    <template if:true={lead.phone}>
                                        <span class="lc-contact-item">📱 {lead.phone}</span>
                                    </template>
                                    <template if:true={lead.locationStr}>
                                        <span class="lc-contact-item">📍 {lead.locationStr}</span>
                                    </template>
                                </div>

                                <div class="lc-score-row">
                                    <span class="lc-score-lbl">Score</span>
                                    <div class="lc-score-track">
                                        <div class="lc-score-fill" style={lead.scoreStyle}></div>
                                    </div>
                                    <span class="lc-score-val">{lead.score}</span>
                                </div>

                                <template if:true={lead.description}>
                                    <div class="lc-desc">💬 {lead.description}</div>
                                </template>

                                <div class="lc-footer">
                                    <a href={lead.leadUrl} target="_blank" class="btn-view-lead">
                                        Voir profil →
                                    </a>
                                    <button class="btn-convert-lead"
                                            data-id={lead.leadId}
                                            onclick={handleOpenConvert}>
                                        ✅ Convertir en Client
                                    </button>
                                </div>

                            </div>
                        </template>
                    </div>
                </template>

                <template if:false={hasFilteredLeads}>
                    <div class="leads-empty">
                        <div class="leads-empty-icon">🎉</div>
                        <p>Aucun lead dans cette catégorie.</p>
                    </div>
                </template>

            </div>
        </template>

        <!-- ══ CONTACTS ═══════════════════════════════════════════════════ -->
        <template if:true={isContacts}>
            <div class="tlx-content">

                <div class="section-header">
                    <h2 class="section-title">Contacts</h2>
                    <span class="section-count">{contactsCount} contacts</span>
                </div>

                <template if:true={hasContacts}>
                    <div class="tlx-table-wrap">
                        <table class="tlx-table">
                            <thead>
                                <tr>
                                    <th>Nom</th>
                                    <th>Compte</th>
                                    <th>Email</th>
                                    <th>Téléphone</th>
                                    <th>Fonction</th>
                                    <th>Créé le</th>
                                </tr>
                            </thead>
                            <tbody>
                                <template for:each={contacts} for:item="c">
                                    <tr key={c.contactId}>
                                        <td>
                                            <div class="tbl-name-wrap">
                                                <div class="tbl-avatar" style={c.avatarStyle}>{c.initials}</div>
                                                <div>
                                                    <div class="tbl-name">{c.name}</div>
                                                    <div class="tbl-sub">{c.department}</div>
                                                </div>
                                            </div>
                                        </td>
                                        <td class="tbl-sub">{c.accountName}</td>
                                        <td class="tbl-email">{c.email}</td>
                                        <td class="tbl-phone">{c.phone}</td>
                                        <td class="tbl-sub">{c.title}</td>
                                        <td class="tbl-date">{c.createdDate}</td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                </template>

                <template if:false={hasContacts}>
                    <div class="leads-empty">
                        <div class="leads-empty-icon">👤</div>
                        <p>Aucun contact trouvé.</p>
                    </div>
                </template>

            </div>
        </template>

        <!-- ══ PIPELINE ═══════════════════════════════════════════════════ -->
        <template if:true={isPipeline}>
            <div class="tlx-content">

                <div class="section-header">
                    <h2 class="section-title">Pipeline Opportunités</h2>
                    <span class="section-count">{recentOpps.length} opportunités</span>
                </div>

                <template if:true={hasRecentOpps}>
                    <div class="pipeline-table-wrap">
                        <table class="pipeline-table">
                            <thead>
                                <tr>
                                    <th>Opportunité</th>
                                    <th>Compte</th>
                                    <th>Étape</th>
                                    <th>Montant</th>
                                    <th>Paiement</th>
                                    <th>Clôture</th>
                                </tr>
                            </thead>
                            <tbody>
                                <template for:each={recentOpps} for:item="opp">
                                    <tr key={opp.oppId} class={opp.rowClass}>
                                        <td class="pt-name">{opp.name}</td>
                                        <td class="pt-account">{opp.accountName}</td>
                                        <td><span class={opp.stageClass}>{opp.stageName}</span></td>
                                        <td class="pt-amount">{opp.formattedAmount} €</td>
                                        <td><span class={opp.payClass}>{opp.paymentStatus}</span></td>
                                        <td class="pt-date">{opp.closeDate}</td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                </template>
                <template if:false={hasRecentOpps}>
                    <div class="leads-empty">
                        <div class="leads-empty-icon">📈</div>
                        <p>Aucune opportunité trouvée.</p>
                    </div>
                </template>

            </div>
        </template>

        <!-- ══ DEVIS ══════════════════════════════════════════════════════ -->
        <template if:true={isQuotes}>
            <div class="tlx-content tlx-content-flush">
                <c-admin-quote-manager></c-admin-quote-manager>
            </div>
        </template>

        <!-- ══ COMMANDES ══════════════════════════════════════════════════ -->
        <template if:true={isOrders}>
            <div class="tlx-content">

                <div class="section-header">
                    <h2 class="section-title">Commandes</h2>
                    <span class="section-count">{ordersCount} commandes</span>
                </div>

                <template if:true={hasOrders}>
                    <div class="tlx-table-wrap">
                        <table class="tlx-table">
                            <thead>
                                <tr>
                                    <th>N° Commande</th>
                                    <th>Compte</th>
                                    <th>Statut</th>
                                    <th>Montant</th>
                                    <th>Date effective</th>
                                    <th>Créé le</th>
                                </tr>
                            </thead>
                            <tbody>
                                <template for:each={orders} for:item="o">
                                    <tr key={o.orderId}>
                                        <td class="tbl-name">{o.orderNumber}</td>
                                        <td class="tbl-sub">{o.accountName}</td>
                                        <td><span class={o.statusCls}>{o.status}</span></td>
                                        <td class="tbl-amount">{o.amountFmt}</td>
                                        <td class="tbl-date">{o.effectiveDate}</td>
                                        <td class="tbl-date">{o.createdDate}</td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                </template>
                <template if:false={hasOrders}>
                    <div class="leads-empty">
                        <div class="leads-empty-icon">📦</div>
                        <p>Aucune commande trouvée.</p>
                    </div>
                </template>

            </div>
        </template>

        <!-- ══ SUPPORT / CASES ════════════════════════════════════════════ -->
        <template if:true={isCases}>
            <div class="tlx-content">

                <div class="section-header">
                    <h2 class="section-title">Support & Cases</h2>
                    <span class="section-count">{casesCount} cases</span>
                </div>

                <template if:true={hasCases}>
                    <div class="tlx-table-wrap">
                        <table class="tlx-table">
                            <thead>
                                <tr>
                                    <th>N° Case</th>
                                    <th>Sujet</th>
                                    <th>Compte</th>
                                    <th>Contact</th>
                                    <th>Statut</th>
                                    <th>Priorité</th>
                                    <th>Créé le</th>
                                </tr>
                            </thead>
                            <tbody>
                                <template for:each={cases} for:item="c">
                                    <tr key={c.caseId}>
                                        <td class="tbl-name">#{c.caseNumber}</td>
                                        <td>{c.subject}</td>
                                        <td class="tbl-sub">{c.accountName}</td>
                                        <td class="tbl-sub">{c.contactName}</td>
                                        <td><span class={c.statusCls}>{c.status}</span></td>
                                        <td><span class={c.priorityCls}>{c.priority}</span></td>
                                        <td class="tbl-date">{c.createdDate}</td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                </template>
                <template if:false={hasCases}>
                    <div class="leads-empty">
                        <div class="leads-empty-icon">🎫</div>
                        <p>Aucun case trouvé.</p>
                    </div>
                </template>

            </div>
        </template>

    </div>
    <!-- end workspace -->

    <!-- ══ CONVERSION MODAL ═════════════════════════════════════════════════ -->
    <template if:true={showConvertModal}>
        <div class="tlx-backdrop" onclick={handleCloseConvert}></div>
        <div class="tlx-modal">

            <div class="tlx-modal-header">
                <div>
                    <h2 class="tlx-modal-title">Convertir en Client</h2>
                    <p class="tlx-modal-sub">Créer un compte, contact et opportunité</p>
                </div>
                <button class="tlx-modal-close" onclick={handleCloseConvert}>✕</button>
            </div>

            <div class="conv-lead-summary">
                <div class="cls-avatar" style={convertingAvatarStyle}>{convertingInitials}</div>
                <div class="cls-info">
                    <div class="cls-name">{convertingName}</div>
                    <div class="cls-meta">{convertingCompany} · {convertingEmail}</div>
                </div>
                <div class="cls-score">Score <strong>{convertingScore}</strong></div>
            </div>

            <div class="tlx-modal-body">
                <div class="conv-section-title">Opportunité à créer</div>

                <div class="conv-field">
                    <label>Nom de l'opportunité *</label>
                    <input type="text" value={convOppName} data-field="convOppName"
                           onchange={handleConvField} class="conv-input"
                           placeholder="ex: ACME — Projet ERP TALCORE"/>
                </div>

                <div class="conv-form-2col">
                    <div class="conv-field">
                        <label>Montant estimé (€)</label>
                        <input type="number" value={convAmount} data-field="convAmount"
                               onchange={handleConvField} class="conv-input" placeholder="0"/>
                    </div>
                    <div class="conv-field">
                        <label>Date de clôture prévue</label>
                        <input type="date" value={convCloseDate} data-field="convCloseDate"
                               onchange={handleConvField} class="conv-input"/>
                    </div>
                </div>

                <div class="conv-field">
                    <label>Étape</label>
                    <select data-field="convStage" onchange={handleConvField} class="conv-input conv-select">
                        <template for:each={stageOptions} for:item="s">
                            <option key={s.value} value={s.value} selected={s.isSelected}>{s.label}</option>
                        </template>
                    </select>
                </div>

                <div class="conv-email-notice">
                    <span class="conv-notice-icon">📧</span>
                    <div>
                        <div class="conv-notice-title">Emails automatiques</div>
                        <div class="conv-notice-body">
                            Un email de bienvenue sera envoyé à <strong>{convertingEmail}</strong>.
                            Vous recevrez également une confirmation de conversion.
                        </div>
                    </div>
                </div>
            </div>

            <div class="tlx-modal-footer">
                <button class="conv-btn-cancel" onclick={handleCloseConvert}>Annuler</button>
                <button class="conv-btn-confirm" onclick={handleConvertConfirm} disabled={converting}>
                    <template if:true={converting}>Conversion en cours…</template>
                    <template if:false={converting}>✅ Convertir &amp; Envoyer Email</template>
                </button>
            </div>

        </div>
    </template>

    <!-- ══ SUCCESS BANNER ═══════════════════════════════════════════════════ -->
    <template if:true={showSuccessBanner}>
        <div class="tlx-success-banner">
            <span>🎉</span>
            <span>{successMessage}</span>
        </div>
    </template>

</div>
</template>

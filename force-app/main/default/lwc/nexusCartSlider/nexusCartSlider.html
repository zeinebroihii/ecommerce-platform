<template>
  <!-- ── Toggle Tab ── -->
  <template if:true={showToggleTab}>
    <div class="ncs-toggle-tab" onclick={handleToggleTab}>
      <div class="ncs-toggle-icon">
        <svg
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <circle cx="9" cy="21" r="1" />
          <circle cx="20" cy="21" r="1" />
          <path
            d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"
          />
        </svg>
        <template if:true={hasItems}>
          <div class="ncs-toggle-badge">{cartCount}</div>
        </template>
      </div>
      <div class="ncs-toggle-label">My Cart</div>
      <div class={toggleChevronClass}>
        <svg
          width="14"
          height="14"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <polyline points="9 18 15 12 9 6" />
        </svg>
      </div>
    </div>
  </template>

  <!-- ── Main Panel ── -->
  <template if:true={isPanelVisible}>
    <!-- Backdrop -->
    <div class="ncs-backdrop" onclick={handleBackdropClick}></div>

    <!-- Panel -->
    <div class="ncs-panel">
      <!-- Left-edge close arrow -->
      <button class="ncs-panel-arrow" onclick={handleClose} title="Close cart">
        <svg
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
        >
          <polyline points="15 18 9 12 15 6" />
        </svg>
      </button>

      <!-- Top bar -->
      <div class="ncs-top-bar">
        <div class="ncs-top-bar-label">
          <svg
            width="12"
            height="12"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <circle cx="9" cy="21" r="1" />
            <circle cx="20" cy="21" r="1" />
            <path
              d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"
            />
          </svg>
          <span>Cart</span>
        </div>
        <div class="ncs-top-bar-count">
          {cartCount} item<template if:false={isSingleItem}>s</template>
        </div>
        <button class="ncs-view-full-btn" onclick={handleViewFullCart}>
          View Cart Page
          <svg
            width="10"
            height="10"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
          >
            <polyline points="9 18 15 12 9 6" />
          </svg>
        </button>
      </div>

      <!-- Header -->
      <div class="ncs-header">
        <div class="ncs-header-left">
          <div class="ncs-header-icon">
            <svg
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="9" cy="21" r="1" />
              <circle cx="20" cy="21" r="1" />
              <path
                d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"
              />
            </svg>
          </div>
          <h2 class="ncs-header-title">My Cart</h2>
        </div>
        <div class="ncs-header-right">
          <button class="ncs-minimize-btn" onclick={handleMinimize}>
            <svg
              width="14"
              height="14"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <polyline points="9 18 15 12 9 6" />
            </svg>
            Minimize
          </button>
          <button class="ncs-close-btn" onclick={handleClose}>
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <line x1="18" y1="6" x2="6" y2="18" />
              <line x1="6" y1="6" x2="18" y2="18" />
            </svg>
          </button>
        </div>
      </div>

      <!-- Items -->
      <div class="ncs-items">
        <template if:true={hasItems}>
          <template for:each={cartItemsEnriched} for:item="item">
            <div key={item.itemId} class="ncs-item-row">
              <div class="ncs-item-img-wrap">
                <img
                  src={item.imageUrl}
                  alt={item.name}
                  class="ncs-item-img"
                  referrerpolicy="no-referrer"
                />
              </div>
              <div class="ncs-item-info">
                <h4 class="ncs-item-name">{item.name}</h4>
                <div class="ncs-qty-row">
                  <div class="ncs-qty-controls">
                    <button
                      class="ncs-qty-btn"
                      data-item-id={item.itemId}
                      onclick={handleDecreaseQty}
                    >
                      -
                    </button>
                    <span class="ncs-qty-val">{item.quantity}</span>
                    <button
                      class="ncs-qty-btn"
                      data-item-id={item.itemId}
                      onclick={handleIncreaseQty}
                    >
                      +
                    </button>
                  </div>
                  <span class="ncs-unit-price"
                    >${item.unitPriceFormatted} / unit</span
                  >
                </div>
              </div>
              <div class="ncs-item-right">
                <span class="ncs-item-total">${item.lineTotalFormatted}</span>
                <button
                  class="ncs-remove-btn"
                  data-item-id={item.itemId}
                  onclick={handleRemoveItem}
                  title="Remove"
                >
                  <svg
                    width="16"
                    height="16"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                  >
                    <polyline points="3 6 5 6 21 6" />
                    <path d="M19 6l-1 14H6L5 6" />
                    <path d="M10 11v6" />
                    <path d="M14 11v6" />
                    <path d="M9 6V4h6v2" />
                  </svg>
                </button>
              </div>
            </div>
          </template>
        </template>
        <template if:true={isEmpty}>
          <div class="ncs-empty">
            <div class="ncs-empty-icon">
              <svg
                width="40"
                height="40"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
              >
                <circle cx="9" cy="21" r="1" />
                <circle cx="20" cy="21" r="1" />
                <path
                  d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"
                />
              </svg>
            </div>
            <p class="ncs-empty-title">Your cart is empty</p>
            <p class="ncs-empty-desc">Browse the catalog to add products.</p>
          </div>
        </template>
      </div>

      <!-- Footer -->
      <div class="ncs-footer">
        <div class="ncs-footer-total">
          <span class="ncs-total-label">Subtotal</span>
          <span class="ncs-total-val">${subtotalFormatted}</span>
        </div>
        <p class="ncs-footer-hint">
          Taxes &amp; shipping calculated at checkout
        </p>
        <div class="ncs-footer-btns">
          <button class="ncs-quote-btn" onclick={handleRequestQuote}>
            <svg
              width="14"
              height="14"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path
                d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"
              />
              <polyline points="14 2 14 8 20 8" />
              <line x1="16" y1="13" x2="8" y2="13" />
              <line x1="16" y1="17" x2="8" y2="17" />
              <polyline points="10 9 9 9 8 9" />
            </svg>
            Request Formal Quote
          </button>
          <button class="ncs-checkout-btn" onclick={handleCheckout}>
            Checkout
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <polyline points="9 18 15 12 9 6" />
            </svg>
          </button>
        </div>
      </div>
    </div>
  </template>
</template>

<template>
    <div class="npdv-wrap" onscroll={handleScroll}>

        <!-- ── Breadcrumb Nav ── -->
        <div class="npdv-breadcrumb-bar">
            <div class="npdv-breadcrumb-inner">
                <div class="npdv-breadcrumbs">
                    <button class="npdv-bc-btn" onclick={handleClose}>Home</button>
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>
                    <span class="npdv-bc-text">{productCategory}</span>
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>
                    <span class="npdv-bc-text">{productSubcategory}</span>
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>
                    <span class="npdv-bc-code">{productCode}</span>
                </div>
                <button class="npdv-back-btn" onclick={handleClose}>
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
                    Back to Catalog
                </button>
            </div>
        </div>

        <!-- ── Sticky Tab Nav (visible after scroll) ── -->
        <template if:true={showStickyNav}>
            <div class="npdv-sticky-nav">
                <div class="npdv-sticky-inner">
                    <button class={tab1Cls} data-tab="specs"    onclick={handleTabClick}>Specifications</button>
                    <button class={tab2Cls} data-tab="reviews"  onclick={handleTabClick}>Reviews {reviewCountLabel}</button>
                    <button class={tab3Cls} data-tab="similar"  onclick={handleTabClick}>Similar Products</button>
                    <button class={tab4Cls} data-tab="warranty" onclick={handleTabClick}>Warranty &amp; Returns</button>
                </div>
            </div>
        </template>

        <!-- ── Two-column layout ── -->
        <div class="npdv-two-col">

            <!-- ══ LEFT COLUMN: Gallery + Overview ══ -->
            <div class="npdv-col-left">

                <!-- Image Gallery -->
                <div class="npdv-gallery">
                    <div class="npdv-img-wrap">
                        <img src={currentImage} alt={productName} class="npdv-main-img" referrerpolicy="no-referrer"/>
                        <button class={favBtnCls} onclick={handleToggleFavorite}>
                            <svg width="20" height="20" viewBox="0 0 24 24" fill={favFill} stroke="currentColor" stroke-width="2" stroke-linecap="round">
                                <path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/>
                            </svg>
                        </button>
                    </div>

                    <!-- Thumbnails -->
                    <template if:true={hasColors}>
                        <div class="npdv-thumbnails">
                            <template for:each={colorThumbs} for:item="col">
                                <button key={col.hex}
                                        class={col.thumbCls}
                                        data-idx={col.idx}
                                        onclick={handleColorSelect}>
                                    <img src={col.image} alt={col.name} class="npdv-thumb-img" referrerpolicy="no-referrer"/>
                                </button>
                            </template>
                        </div>
                    </template>
                </div>

                <!-- Overview Panel -->
                <div class="npdv-overview-panel">
                    <h2 class="npdv-section-title">Product Overview</h2>
                    <p class="npdv-overview-desc">{productDescription}</p>
                    <div class="npdv-features-grid">
                        <template for:each={featureCards} for:item="feat">
                            <div key={feat.label} class="npdv-feature-card">
                                <div class="npdv-feature-icon">
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
                                </div>
                                <div>
                                    <h4 class="npdv-feature-name">{feat.label}</h4>
                                    <p class="npdv-feature-sub">Advanced engineering ensures peak performance in critical environments.</p>
                                </div>
                            </div>
                        </template>
                    </div>
                    <div class="npdv-highlights-card">
                        <h3 class="npdv-highlights-title">Key Highlights</h3>
                        <ul class="npdv-highlights-list">
                            <li class="npdv-highlight-item"><span class="npdv-dot"></span>Next-Gen Architecture</li>
                            <li class="npdv-highlight-item"><span class="npdv-dot"></span>Optimized for Scale</li>
                            <li class="npdv-highlight-item"><span class="npdv-dot"></span>Industry-Leading Security</li>
                            <li class="npdv-highlight-item"><span class="npdv-dot"></span>Global Compatibility</li>
                        </ul>
                    </div>
                </div>

            </div>

            <!-- ══ RIGHT COLUMN: Sidebar + All Sections ══ -->
            <div class="npdv-col-right">

                <!-- Purchase Sidebar -->
                <div class="npdv-sidebar">

                    <!-- Header -->
                    <div class="npdv-sidebar-header">
                        <div class="npdv-sidebar-meta">
                            <span class="npdv-brand-badge">{productBrand}</span>
                            <span class="npdv-item-code">Item#: {productCode}</span>
                        </div>
                        <h1 class="npdv-product-name">{productName}</h1>
                        <div class="npdv-rating-row">
                            <div class="npdv-stars">
                                <template for:each={sidebarStars} for:item="s">
                                    <span key={s.val} class={s.cls}>&#9733;</span>
                                </template>
                            </div>
                            <span class="npdv-review-count">{reviewCountLabel}</span>
                            <template if:true={canWriteReview}>
                                <div class="npdv-sep"></div>
                                <button class="npdv-write-review" onclick={handleWriteReview}>Write a Review</button>
                            </template>
                        </div>
                    </div>

                    <!-- Price Box -->
                    <div class="npdv-price-box">
                        <div class="npdv-price-row">
                            <span class="npdv-price">${productPrice}</span>
                            <span class="npdv-price-cents">.99</span>
                            <span class="npdv-price-currency">USD</span>
                        </div>

                        <div class="npdv-stock-info">
                            <div class="npdv-stock-row">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
                                <span>In Stock &amp; Ready to Ship</span>
                            </div>
                            <div class="npdv-stock-row">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6366f1" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
                                <span>Free Global Shipping</span>
                            </div>
                        </div>

                        <div class="npdv-action-grid">
                            <button class="npdv-cart-btn" onclick={handleAddToCart}>
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 002 1.61h9.72a2 2 0 001.97-1.67l1.38-7.33H6"/></svg>
                                Add to Cart
                            </button>
                            <button class="npdv-quote-outline-btn" onclick={handleQuoteTypeOpen}>
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
                                Request Quote
                            </button>
                        </div>
                    </div>

                    <!-- Enterprise Benefits -->
                    <div class="npdv-benefits-box">
                        <h4 class="npdv-benefits-title">Enterprise Benefits</h4>
                        <div class="npdv-benefits-grid">
                            <div class="npdv-benefit-item">
                                <span class="npdv-benefit-label">Warranty</span>
                                <span class="npdv-benefit-val">{productWarranty}</span>
                            </div>
                            <div class="npdv-benefit-item">
                                <span class="npdv-benefit-label">Support</span>
                                <span class="npdv-benefit-val">24/7 Priority</span>
                            </div>
                        </div>
                    </div>

                </div>

                <!-- ── Specifications ── -->
                <section id="section-specs" class="npdv-section">
                    <h2 class="npdv-section-title">Technical Specifications</h2>
                    <div class="npdv-specs-table">
                        <template for:each={specEntries} for:item="spec">
                            <div key={spec.key} class="npdv-spec-cell">
                                <span class="npdv-spec-key">{spec.key}</span>
                                <span class="npdv-spec-val">{spec.value}</span>
                            </div>
                        </template>
                        <div class="npdv-spec-cell">
                            <span class="npdv-spec-key">Warranty</span>
                            <span class="npdv-spec-val">{productWarranty}</span>
                        </div>
                        <div class="npdv-spec-cell">
                            <span class="npdv-spec-key">Origin</span>
                            <span class="npdv-spec-val">Global Manufacturing</span>
                        </div>
                    </div>
                </section>

                <!-- ── Reviews ── -->
                <section id="section-reviews" class="npdv-section">
                    <div class="npdv-reviews-header">
                        <h2 class="npdv-section-title">Customer Reviews</h2>
                        <!-- Write Review button: only if eligible -->
                        <template if:true={canWriteReview}>
                            <button class="npdv-write-review-btn" onclick={handleWriteReview}>Write a Review</button>
                        </template>
                        <!-- Not purchased -->
                        <template if:true={showPurchaseRequiredMsg}>
                            <span class="npdv-review-gate-msg">
                                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
                                Only customers who purchased this product can write a review.
                            </span>
                        </template>
                        <!-- Already reviewed -->
                        <template if:true={showAlreadyReviewedMsg}>
                            <span class="npdv-review-gate-msg npdv-review-gate-msg--done">
                                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
                                You have already reviewed this product.
                            </span>
                        </template>
                        <!-- Guest -->
                        <template if:false={isAuthenticated}>
                            <button class="npdv-write-review-btn" onclick={handleWriteReview}>Write a Review</button>
                        </template>
                    </div>

                    <!-- Loading state -->
                    <template if:true={_reviewsLoading}>
                        <div class="npdv-reviews-loading">
                            <div class="npdv-reviews-spinner"></div>
                            <span>Loading reviews…</span>
                        </div>
                    </template>

                    <template if:false={_reviewsLoading}>
                        <div class="npdv-reviews-grid">

                            <!-- ── Score Card ── -->
                            <div class="npdv-score-card">
                                <div class="npdv-score-num">{formattedAvgRating}</div>
                                <div class="npdv-score-stars">
                                    <template for:each={scoreStars} for:item="s">
                                        <span key={s.val} class={s.cls}>&#9733;</span>
                                    </template>
                                </div>
                                <p class="npdv-score-sub">{reviewScoreSubLabel}</p>
                                <template if:true={hasVerifiedInfo}>
                                    <p class="npdv-score-verified">{verifiedPercentLabel}</p>
                                </template>
                            </div>

                            <!-- ── Review list ── -->
                            <div class="npdv-review-list">
                                <template if:true={hasReviews}>
                                    <template for:each={_reviews} for:item="rev">
                                        <div key={rev.reviewId} class="npdv-review-card">
                                            <div class="npdv-review-top">
                                                <div class="npdv-reviewer">
                                                    <div class="npdv-avatar npdv-avatar--initials">
                                                        {rev.initials}
                                                    </div>
                                                    <div>
                                                        <div class="npdv-reviewer-name">{rev.customerName}</div>
                                                        <div class="npdv-reviewer-date">{rev.createdDate}</div>
                                                    </div>
                                                </div>
                                                <div class="npdv-review-right">
                                                    <div class="npdv-review-stars">
                                                        <template for:each={rev.stars} for:item="s">
                                                            <span key={s.val} class={s.cls}>&#9733;</span>
                                                        </template>
                                                    </div>
                                                    <template if:true={rev.verifiedPurchase}>
                                                        <span class="npdv-verified-badge">
                                                            <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>
                                                            Verified Purchase
                                                        </span>
                                                    </template>
                                                </div>
                                            </div>
                                            <template if:true={rev.reviewTitle}>
                                                <h4 class="npdv-review-title">{rev.reviewTitle}</h4>
                                            </template>
                                            <p class="npdv-review-body">{rev.reviewBody}</p>
                                        </div>
                                    </template>
                                </template>
                                <template if:false={hasReviews}>
                                    <div class="npdv-no-reviews">
                                        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#cbd5e1" stroke-width="1.5"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
                                        <p>No reviews yet. Be the first to share your experience!</p>
                                    </div>
                                </template>
                            </div>

                        </div>
                    </template>
                </section>

                <!-- ── Similar Products ── -->
                <section id="section-similar" class="npdv-section">
                    <h2 class="npdv-section-title">Similar Products</h2>
                    <div class="npdv-similar-grid">
                        <template for:each={similarProducts} for:item="sim">
                            <div key={sim.id} class="npdv-similar-card">
                                <div class="npdv-similar-img-wrap">
                                    <img src={sim.image} alt={sim.name} class="npdv-similar-img" referrerpolicy="no-referrer"/>
                                </div>
                                <h4 class="npdv-similar-name">{sim.name}</h4>
                                <div class="npdv-similar-price">{sim.price}</div>
                                <button class="npdv-similar-btn"
                                        data-id={sim.id}
                                        onclick={handleSimilarProductClick}>View Details</button>
                            </div>
                        </template>
                    </div>
                </section>

                <!-- ── Warranty ── -->
                <section id="section-warranty" class="npdv-section">
                    <div class="npdv-warranty-box">
                        <h2 class="npdv-section-title">Warranty &amp; Returns</h2>
                        <p class="npdv-warranty-intro">
                            Every Nexus product is backed by our comprehensive 3-year limited warranty. We stand behind the quality and reliability of our hardware, ensuring your operations remain uninterrupted.
                        </p>
                        <div class="npdv-warranty-grid">
                            <div class="npdv-warranty-item">
                                <h4 class="npdv-warranty-label">Return Policy</h4>
                                <p class="npdv-warranty-text">30-day hassle-free returns for all unopened products. Restocking fees may apply for opened items.</p>
                            </div>
                            <div class="npdv-warranty-item">
                                <h4 class="npdv-warranty-label">Support Coverage</h4>
                                <p class="npdv-warranty-text">24/7 technical support included for the duration of the warranty period.</p>
                            </div>
                        </div>
                    </div>
                </section>

            </div>
        </div>

        <!-- ── Client Type Selection Overlay ── -->
        <template if:true={showClientTypeModal}>
            <div class="npdv-quote-backdrop" onclick={handleClientTypeBackdropClick}>
                <div class="npdv-quote-modal npdv-client-modal" onclick={handleClientTypeModalClick}>
                    <div class="npdv-quote-header">
                        <div>
                            <h2 class="npdv-quote-title">Request a Quote</h2>
                            <p class="npdv-quote-subtitle">Who are you?</p>
                        </div>
                        <button class="npdv-quote-close" onclick={handleClientTypeClose}>
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
                                <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
                            </svg>
                        </button>
                    </div>
                    <div class="npdv-client-choice-body">
                        <button class="npdv-client-btn npdv-client-btn--b2b" data-type="b2b" onclick={handleClientTypeSelect}>
                            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                            <span class="npdv-client-btn-label">B2B Enterprise</span>
                            <span class="npdv-client-btn-sub">Entreprise / Organisation</span>
                        </button>
                        <button class="npdv-client-btn npdv-client-btn--b2c" data-type="b2c" onclick={handleClientTypeSelect}>
                            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                            <span class="npdv-client-btn-label">B2C Individual</span>
                            <span class="npdv-client-btn-sub">Client particulier</span>
                        </button>
                    </div>
                </div>
            </div>
        </template>

        <!-- ── Quote Form Overlay ── -->
        <template if:true={showQuoteForm}>
            <div class="npdv-quote-backdrop" onclick={handleQuoteBackdropClick}>
                <div class="npdv-quote-modal" onclick={handleQuoteModalClick}>
                    <div class="npdv-quote-header">
                        <div>
                            <h2 class="npdv-quote-title">Request a Quote</h2>
                            <p class="npdv-quote-subtitle">{productName} — {productCode}</p>
                        </div>
                        <button class="npdv-quote-close" onclick={handleQuoteClose}>
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
                                <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
                            </svg>
                        </button>
                    </div>
                    <div class="npdv-quote-body">
                        <div class="npdv-qfield">
                            <label class="npdv-qlabel">Company Name</label>
                            <input type="text" class="npdv-qinput" placeholder="Acme Corp" data-field="company" oninput={handleQuoteField}/>
                        </div>
                        <div class="npdv-qfield">
                            <label class="npdv-qlabel">Contact Email</label>
                            <input type="email" class="npdv-qinput" placeholder="you@company.com" data-field="email" oninput={handleQuoteField}/>
                        </div>
                        <div class="npdv-qfield">
                            <label class="npdv-qlabel">Quantity</label>
                            <input type="number" class="npdv-qinput" placeholder="1" data-field="quantity" oninput={handleQuoteField}/>
                        </div>
                        <div class="npdv-qfield">
                            <label class="npdv-qlabel">Message</label>
                            <textarea class="npdv-qinput npdv-qtextarea" placeholder="Tell us about your requirements..." data-field="message" oninput={handleQuoteField}></textarea>
                        </div>
                        <button class="npdv-qsubmit" onclick={handleQuoteSubmit}>Submit Quote Request</button>
                    </div>
                </div>
            </div>
        </template>

        <!-- ── Review Form Overlay ── -->
        <template if:true={showReviewForm}>
            <div class="npdv-quote-backdrop" onclick={handleReviewBackdropClick}>
                <div class="npdv-quote-modal" onclick={handleReviewModalClick}>
                    <div class="npdv-quote-header">
                        <div>
                            <h2 class="npdv-quote-title">Write a Review</h2>
                            <p class="npdv-quote-subtitle">{productName}</p>
                        </div>
                        <button class="npdv-quote-close" onclick={handleReviewClose}>
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
                                <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
                            </svg>
                        </button>
                    </div>
                    <div class="npdv-quote-body">
                        <!-- Verified purchase notice -->
                        <div class="npdv-review-verified-notice">
                            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
                            Your review will be marked as a <strong>Verified Purchase</strong>.
                        </div>
                        <!-- Star selector -->
                        <div class="npdv-qfield">
                            <label class="npdv-qlabel">Your Rating</label>
                            <div class="npdv-review-star-row">
                                <template for:each={reviewStars} for:item="s">
                                    <button key={s.val} class={s.cls}
                                            data-val={s.val}
                                            onclick={handleReviewStar}>&#9733;</button>
                                </template>
                            </div>
                        </div>
                        <div class="npdv-qfield">
                            <label class="npdv-qlabel">Review Title</label>
                            <input type="text" class="npdv-qinput" placeholder="Summarize your experience" data-field="title" oninput={handleReviewField}/>
                        </div>
                        <div class="npdv-qfield">
                            <label class="npdv-qlabel">Your Review <span class="npdv-required">*</span></label>
                            <textarea class="npdv-qinput npdv-qtextarea" placeholder="Tell others what you think about this product..." data-field="body" oninput={handleReviewField}></textarea>
                        </div>
                        <!-- Error message -->
                        <template if:true={_submitError}>
                            <div class="npdv-review-error">{_submitError}</div>
                        </template>
                        <button class="npdv-qsubmit" onclick={handleReviewSubmit} disabled={_submitLoading}>
                            <template if:true={_submitLoading}>Submitting…</template>
                            <template if:false={_submitLoading}>Submit Review</template>
                        </button>
                    </div>
                </div>
            </div>
        </template>

    </div>
</template>

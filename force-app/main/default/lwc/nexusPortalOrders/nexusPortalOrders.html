<template>
    <div class="npos-wrap">

        <!-- Header -->
        <div class="npos-header">
            <div class="npos-header-left">
                <h2 class="npos-title">Commandes</h2>
                <span class="npos-live-badge">
                    <span class="npos-live-dot"></span>
                    Suivi en direct
                </span>
            </div>
            <span class="npos-count-badge">{orderCountLabel}</span>
        </div>

        <!-- Filters + Search -->
        <div class="npos-toolbar">
            <div class="npos-filters">
                <template for:each={filterTabs} for:item="tab">
                    <button
                        key={tab.id}
                        class={tab.btnClass}
                        data-id={tab.id}
                        onclick={handleFilterChange}
                    >{tab.label}</button>
                </template>
            </div>
            <div class="npos-search-wrap">
                <lightning-icon icon-name="utility:search" size="xx-small" class="npos-search-icon"></lightning-icon>
                <input
                    type="text"
                    class="npos-search"
                    placeholder="Rechercher une commande..."
                    value={searchTerm}
                    oninput={handleSearch}
                />
            </div>
        </div>

        <!-- Order list -->
        <template if:true={hasOrders}>
            <div class="npos-list">
                <template for:each={filteredOrders} for:item="order">
                    <c-nexus-portal-order-row
                        key={order.orderId}
                        order-id={order.orderId}
                        order-number={order.orderNumber}
                        order-date={order.orderDate}
                        formatted-total={order.formattedTotal}
                        status={order.status}
                        onviewdetails={handleViewDetails}
                    ></c-nexus-portal-order-row>
                </template>
            </div>
        </template>

        <!-- Empty state -->
        <template if:false={hasOrders}>
            <div class="npos-empty">
                <div class="npos-empty-icon">
                    <lightning-icon icon-name="utility:package" size="large"></lightning-icon>
                </div>
                <h3 class="npos-empty-title">Aucune commande trouvée</h3>
                <p class="npos-empty-sub">Vos commandes apparaîtront ici une fois passées.</p>
            </div>
        </template>

        <!-- Order Detail Modal -->
        <template if:true={showDetailModal}>
            <div class="npos-overlay" onclick={handleCloseModal}>
                <div class="npos-modal" onclick={stopPropagation}>

                    <!-- Modal Header -->
                    <div class="npos-modal-header">
                        <div>
                            <h3 class="npos-modal-title">{selectedOrder.orderNumber}</h3>
                            <p class="npos-modal-sub">{selectedOrder.orderDate}</p>
                        </div>
                        <button class="npos-modal-close" onclick={handleCloseModal}>&#x2715;</button>
                    </div>

                    <!-- Stats row -->
                    <div class="npos-modal-stats">
                        <div class="npos-stat">
                            <div class="npos-stat-label">Statut</div>
                            <span class={selectedStatusBadge}>{selectedOrder.status}</span>
                        </div>
                        <div class="npos-stat">
                            <div class="npos-stat-label">Total</div>
                            <div class="npos-stat-value npos-stat--indigo">{selectedOrder.formattedTotal}</div>
                        </div>
                        <div class="npos-stat">
                            <div class="npos-stat-label">Articles</div>
                            <div class="npos-stat-value">{selectedOrder.itemCount}</div>
                        </div>
                    </div>

                    <!-- Timeline -->
                    <div class="npos-timeline">
                        <div class="npos-timeline-line"></div>
                        <template for:each={orderTimeline} for:item="step">
                            <div key={step.label} class="npos-timeline-step">
                                <div class={step.dotClass}></div>
                                <div class="npos-step-body">
                                    <div class="npos-step-label">{step.label}</div>
                                    <div class="npos-step-date">{step.date}</div>
                                </div>
                            </div>
                        </template>
                    </div>

                    <!-- Footer -->
                    <div class="npos-modal-footer">
                        <button class="npos-track-btn">
                            <lightning-icon icon-name="utility:truck" size="xx-small" class="npos-track-icon"></lightning-icon>
                            Suivre la livraison
                        </button>
                        <button class="npos-close-btn" onclick={handleCloseModal}>Fermer</button>
                    </div>

                </div>
            </div>
        </template>

    </div>
</template>

<template>
    <div class="npcs-card">
        <h4 class="npcs-title">R&eacute;capitulatif</h4>

        <!-- Rows -->
        <div class="npcs-rows">
            <div class="npcs-row">
                <span class="npcs-key">Sous-total</span>
                <span class="npcs-val">{formattedSubtotal}</span>
            </div>
            <div class="npcs-row">
                <span class="npcs-key">Livraison</span>
                <span class="npcs-val npcs-val--green">Gratuit</span>
            </div>
            <div class="npcs-divider"></div>
            <div class="npcs-total-row">
                <div>
                    <span class="npcs-total-label">Total &agrave; payer</span>
                    <span class="npcs-total-sub">TVA incluse</span>
                </div>
                <span class="npcs-total-amount">{formattedSubtotal}</span>
            </div>
        </div>

        <!-- Actions -->
        <div class="npcs-actions">
            <button class="npcs-btn-order" onclick={handlePlaceOrder}>
                Passer la commande
            </button>
            <div class="npcs-sep"></div>
            <button class="npcs-btn-quote" onclick={handleRequestQuote}>
                Request Formal Quote
            </button>
        </div>
    </div>
</template>

<template>
  <div class="nlf-wrap" id="nlf-anchor">
    <!-- ══ SUCCESS STATE ══ -->
    <template if:true={isSubmitted}>
      <div class="nlf-success">
        <div class="nlf-success-icon">
          <lightning-icon
            icon-name="utility:check"
            size="large"
            variant="inverse"
          ></lightning-icon>
        </div>
        <h2 class="nlf-success-title">Application Received!</h2>
        <p class="nlf-success-body">
          Thank you for your trust. Our team is reviewing your profile. Your
          access credentials will be sent by email within 24 hours.
        </p>
      </div>
    </template>

    <!-- ══ FORM ══ -->
    <template if:false={isSubmitted}>
      <div class="nlf-card">
        <!-- Header -->
        <div class="nlf-header">
          <div class="nlf-step-pill">{stepLabel}</div>
          <h2 class="nlf-header-title">{stepTitle}</h2>
          <p class="nlf-header-desc">{stepDesc}</p>
          <div class="nlf-blob"></div>
        </div>

        <!-- ── STEP 1: Personal Info ── -->
        <template if:true={isStep1}>
          <div class="nlf-body">
            <div class="nlf-grid">
              <!-- Gender (optional) -->
              <div class="nlf-field">
                <label class="nlf-label"
                  >Gender <span class="nlf-optional">(optional)</span></label
                >
                <select class="nlf-select" onchange={handleGender}>
                  <option value="">Select</option>
                  <option value="M">Mr.</option>
                  <option value="F">Mrs.</option>
                  <option value="O">Other</option>
                </select>
              </div>

              <!-- First Name -->
              <div class={firstNameFc}>
                <label class="nlf-label"
                  >First Name <span class="nlf-req">*</span></label
                >
                <div class="nlf-input-wrap">
                  <lightning-icon
                    icon-name="utility:user"
                    size="x-small"
                    class="nlf-icon"
                  ></lightning-icon>
                  <input
                    class="nlf-input"
                    data-field="firstName"
                    placeholder="Jean"
                    onchange={handleFirstName}
                    onblur={handleBlur}
                  />
                </div>
                <template if:true={errors.firstName}>
                  <span class="nlf-error-msg">{errors.firstName}</span>
                </template>
              </div>

              <!-- Last Name -->
              <div class={lastNameFc}>
                <label class="nlf-label"
                  >Last Name <span class="nlf-req">*</span></label
                >
                <div class="nlf-input-wrap">
                  <lightning-icon
                    icon-name="utility:user"
                    size="x-small"
                    class="nlf-icon"
                  ></lightning-icon>
                  <input
                    class="nlf-input"
                    data-field="lastName"
                    placeholder="Dupont"
                    onchange={handleLastName}
                    onblur={handleBlur}
                  />
                </div>
                <template if:true={errors.lastName}>
                  <span class="nlf-error-msg">{errors.lastName}</span>
                </template>
              </div>

              <!-- Professional Email -->
              <div class={emailFc}>
                <label class="nlf-label"
                  >Professional Email <span class="nlf-req">*</span></label
                >
                <div class="nlf-input-wrap">
                  <lightning-icon
                    icon-name="utility:email"
                    size="x-small"
                    class="nlf-icon"
                  ></lightning-icon>
                  <input
                    class="nlf-input"
                    type="email"
                    data-field="email"
                    placeholder="jean.dupont@company.com"
                    onchange={handleEmail}
                    onblur={handleBlur}
                  />
                </div>
                <template if:true={errors.email}>
                  <span class="nlf-error-msg">{errors.email}</span>
                </template>
              </div>

              <!-- Phone with country dial code -->
              <div class={phoneFc}>
                <label class="nlf-label"
                  >Phone <span class="nlf-req">*</span></label
                >
                <div class="nlf-phone-row">
                  <!-- Custom dial-code picker (renders flags in HTML, not OS native) -->
                  <div class="nlf-cs-wrap nlf-phone-dial-wrap">
                    <div class={dialTriggerCls} onclick={toggleDialDropdown}>
                      <template if:true={selectedDialLabel}>
                        <span class="nlf-cs-value">{selectedDialLabel}</span>
                      </template>
                      <template if:false={selectedDialLabel}>
                        <span class="nlf-cs-placeholder">Country</span>
                      </template>
                      <span class="nlf-cs-arrow">&#9660;</span>
                    </div>
                    <template if:true={dialOpen}>
                      <div class="nlf-dropdown" onclick={stopProp}>
                        <input
                          class="nlf-dropdown-search"
                          type="text"
                          placeholder="Search country or code…"
                          oninput={handleDialSearch}
                          onclick={stopProp}
                        />
                        <div class="nlf-dropdown-list">
                          <template for:each={filteredDialCodes} for:item="opt">
                            <div
                              key={opt.value}
                              class={opt.cls}
                              data-value={opt.value}
                              onclick={selectDial}
                            >
                              {opt.label}
                            </div>
                          </template>
                        </div>
                      </div>
                    </template>
                  </div>
                  <!-- Number input -->
                  <div class="nlf-input-wrap nlf-phone-num-wrap">
                    <lightning-icon
                      icon-name="utility:call"
                      size="x-small"
                      class="nlf-icon"
                    ></lightning-icon>
                    <input
                      class="nlf-input"
                      type="tel"
                      data-field="phoneNumber"
                      placeholder="6 00 00 00 00"
                      onchange={handlePhoneNumber}
                      onblur={handleBlur}
                    />
                  </div>
                </div>
                <template if:true={errors.phone}>
                  <span class="nlf-error-msg">{errors.phone}</span>
                </template>
              </div>

              <!-- Role / Position -->
              <div class={responsibilityFc}>
                <label class="nlf-label"
                  >Role / Position <span class="nlf-req">*</span></label
                >
                <div class="nlf-input-wrap">
                  <lightning-icon
                    icon-name="utility:case"
                    size="x-small"
                    class="nlf-icon"
                  ></lightning-icon>
                  <input
                    class="nlf-input"
                    data-field="responsibility"
                    placeholder="Purchasing Director"
                    onchange={handleResponsibility}
                    onblur={handleBlur}
                  />
                </div>
                <template if:true={errors.responsibility}>
                  <span class="nlf-error-msg">{errors.responsibility}</span>
                </template>
              </div>
            </div>

            <div class="nlf-hint-row">
              <span class="nlf-hint"
                ><span class="nlf-req">*</span> Required fields</span
              >
            </div>

            <div class="nlf-footer-right">
              <button class="nlf-btn-next" onclick={handleNext}>
                Next &rarr;
              </button>
            </div>
          </div>
        </template>

        <!-- ── STEP 2: Company Info ── -->
        <template if:true={isStep2}>
          <div class="nlf-body">
            <div class="nlf-grid">
              <!-- Company Name -->
              <div class={companyNameFc}>
                <label class="nlf-label"
                  >Company Name <span class="nlf-req">*</span></label
                >
                <div class="nlf-input-wrap">
                  <lightning-icon
                    icon-name="utility:company"
                    size="x-small"
                    class="nlf-icon"
                  ></lightning-icon>
                  <input
                    class="nlf-input"
                    data-field="companyName"
                    placeholder="Nexus Systems"
                    onchange={handleCompanyName}
                    onblur={handleBlur}
                  />
                </div>
                <template if:true={errors.companyName}>
                  <span class="nlf-error-msg">{errors.companyName}</span>
                </template>
              </div>

              <!-- Industry -->
              <div class={industryFc}>
                <label class="nlf-label"
                  >Industry <span class="nlf-req">*</span></label
                >
                <select
                  class="nlf-select"
                  data-field="industry"
                  onchange={handleIndustry}
                  onblur={handleBlur}
                >
                  <option value="">Select a sector…</option>
                  <template for:each={industryOptions} for:item="opt">
                    <option key={opt.value} value={opt.value}>
                      {opt.label}
                    </option>
                  </template>
                </select>
                <template if:true={errors.industry}>
                  <span class="nlf-error-msg">{errors.industry}</span>
                </template>
              </div>

              <!-- Employees -->
              <div class={employeeCountFc}>
                <label class="nlf-label"
                  >Number of Employees <span class="nlf-req">*</span></label
                >
                <div class="nlf-input-wrap">
                  <lightning-icon
                    icon-name="utility:people"
                    size="x-small"
                    class="nlf-icon"
                  ></lightning-icon>
                  <input
                    class="nlf-input"
                    type="number"
                    data-field="employeeCount"
                    placeholder="500"
                    min="1"
                    onchange={handleEmployeeCount}
                    onblur={handleBlur}
                  />
                </div>
                <template if:true={errors.employeeCount}>
                  <span class="nlf-error-msg">{errors.employeeCount}</span>
                </template>
              </div>

              <!-- Domain / Website -->
              <div class={domainFc}>
                <label class="nlf-label"
                  >Domain / Website <span class="nlf-req">*</span></label
                >
                <div class="nlf-input-wrap">
                  <lightning-icon
                    icon-name="utility:world"
                    size="x-small"
                    class="nlf-icon"
                  ></lightning-icon>
                  <input
                    class="nlf-input"
                    data-field="domain"
                    placeholder="company.com"
                    onchange={handleDomain}
                    onblur={handleBlur}
                  />
                </div>
                <template if:true={errors.domain}>
                  <span class="nlf-error-msg">{errors.domain}</span>
                </template>
              </div>

              <!-- Purchase Intent -->
              <div class={intentFc}>
                <label class="nlf-label"
                  >Purchase Intent <span class="nlf-req">*</span></label
                >
                <select
                  class="nlf-select"
                  data-field="intent"
                  onchange={handleIntent}
                  onblur={handleBlur}
                >
                  <option value="">Select intent…</option>
                  <option value="Bulk Purchase">Bulk Purchase (B2B)</option>
                  <option value="Single Purchase">Single Purchase</option>
                  <option value="Partnership">Partnership</option>
                  <option value="Product Demo">Product Demo</option>
                </select>
                <template if:true={errors.intent}>
                  <span class="nlf-error-msg">{errors.intent}</span>
                </template>
              </div>

              <!-- Annual Revenue -->
              <div class={annualRevenueFc}>
                <label class="nlf-label"
                  >Annual Revenue (€) <span class="nlf-req">*</span></label
                >
                <div class="nlf-input-wrap">
                  <lightning-icon
                    icon-name="utility:currency"
                    size="x-small"
                    class="nlf-icon"
                  ></lightning-icon>
                  <input
                    class="nlf-input"
                    type="number"
                    data-field="annualRevenue"
                    placeholder="1000000"
                    min="0"
                    onchange={handleAnnualRevenue}
                    onblur={handleBlur}
                  />
                </div>
                <template if:true={errors.annualRevenue}>
                  <span class="nlf-error-msg">{errors.annualRevenue}</span>
                </template>
              </div>

              <!-- Country — custom HTML dropdown so flag emoji render on Windows -->
              <div class={countryFc}>
                <label class="nlf-label"
                  >Country <span class="nlf-req">*</span></label
                >
                <div class="nlf-cs-wrap">
                  <div
                    class={countryTriggerCls}
                    onclick={toggleCountryDropdown}
                  >
                    <template if:true={selectedCountryLabel}>
                      <span class="nlf-cs-value">{selectedCountryLabel}</span>
                    </template>
                    <template if:false={selectedCountryLabel}>
                      <span class="nlf-cs-placeholder">Select a country…</span>
                    </template>
                    <span class="nlf-cs-arrow">&#9660;</span>
                  </div>
                  <template if:true={countryOpen}>
                    <div class="nlf-dropdown" onclick={stopProp}>
                      <input
                        class="nlf-dropdown-search"
                        type="text"
                        placeholder="Search country…"
                        oninput={handleCountrySearch}
                        onclick={stopProp}
                      />
                      <div class="nlf-dropdown-list">
                        <template for:each={filteredCountries} for:item="opt">
                          <div
                            key={opt.value}
                            class={opt.cls}
                            data-value={opt.value}
                            onclick={selectCountry}
                          >
                            {opt.label}
                          </div>
                        </template>
                      </div>
                    </div>
                  </template>
                </div>
                <template if:true={errors.country}>
                  <span class="nlf-error-msg">{errors.country}</span>
                </template>
              </div>

              <!-- State / Province — dropdown if country has states, text otherwise -->
              <div class={stateFc}>
                <label class="nlf-label"
                  >State / Province <span class="nlf-req">*</span></label
                >
                <template if:true={hasCountryStates}>
                  <select
                    class="nlf-select"
                    data-field="state"
                    disabled={noCountry}
                    onchange={handleState}
                    onblur={handleBlur}
                  >
                    <option value="">Select state…</option>
                    <template for:each={countryStates} for:item="s">
                      <option key={s} value={s}>{s}</option>
                    </template>
                  </select>
                </template>
                <template if:false={hasCountryStates}>
                  <div class="nlf-input-wrap">
                    <lightning-icon
                      icon-name="utility:location"
                      size="x-small"
                      class="nlf-icon"
                    ></lightning-icon>
                    <input
                      class="nlf-input"
                      data-field="state"
                      disabled={noCountry}
                      placeholder={statePlaceholder}
                      onchange={handleState}
                      onblur={handleBlur}
                    />
                  </div>
                </template>
                <template if:true={errors.state}>
                  <span class="nlf-error-msg">{errors.state}</span>
                </template>
              </div>

              <!-- City -->
              <div class={cityFc}>
                <label class="nlf-label"
                  >City <span class="nlf-req">*</span></label
                >
                <div class="nlf-input-wrap">
                  <lightning-icon
                    icon-name="utility:location"
                    size="x-small"
                    class="nlf-icon"
                  ></lightning-icon>
                  <input
                    class="nlf-input"
                    data-field="city"
                    disabled={noCountry}
                    placeholder={cityPlaceholder}
                    onchange={handleCity}
                    onblur={handleBlur}
                  />
                </div>
                <template if:true={errors.city}>
                  <span class="nlf-error-msg">{errors.city}</span>
                </template>
              </div>

              <!-- Zip Code -->
              <div class={zipFc}>
                <label class="nlf-label"
                  >Zip Code <span class="nlf-req">*</span></label
                >
                <div class="nlf-input-wrap">
                  <lightning-icon
                    icon-name="utility:number_input"
                    size="x-small"
                    class="nlf-icon"
                  ></lightning-icon>
                  <input
                    class="nlf-input"
                    data-field="zip"
                    disabled={noCountry}
                    placeholder="75001"
                    onchange={handleZip}
                    onblur={handleBlur}
                  />
                </div>
                <template if:true={errors.zip}>
                  <span class="nlf-error-msg">{errors.zip}</span>
                </template>
              </div>
            </div>

            <div class="nlf-hint-row">
              <span class="nlf-hint"
                ><span class="nlf-req">*</span> Required fields</span
              >
            </div>

            <div class="nlf-footer-both">
              <button class="nlf-btn-back" onclick={handleBack}>
                &larr; Previous
              </button>
              <button
                class="nlf-btn-submit"
                onclick={handleSubmit}
                disabled={isLoading}
              >
                <template if:false={isLoading}
                  >Complete Registration ✓</template
                >
                <template if:true={isLoading}>
                  <span class="nlf-spinner"></span> Submitting…
                </template>
              </button>
            </div>
          </div>
        </template>
      </div>
    </template>
  </div>

  <!-- Backdrop closes any open custom dropdown when clicking outside -->
  <template if:true={anyDropdownOpen}>
    <div class="nlf-backdrop" onclick={closeDropdowns}></div>
  </template>
</template>

<template>
    <div class="nlf-wrap">

        <!-- ══ SUCCESS STATE ══ -->
        <template if:true={isSubmitted}>
            <div class="nlf-success">
                <div class="nlf-success-icon">
                    <lightning-icon icon-name="utility:check" size="large" variant="inverse"></lightning-icon>
                </div>
                <h2 class="nlf-success-title">Application Received!</h2>
                <p class="nlf-success-body">
                    Thank you for your trust. Our team is reviewing your profile.
                    Vos identifiants d'accès vous seront envoyés par email sous 24h.
                </p>
            </div>
        </template>

        <!-- ══ FORM ══ -->
        <template if:false={isSubmitted}>
            <div class="nlf-card">

                <!-- Header bar -->
                <div class="nlf-header">
                    <div class="nlf-step-pill">{stepLabel}</div>
                    <h2 class="nlf-header-title">{stepTitle}</h2>
                    <p class="nlf-header-desc">{stepDesc}</p>
                    <div class="nlf-blob"></div>
                </div>

                <!-- ── STEP 1: Personal Info ── -->
                <template if:true={isStep1}>
                    <div class="nlf-body">
                        <div class="nlf-grid">
                            <div class="nlf-field">
                                <label class="nlf-label">Genre</label>
                                <select class="nlf-select" onchange={handleGender}>
                                    <option value="">Sélectionner</option>
                                    <option value="M">Monsieur</option>
                                    <option value="F">Madame</option>
                                    <option value="O">Autre</option>
                                </select>
                            </div>
                            <div class="nlf-field">
                                <label class="nlf-label">First Name *</label>
                                <div class="nlf-input-wrap">
                                    <lightning-icon icon-name="utility:user" size="x-small" class="nlf-icon"></lightning-icon>
                                    <input class="nlf-input" placeholder="Jean" required onchange={handleFirstName} />
                                </div>
                            </div>
                            <div class="nlf-field">
                                <label class="nlf-label">Last Name *</label>
                                <div class="nlf-input-wrap">
                                    <lightning-icon icon-name="utility:user" size="x-small" class="nlf-icon"></lightning-icon>
                                    <input class="nlf-input" placeholder="Dupont" required onchange={handleLastName} />
                                </div>
                            </div>
                            <div class="nlf-field">
                                <label class="nlf-label">Professional Email *</label>
                                <div class="nlf-input-wrap">
                                    <lightning-icon icon-name="utility:email" size="x-small" class="nlf-icon"></lightning-icon>
                                    <input class="nlf-input" type="email" placeholder="john.doe@company.com" required onchange={handleEmail} />
                                </div>
                            </div>
                            <div class="nlf-field">
                                <label class="nlf-label">Phone *</label>
                                <div class="nlf-input-wrap">
                                    <lightning-icon icon-name="utility:call" size="x-small" class="nlf-icon"></lightning-icon>
                                    <input class="nlf-input" type="tel" placeholder="+33 6 00 00 00 00" required onchange={handlePhone} />
                                </div>
                            </div>
                            <div class="nlf-field">
                                <label class="nlf-label">Responsabilité / Poste *</label>
                                <div class="nlf-input-wrap">
                                    <lightning-icon icon-name="utility:case" size="x-small" class="nlf-icon"></lightning-icon>
                                    <input class="nlf-input" placeholder="Directeur Achats" required onchange={handleResponsibility} />
                                </div>
                            </div>
                        </div>
                        <div class="nlf-footer-right">
                            <button class="nlf-btn-next" onclick={handleNext}>
                                Next &rarr;
                            </button>
                        </div>
                    </div>
                </template>

                <!-- ── STEP 2: Company Info ── -->
                <template if:true={isStep2}>
                    <div class="nlf-body">
                        <div class="nlf-grid">
                            <div class="nlf-field">
                                <label class="nlf-label">Company Name *</label>
                                <div class="nlf-input-wrap">
                                    <lightning-icon icon-name="utility:company" size="x-small" class="nlf-icon"></lightning-icon>
                                    <input class="nlf-input" placeholder="Nexus Systems" required onchange={handleCompanyName} />
                                </div>
                            </div>
                            <div class="nlf-field">
                                <label class="nlf-label">Secteur d'activité *</label>
                                <select class="nlf-select" required onchange={handleIndustry}>
                                    <option value="">Sélectionner</option>
                                    <template for:each={industryOptions} for:item="opt">
                                        <option key={opt.value} value={opt.value}>{opt.label}</option>
                                    </template>
                                </select>
                            </div>
                            <div class="nlf-field">
                                <label class="nlf-label">Number of Employees *</label>
                                <div class="nlf-input-wrap">
                                    <lightning-icon icon-name="utility:people" size="x-small" class="nlf-icon"></lightning-icon>
                                    <input class="nlf-input" type="number" placeholder="500" required onchange={handleEmployeeCount} />
                                </div>
                            </div>
                            <div class="nlf-field">
                                <label class="nlf-label">Domaine / Site web *</label>
                                <div class="nlf-input-wrap">
                                    <lightning-icon icon-name="utility:world" size="x-small" class="nlf-icon"></lightning-icon>
                                    <input class="nlf-input" type="text" placeholder="techcorp.dz" required onchange={handleDomain} />
                                </div>
                            </div>
                            <div class="nlf-field">
                                <label class="nlf-label">Intention d&apos;achat *</label>
                                <select class="nlf-select" required onchange={handleIntent}>
                                    <option value="">Sélectionner l&apos;intention...</option>
                                    <option value="Bulk Purchase">Achat en gros (B2B)</option>
                                    <option value="Single Purchase">Achat unique</option>
                                    <option value="Partnership">Partenariat</option>
                                    <option value="Product Demo">Démonstration produit</option>
                                </select>
                            </div>
                            <div class="nlf-field">
                                <label class="nlf-label">Revenue Annuel (€) *</label>
                                <div class="nlf-input-wrap">
                                    <lightning-icon icon-name="utility:currency" size="x-small" class="nlf-icon"></lightning-icon>
                                    <input class="nlf-input" type="number" placeholder="1000000" required onchange={handleAnnualRevenue} />
                                </div>
                            </div>
                            <div class="nlf-field">
                                <label class="nlf-label">Pays *</label>
                                <div class="nlf-input-wrap">
                                    <lightning-icon icon-name="utility:world" size="x-small" class="nlf-icon"></lightning-icon>
                                    <input class="nlf-input" placeholder="France" required onchange={handleCountry} />
                                </div>
                            </div>
                            <div class="nlf-field">
                                <label class="nlf-label">City *</label>
                                <div class="nlf-input-wrap">
                                    <lightning-icon icon-name="utility:location" size="x-small" class="nlf-icon"></lightning-icon>
                                    <input class="nlf-input" placeholder="Paris" required onchange={handleCity} />
                                </div>
                            </div>
                            <div class="nlf-field">
                                <label class="nlf-label">État / Province *</label>
                                <div class="nlf-input-wrap">
                                    <lightning-icon icon-name="utility:location" size="x-small" class="nlf-icon"></lightning-icon>
                                    <input class="nlf-input" placeholder="Île-de-France" required onchange={handleState} />
                                </div>
                            </div>
                            <div class="nlf-field">
                                <label class="nlf-label">Code Postal *</label>
                                <div class="nlf-input-wrap">
                                    <lightning-icon icon-name="utility:number_input" size="x-small" class="nlf-icon"></lightning-icon>
                                    <input class="nlf-input" placeholder="75001" required onchange={handleZip} />
                                </div>
                            </div>
                        </div>
                        <div class="nlf-footer-both">
                            <button class="nlf-btn-back" onclick={handleBack}>&larr; Previous</button>
                            <button class="nlf-btn-submit" onclick={handleSubmit} disabled={isLoading}>
                                <template if:false={isLoading}>Finaliser l'inscription ✓</template>
                                <template if:true={isLoading}>Envoi en cours…</template>
                            </button>
                        </div>
                    </div>
                </template>

            </div>
        </template>

    </div>
</template>

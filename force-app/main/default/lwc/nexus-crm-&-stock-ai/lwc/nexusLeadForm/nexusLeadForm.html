<template>
    <div class="slds-box slds-theme_default rounded-3xl p-8 shadow-sm border border-slate-200">
        <div class="slds-m-bottom_large">
            <h2 class="text-3xl font-black text-slate-900 mb-2">Demande de Devis</h2>
            <p class="text-slate-500 font-medium">Rejoignez l'écosystème Nexus et boostez votre productivité.</p>
        </div>

        <lightning-messages></lightning-messages>

        <div class="slds-grid slds-wrap slds-gutters">
            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-m-bottom_small">
                <lightning-input label="Prénom" name="FirstName" required onchange={handleChange}></lightning-input>
            </div>
            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-m-bottom_small">
                <lightning-input label="Nom" name="LastName" required onchange={handleChange}></lightning-input>
            </div>
            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-m-bottom_small">
                <lightning-input label="Email Professionnel" name="Email" type="email" required onchange={handleChange}></lightning-input>
            </div>
            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-m-bottom_small">
                <lightning-input label="Téléphone" name="Phone" type="tel" onchange={handleChange}></lightning-input>
            </div>
            <div class="slds-col slds-size_1-of-1 slds-m-bottom_small">
                <lightning-input label="Nom de l'entreprise" name="Company" required onchange={handleChange}></lightning-input>
            </div>
            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-m-bottom_small">
                <lightning-combobox label="Secteur d'activité" name="Industry" options={industryOptions} onchange={handleChange}></lightning-combobox>
            </div>
            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-m-bottom_small">
                <lightning-input label="Nombre d'employés" name="NumberOfEmployees" type="number" onchange={handleChange}></lightning-input>
            </div>
        </div>

        <div class="slds-m-top_large">
            <button class="nexus-button-primary w-full py-4 bg-indigo-600 text-white rounded-2xl font-black hover:bg-indigo-700 transition-all shadow-lg shadow-indigo-200" onclick={handleSubmit}>
                Envoyer la demande
            </button>
        </div>
    </div>
</template>

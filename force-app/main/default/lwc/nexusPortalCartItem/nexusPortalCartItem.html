<template>
    <div class="npci-card">

        <!-- Image area -->
        <div class="npci-img-wrap">
            <template if:true={hasImage}>
                <img src={imageUrl} alt={productName} class="npci-img" />
            </template>
            <template if:false={hasImage}>
                <div class="npci-img-placeholder">
                    <lightning-icon icon-name="utility:product_required" size="large"></lightning-icon>
                </div>
            </template>
        </div>

        <!-- Content -->
        <div class="npci-content">

            <!-- Top: family + name + delete -->
            <div class="npci-top">
                <div class="npci-info">
                    <div class="npci-family">{productFamily}</div>
                    <h4 class="npci-name">{productName}</h4>
                </div>
                <button class="npci-delete" onclick={handleRemove} title="Supprimer">
                    <lightning-icon icon-name="utility:delete" size="small"></lightning-icon>
                </button>
            </div>

            <!-- Bottom: qty controls + total price -->
            <div class="npci-bottom">
                <div class="npci-qty-wrap">
                    <button class="npci-qty-btn" onclick={handleDecrement}>
                        <lightning-icon icon-name="utility:dash" size="x-small"></lightning-icon>
                    </button>
                    <span class="npci-qty">{quantity}</span>
                    <button class="npci-qty-btn" onclick={handleIncrement}>
                        <lightning-icon icon-name="utility:add" size="x-small"></lightning-icon>
                    </button>
                </div>
                <div class="npci-price">{formattedLineTotal}</div>
            </div>

        </div>
    </div>
</template>

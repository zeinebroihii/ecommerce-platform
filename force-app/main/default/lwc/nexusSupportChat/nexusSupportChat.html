<template>
  <!-- ── Floating Trigger Button ── -->
  <template if:false={isOpen}>
    <button class="nsc-fab" onclick={handleOpen} title="Nexus AI Support">
      <div class="nsc-fab-icon">
        <svg
          width="22"
          height="22"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path
            d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"
          />
        </svg>
      </div>
      <div class="nsc-fab-pulse"></div>
      <template if:true={hasUnread}>
        <div class="nsc-fab-badge">{unreadCount}</div>
      </template>
    </button>
  </template>

  <!-- ── Chat Panel ── -->
  <template if:true={isOpen}>
    <div class="nsc-panel">
      <!-- Header -->
      <div class="nsc-header">
        <div class="nsc-header-left">
          <div class="nsc-avatar">
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="12" cy="8" r="4" />
              <path d="M6 20v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2" />
              <path d="M18 12h.01" />
              <path d="M6 12h.01" />
            </svg>
          </div>
          <div class="nsc-header-info">
            <span class="nsc-header-name">Nexus AI</span>
            <div class="nsc-status-row">
              <div class="nsc-status-dot"></div>
              <span class="nsc-status-text">Online — AI powered</span>
            </div>
          </div>
        </div>
        <div class="nsc-header-actions">
          <button
            class="nsc-header-btn"
            onclick={handleClearChat}
            title="Clear chat"
          >
            <svg
              width="14"
              height="14"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <polyline points="3 6 5 6 21 6" />
              <path d="M19 6l-1 14H6L5 6" />
            </svg>
          </button>
          <button class="nsc-header-btn" onclick={handleClose} title="Close">
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <line x1="18" y1="6" x2="6" y2="18" />
              <line x1="6" y1="6" x2="18" y2="18" />
            </svg>
          </button>
        </div>
      </div>

      <!-- Messages -->
      <div class="nsc-messages" data-id="messages">
        <template for:each={messages} for:item="msg">
          <div key={msg.id} class={msg.wrapClass}>
            <!-- AI avatar for bot messages -->
            <template if:true={msg.isBot}>
              <div class="nsc-msg-avatar">
                <svg
                  width="12"
                  height="12"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2.5"
                >
                  <circle cx="12" cy="8" r="4" />
                  <path d="M6 20v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2" />
                </svg>
              </div>
            </template>

            <div class="nsc-msg-content">
              <!-- Bubble -->
              <div class={msg.bubbleClass}>
                <template for:each={msg.paragraphs} for:item="para">
                  <p key={para.id} class={para.cls}>{para.text}</p>
                </template>
              </div>

              <!-- Cards (products / orders / quotes) -->
              <template if:true={msg.hasCards}>
                <div class="nsc-cards">
                  <template for:each={msg.cards} for:item="card">
                    <div key={card.title} class="nsc-card">
                      <template if:true={card.imageUrl}>
                        <div class="nsc-card-img-wrap">
                          <img
                            src={card.imageUrl}
                            alt={card.title}
                            class="nsc-card-img"
                            referrerpolicy="no-referrer"
                          />
                        </div>
                      </template>
                      <div class="nsc-card-body">
                        <div class="nsc-card-top">
                          <span class="nsc-card-title">{card.title}</span>
                          <template if:true={card.badge}>
                            <span class={card.badgeCls}>{card.badge}</span>
                          </template>
                        </div>
                        <template if:true={card.subtitle}>
                          <span class="nsc-card-sub">{card.subtitle}</span>
                        </template>
                        <template if:true={card.meta}>
                          <span class="nsc-card-meta">{card.meta}</span>
                        </template>
                        <template if:true={card.price}>
                          <span class="nsc-card-price">{card.price}</span>
                        </template>
                      </div>
                    </div>
                  </template>
                </div>
              </template>

              <!-- Timestamp -->
              <span class="nsc-msg-time">{msg.time}</span>
            </div>
          </div>
        </template>

        <!-- Typing indicator -->
        <template if:true={isTyping}>
          <div class="nsc-msg-wrap nsc-msg-wrap--bot">
            <div class="nsc-msg-avatar">
              <svg
                width="12"
                height="12"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.5"
              >
                <circle cx="12" cy="8" r="4" />
                <path d="M6 20v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2" />
              </svg>
            </div>
            <div class="nsc-msg-content">
              <div class="nsc-typing">
                <span></span><span></span><span></span>
              </div>
            </div>
          </div>
        </template>
      </div>

      <!-- Quick chips -->
      <template if:true={showChips}>
        <div class="nsc-chips">
          <template for:each={currentChips} for:item="chip">
            <button
              key={chip}
              class="nsc-chip"
              data-chip={chip}
              onclick={handleChip}
            >
              {chip}
            </button>
          </template>
        </div>
      </template>

      <!-- Input area -->
      <div class="nsc-input-wrap">
        <input
          type="text"
          class="nsc-input"
          placeholder="Ask me anything…"
          value={inputValue}
          oninput={handleInput}
          onkeydown={handleKeyDown}
        />
        <button class={sendBtnClass} onclick={handleSend} title="Send">
          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <line x1="22" y1="2" x2="11" y2="13" />
            <polygon points="22 2 15 22 11 13 2 9 22 2" />
          </svg>
        </button>
      </div>
    </div>
  </template>
</template>

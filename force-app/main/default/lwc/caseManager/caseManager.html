<template>
    <div class="case-manager-container">

        <!-- Header -->
        <div class="page-header">
            <h1 class="page-title">Support Centre</h1>
            <p class="page-subtitle">View your cases or raise a new support request</p>
        </div>

        <!-- Tab Bar -->
        <div class="tab-bar">
            <button class={myCasesTabClass} onclick={showMyCases}>
                My Cases
                <template if:true={openCaseCount}>
                    <span class="badge">{openCaseCount}</span>
                </template>
            </button>
            <button class={newCaseTabClass} onclick={showNewCase}>
                + New Case
            </button>
        </div>

        <!-- ── MY CASES TAB ── -->
        <template if:true={isMyCasesTab}>

            <!-- Loading -->
            <template if:true={isLoadingCases}>
                <div class="loading-wrap">
                    <lightning-spinner alternative-text="Loading cases" size="medium"></lightning-spinner>
                    <p class="loading-text">Fetching your cases…</p>
                </div>
            </template>

            <!-- Error -->
            <template if:true={casesError}>
                <div class="error-box">
                    <span class="error-icon">&#9888;</span>
                    <p>{casesError}</p>
                </div>
            </template>

            <!-- Empty -->
            <template if:true={noCases}>
                <div class="empty-state">
                    <div class="empty-icon">&#128203;</div>
                    <h3>No cases yet</h3>
                    <p>When you raise a support request it will appear here.</p>
                    <button class="btn-primary" onclick={showNewCase}>Raise a Case</button>
                </div>
            </template>

            <!-- Case list -->
            <template if:true={hasCases}>
                <div class="case-list">
                    <template for:each={cases} for:item="c">
                        <div key={c.Id} class="case-card" onclick={handleCaseClick} data-id={c.Id}>
                            <div class="case-card-top">
                                <div class="case-info">
                                    <span class="case-number">{c.CaseNumber}</span>
                                    <span class={c.statusClass}>{c.Status}</span>
                                </div>
                                <span class="case-date">{c.formattedDate}</span>
                            </div>
                            <h3 class="case-subject">{c.Subject}</h3>
                            <div class="case-meta">
                                <span class="meta-tag">{c.Type}</span>
                                <template if:true={c.Priority}>
                                    <span class={c.priorityClass}>{c.Priority}</span>
                                </template>
                            </div>
                            <!-- Expanded detail -->
                            <template if:true={c.isExpanded}>
                                <div class="case-detail">
                                    <p class="detail-label">Description</p>
                                    <p class="detail-value">{c.Description}</p>
                                    <template if:true={c.Related_Order__c}>
                                        <p class="detail-label">Order</p>
                                        <p class="detail-value">{c.orderName}</p>
                                    </template>
                                    <template if:true={c.Resolution_Time_Hours__c}>
                                        <p class="detail-label">Resolution Time</p>
                                        <p class="detail-value">{c.Resolution_Time_Hours__c} hrs</p>
                                    </template>
                                </div>
                            </template>
                        </div>
                    </template>
                </div>
            </template>

        </template>

        <!-- ── NEW CASE TAB ── -->
        <template if:true={isNewCaseTab}>
            <div class="form-card">
                <h2 class="form-title">Raise a Support Request</h2>

                <!-- Global form error -->
                <template if:true={submitError}>
                    <div class="error-box">
                        <span class="error-icon">&#9888;</span>
                        <p>{submitError}</p>
                    </div>
                </template>

                <!-- Success banner -->
                <template if:true={submitSuccess}>
                    <div class="success-box">
                        <span class="success-icon">&#10003;</span>
                        <p>Case <strong>{newCaseNumber}</strong> created! Our team will be in touch.</p>
                    </div>
                </template>

                <template if:false={submitSuccess}>
                    <div class="form-body">

                        <!-- Case Type -->
                        <div class="form-group">
                            <label class="form-label">Case Type <span class="required">*</span></label>
                            <div class="radio-group">
                                <template for:each={caseTypeOptions} for:item="opt">
                                    <label key={opt.value} class="radio-label">
                                        <input
                                            type="radio"
                                            name="caseType"
                                            value={opt.value}
                                            checked={opt.checked}
                                            onchange={handleTypeChange}
                                        />
                                        <span class="radio-text">
                                            <span class="radio-icon">{opt.icon}</span>
                                            {opt.label}
                                        </span>
                                    </label>
                                </template>
                            </div>
                        </div>

                        <!-- Subject -->
                        <div class="form-group">
                            <label class="form-label" for="subject">
                                Subject <span class="required">*</span>
                            </label>
                            <input
                                id="subject"
                                type="text"
                                class="form-input"
                                placeholder="Brief summary of your issue"
                                value={formSubject}
                                onchange={handleSubjectChange}
                                maxlength="255"
                            />
                        </div>

                        <!-- Priority -->
                        <div class="form-group">
                            <label class="form-label" for="priority">Priority</label>
                            <select id="priority" class="form-select" onchange={handlePriorityChange}>
                                <option value="Low">Low &#8212; General query</option>
                                <option value="Medium" selected>Medium &#8212; Affecting experience</option>
                                <option value="High">High &#8212; Urgent issue</option>
                            </select>
                        </div>

                        <!-- Description -->
                        <div class="form-group">
                            <label class="form-label" for="description">
                                Description <span class="required">*</span>
                            </label>
                            <textarea
                                id="description"
                                class="form-textarea"
                                placeholder="Please describe your issue in detail"
                                onchange={handleDescriptionChange}
                                rows="5"
                            ></textarea>
                        </div>

                        <!-- Order Reference (optional) -->
                        <div class="form-group">
                            <label class="form-label" for="orderRef">
                                Order Reference (optional)
                            </label>
                            <input
                                id="orderRef"
                                type="text"
                                class="form-input"
                                placeholder="e.g. 00001042"
                                value={formOrderRef}
                                onchange={handleOrderRefChange}
                            />
                        </div>

                        <!-- Submit -->
                        <div class="form-actions">
                            <button class="btn-secondary" onclick={showMyCases}>
                                Cancel
                            </button>
                            <button class="btn-primary" onclick={handleSubmit} disabled={isSubmitting}>
                                <template if:true={isSubmitting}>Submitting</template>
                                <template if:false={isSubmitting}>Submit Case</template>
                            </button>
                        </div>
                    </div>
                </template>

                <!-- After success ─ back button -->
                <template if:true={submitSuccess}>
                    <div class="form-actions center">
                        <button class="btn-primary" onclick={handleAfterSubmit}>
                            View My Cases
                        </button>
                    </div>
                </template>

            </div>
        </template>

    </div>
</template>

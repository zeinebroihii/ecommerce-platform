<template>
  <div class="qb-root">
    <!-- ══════════════════════════════════════════════════════════════
         LIST VIEW
    ══════════════════════════════════════════════════════════════ -->
    <template if:true={isListView}>
      <!-- List action row — buttons only, no title -->
      <div class="qb-action-row">
        <button class="qb-vb-ghost" onclick={handleOpenRequests}>
          <lightning-icon
            icon-name="utility:inbox"
            size="x-small"
          ></lightning-icon>
          <span>Requests</span>
          <template if:true={hasRequests}>
            <span class={requestBadgeCls}>{requestCount}</span>
          </template>
        </button>
        <button class="qb-vb-primary" onclick={handleOpenBuilder}>
          <lightning-icon
            icon-name="utility:add"
            size="x-small"
            variant="inverse"
          ></lightning-icon>
          <span>New Quote</span>
        </button>
      </div>

      <!-- Filter bar -->
      <div class="qb-filter-bar">
        <div class="qb-filter-search-wrap">
          <lightning-icon
            icon-name="utility:search"
            size="x-small"
            class="qb-filter-search-icon"
          ></lightning-icon>
          <input
            type="text"
            class="qb-filter-search"
            placeholder="Search by name or account..."
            value={filterSearch}
            oninput={handleFilterSearch}
          />
        </div>
        <div class="qb-filter-pills">
          <template for:each={filterStatusOptions} for:item="opt">
            <button
              key={opt.value}
              class={opt.pillCls}
              data-status={opt.value}
              onclick={handleFilterStatus}
            >
              {opt.label}
            </button>
          </template>
        </div>
        <div class="qb-filter-meta">
          <span class="qb-filter-count">{filteredCount} / {totalCount}</span>
          <template if:true={noResults}>
            <button class="qb-filter-clear" onclick={handleClearFilters}>
              Clear filters
            </button>
          </template>
        </div>
      </div>

      <template if:true={noResults}>
        <div class="qb-empty-screen">
          <div class="qb-empty-icon-wrap">
            <lightning-icon
              icon-name="utility:search"
              size="large"
            ></lightning-icon>
          </div>
          <h2 class="qb-empty-title">No quotes match</h2>
          <p class="qb-empty-sub">
            Try a different search term or status filter.
          </p>
          <button class="qb-btn-cta" onclick={handleClearFilters}>
            <lightning-icon
              icon-name="utility:refresh"
              size="x-small"
              variant="inverse"
            ></lightning-icon>
            <span>Clear filters</span>
          </button>
        </div>
      </template>

      <template if:true={noQuotes}>
        <div class="qb-empty-screen">
          <div class="qb-empty-icon-wrap">
            <lightning-icon
              icon-name="utility:file"
              size="large"
            ></lightning-icon>
          </div>
          <h2 class="qb-empty-title">No quotes yet</h2>
          <p class="qb-empty-sub">
            Create your first B2B quote with product selection, AI scoring and
            automatic versioning.
          </p>
          <button class="qb-btn-cta" onclick={handleOpenBuilder}>
            <lightning-icon
              icon-name="utility:add"
              size="x-small"
              variant="inverse"
            ></lightning-icon>
            <span>Create first quote</span>
          </button>
        </div>
      </template>

      <template if:true={hasQuotes}>
        <div class="qb-list-grid">
          <template for:each={quotes} for:item="q">
            <div key={q.quoteId} class="qb-quote-card">
              <!-- Colored left accent based on status -->
              <div class="qb-card-accent" style={q.accentStyle}></div>

              <div class="qb-card-body">
                <!-- Top row: identity + badges -->
                <div class="qb-card-top">
                  <div class="qb-card-identity">
                    <div class="qb-card-icon-wrap">
                      <lightning-icon
                        icon-name="standard:quotes"
                        size="small"
                      ></lightning-icon>
                    </div>
                    <div class="qb-card-names">
                      <div class="qb-quote-name">{q.name}</div>
                      <div class="qb-quote-account">
                        {q.accountName} &nbsp;·&nbsp; {q.versionLabel}
                      </div>
                    </div>
                  </div>
                  <div class="qb-badge-group">
                    <span class={q.statusBadgeCls}>{q.status}</span>
                    <span class={q.negBadgeCls}>{q.negotiationStatus}</span>
                    <template if:true={q.isPrimary}>
                      <span class="qb-badge qb-badge-primary">PRIMARY</span>
                    </template>
                    <template if:true={q.hasVolumeDiscount}>
                      <span class="qb-badge qb-badge-volume"
                        >Vol. Discount</span
                      >
                    </template>
                    <template if:true={q.needsApproval}>
                      <span class="qb-badge qb-badge-approval">⚠ Approval</span>
                    </template>
                    <template if:true={q.hasCounterOffer}>
                      <span class="qb-badge qb-badge-counter">↩ Counter</span>
                    </template>
                    <template if:true={q.isAmendment}>
                      <span class="qb-badge qb-badge-amend">Amendment</span>
                    </template>
                    <template if:true={q.isRenewal}>
                      <span class="qb-badge qb-badge-renewal">Renewal</span>
                    </template>
                    <template if:true={q.hasDsStatus}>
                      <span class={q.dsStatusBadgeCls}>DS: {q.dsStatus}</span>
                    </template>
                  </div>
                </div>

                <!-- AI score bar -->
                <div class="qb-ai-row">
                  <div class="qb-ai-label-row">
                    <div class="qb-ai-label">
                      <lightning-icon
                        icon-name="utility:einstein"
                        size="x-small"
                        class="qb-einstein-ico"
                      ></lightning-icon>
                      <span>AI Acceptance Probability</span>
                    </div>
                    <span class="qb-ai-pct">{q.acceptanceProbability}%</span>
                  </div>
                  <div class="qb-bar-track">
                    <div class={q.probColorCls} style={q.probStyle}></div>
                  </div>
                  <div class="qb-ai-reason">{q.aiReason}</div>
                </div>

                <!-- Financial strip -->
                <div class="qb-fin-strip">
                  <div class="qb-fin-item">
                    <div class="qb-fin-label">Grand Total</div>
                    <div class="qb-fin-value qb-fin-main">
                      {q.formattedTotal}
                    </div>
                  </div>
                  <template if:true={q.formattedFinalPrice}>
                    <div class="qb-fin-item">
                      <div class="qb-fin-label">Final Negotiated</div>
                      <div class="qb-fin-value qb-fin-green">
                        {q.formattedFinalPrice}
                      </div>
                    </div>
                  </template>
                  <div class="qb-fin-item">
                    <div class="qb-fin-label">Payment</div>
                    <div class="qb-fin-value">{q.paymentTerms}</div>
                  </div>
                  <div class="qb-fin-item">
                    <div class="qb-fin-label">Discount</div>
                    <div class="qb-fin-value qb-fin-red">{q.bulkDiscount}%</div>
                  </div>
                  <div class="qb-fin-item">
                    <div class="qb-fin-label">Expiration</div>
                    <div class="qb-fin-value">{q.expirationDate}</div>
                  </div>
                </div>

                <!-- Actions row -->
                <div class="qb-card-footer">
                  <button
                    class="qb-btn-details"
                    data-id={q.quoteId}
                    onclick={handleOpenDetail}
                  >
                    View details
                    <lightning-icon
                      icon-name="utility:chevronright"
                      size="x-small"
                    ></lightning-icon>
                  </button>
                  <div class="qb-agentforce-tag">
                    <lightning-icon
                      icon-name="utility:einstein"
                      size="x-small"
                      class="qb-af-ico"
                    ></lightning-icon>
                    <span>Scored by Agentforce</span>
                  </div>
                </div>
              </div>
            </div>
          </template>
        </div>
      </template>
    </template>

    <!-- ══════════════════════════════════════════════════════════════
         REQUESTS VIEW
    ══════════════════════════════════════════════════════════════ -->
    <template if:true={isRequestsView}>
      <div class="qb-req-page">
        <!-- Page header -->
        <div class="qb-req-page-header">
          <div class="qb-req-page-title">
            <div class="qb-req-page-icon">
              <lightning-icon
                icon-name="utility:inbox"
                size="small"
                variant="inverse"
              ></lightning-icon>
            </div>
            <div>
              <div class="qb-req-page-h">Customer Quote Requests</div>
              <div class="qb-req-page-sub">
                Submitted via the portal — build an official quote for each.
              </div>
            </div>
          </div>
          <div class="qb-req-header-right">
            <template if:true={hasRequests}>
              <div class="qb-req-count-badge">
                {requestCount} pending request(s)
              </div>
            </template>
            <button
              class="qb-vb-ghost"
              onclick={handleRefreshRequests}
              title="Refresh"
            >
              <lightning-icon
                icon-name="utility:refresh"
                size="x-small"
              ></lightning-icon>
              <span>Refresh</span>
            </button>
            <button class="qb-vb-ghost" onclick={handleBackToList}>
              <lightning-icon
                icon-name="utility:back"
                size="x-small"
              ></lightning-icon>
              <span>All Quotes</span>
            </button>
          </div>
        </div>

        <!-- Requests filter bar -->
        <div class="qb-filter-bar qb-req-filter-bar">
          <div class="qb-filter-search-wrap">
            <lightning-icon
              icon-name="utility:search"
              size="x-small"
              class="qb-filter-search-icon"
            ></lightning-icon>
            <input
              type="text"
              class="qb-filter-search"
              placeholder="Search by account or quote ID..."
              value={reqSearch}
              oninput={handleReqSearch}
            />
          </div>
          <div class="qb-filter-meta">
            <span class="qb-filter-count"
              >{reqFilteredCount} / {reqTotalCount}</span
            >
            <template if:true={noRequestResults}>
              <button class="qb-filter-clear" onclick={handleClearReqSearch}>
                Clear search
              </button>
            </template>
          </div>
        </div>

        <template if:true={requestsLoading}>
          <div class="qb-spinner-wrap">
            <lightning-spinner
              size="medium"
              alternative-text="Loading..."
            ></lightning-spinner>
          </div>
        </template>

        <template if:true={noRequestResults}>
          <div class="qb-req-empty">
            <div class="qb-req-empty-illustration">
              <lightning-icon
                icon-name="utility:search"
                size="large"
              ></lightning-icon>
            </div>
            <div class="qb-req-empty-title">No requests match</div>
            <div class="qb-req-empty-sub">
              Try a different account name or quote ID.
            </div>
          </div>
        </template>

        <template if:true={noRequests}>
          <div class="qb-req-empty">
            <div class="qb-req-empty-illustration">
              <lightning-icon
                icon-name="utility:inbox"
                size="large"
              ></lightning-icon>
            </div>
            <div class="qb-req-empty-title">No pending requests</div>
            <div class="qb-req-empty-sub">
              Customer requests submitted via the portal will appear here upon
              receipt.
            </div>
          </div>
        </template>

        <template if:true={hasRequests}>
          <div class="qb-req-grid">
            <template for:each={requests} for:item="r">
              <div key={r.quoteId} class="qb-rc">
                <!-- ── Header ── -->
                <div class="qb-rc-header">
                  <div class="qb-rc-header-left">
                    <div class="qb-rc-account">{r.accountName}</div>
                    <div class="qb-rc-submeta">
                      <span>{r.name}</span>
                      <span class="qb-rc-dot">·</span>
                      <span>{r.ageLabel} ago</span>
                      <span class={r.counterBadgeCls}>
                        <template if:true={r.hasCounter}
                          >Counter-offer</template
                        >
                        <template if:false={r.hasCounter}>New</template>
                      </span>
                    </div>
                  </div>
                  <div class="qb-rc-amount">{r.formattedTotal}</div>
                </div>

                <!-- ── Product table ── -->
                <template if:true={r.lineItems.length}>
                  <div class="qb-rc-products">
                    <div class="qb-rc-prod-header">
                      <span class="qb-rc-prod-col-name">Product</span>
                      <span class="qb-rc-prod-col-qty">Qty</span>
                      <span class="qb-rc-prod-col-price">Unit price</span>
                    </div>
                    <template for:each={r.lineItems} for:item="li">
                      <div key={li.lineItemId} class="qb-rc-prod-row">
                        <span class="qb-rc-prod-name">{li.productName}</span>
                        <span class="qb-rc-prod-qty">{li.quantity}</span>
                        <span class="qb-rc-prod-price">{li.listPrice} €</span>
                      </div>
                    </template>
                  </div>
                </template>

                <!-- ── Meta strip: tags + AI score ── -->
                <div class="qb-rc-meta-strip">
                  <div class="qb-rc-tags">
                    <template if:true={r.hasVolumeDiscount}>
                      <span class="qb-rc-tag">
                        <lightning-icon
                          icon-name="utility:discount"
                          size="xx-small"
                        ></lightning-icon>
                        Vol. Discount
                      </span>
                    </template>
                    <template if:true={r.needsApproval}>
                      <span class="qb-rc-tag qb-rc-tag-warn">
                        <lightning-icon
                          icon-name="utility:warning"
                          size="xx-small"
                        ></lightning-icon>
                        Approval needed
                      </span>
                    </template>
                    <template if:true={r.hasCounterOffer}>
                      <span class="qb-rc-tag">↩ {r.counterOfferLabel}</span>
                    </template>
                    <template if:true={r.roundLabel}>
                      <span class="qb-rc-tag">
                        <lightning-icon
                          icon-name="utility:loop"
                          size="xx-small"
                        ></lightning-icon>
                        {r.roundsLeftLabel}
                      </span>
                    </template>
                  </div>
                  <template if:true={r.acceptanceProbability}>
                    <div class="qb-rc-ai">
                      <lightning-icon
                        icon-name="utility:einstein"
                        size="xx-small"
                        class="qb-einstein-ico"
                      ></lightning-icon>
                      <span class="qb-rc-ai-pct"
                        >{r.acceptanceProbability}%</span
                      >
                      <div class="qb-rc-ai-bar">
                        <div class="qb-rc-ai-fill" style={r.probStyle}></div>
                      </div>
                    </div>
                  </template>
                </div>

                <!-- ── Counter-response form ── -->
                <template if:true={r.showCounterForm}>
                  <div class="qb-counter-form">
                    <div class="qb-counter-form-title">
                      <lightning-icon
                        icon-name="utility:reply"
                        size="xx-small"
                      ></lightning-icon>
                      Respond to counter-offer
                    </div>
                    <div class="qb-counter-form-row">
                      <input
                        type="number"
                        class="qb-counter-input"
                        placeholder="Your price (€)"
                        value={_counterResponsePrice}
                        oninput={handleCounterRespPrice}
                      />
                      <input
                        type="text"
                        class="qb-counter-input"
                        placeholder="Message (optional)"
                        value={_counterResponseMsg}
                        oninput={handleCounterRespMsg}
                      />
                    </div>
                    <label class="qb-counter-final-row">
                      <input
                        type="checkbox"
                        checked={counterIsFinal}
                        onchange={handleCounterFinalToggle}
                      />
                      <span class="qb-counter-final-label"
                        >Mark as Final Offer</span
                      >
                    </label>
                    <div class="qb-counter-form-btns">
                      <button
                        class="qb-rc-btn-primary"
                        onclick={handleSubmitCounterResponse}
                        disabled={counterSubmitting}
                      >
                        <lightning-icon
                          icon-name="utility:send"
                          size="x-small"
                          variant="inverse"
                        ></lightning-icon>
                        <span>{counterSubmitLabel}</span>
                      </button>
                      <button
                        class="qb-rc-btn-secondary"
                        onclick={handleCloseCounterForm}
                      >
                        Cancel
                      </button>
                    </div>
                  </div>
                </template>

                <!-- ── Footer actions ── -->
                <div class="qb-rc-footer">
                  <template if:true={r.hasCounter}>
                    <button
                      class="qb-rc-btn-primary"
                      data-id={r.quoteId}
                      onclick={handleOpenCounterForm}
                    >
                      <lightning-icon
                        icon-name="utility:reply"
                        size="x-small"
                        variant="inverse"
                      ></lightning-icon>
                      <span>Respond</span>
                      <span class="qb-rc-btn-sub">{r.counterOfferLabel}</span>
                    </button>
                  </template>
                  <template if:false={r.hasCounter}>
                    <button
                      class="qb-rc-btn-primary"
                      data-id={r.quoteId}
                      onclick={handleQuickSend}
                      disabled={r.isQuickSending}
                    >
                      <lightning-icon
                        icon-name="utility:send"
                        size="x-small"
                        variant="inverse"
                      ></lightning-icon>
                      <span>Send Quote</span>
                      <span class="qb-rc-btn-sub">1-click · Email</span>
                    </button>
                  </template>
                  <button
                    class="qb-rc-btn-secondary"
                    data-id={r.quoteId}
                    onclick={handleBuildFromRequest}
                  >
                    <lightning-icon
                      icon-name="utility:edit"
                      size="x-small"
                    ></lightning-icon>
                    <span>Customize</span>
                  </button>
                </div>
              </div>
            </template>
          </div>
        </template>
      </div>
    </template>

    <!-- ══════════════════════════════════════════════════════════════
         BUILDER VIEW
    ══════════════════════════════════════════════════════════════ -->
    <template if:true={isBuilderView}>
      <div class="qb-builder-wrap">
        <!-- Builder back nav (full width) -->
        <div class="qb-builder-nav">
          <button class="qb-vb-ghost" onclick={handleBackToList}>
            <lightning-icon
              icon-name="utility:back"
              size="x-small"
            ></lightning-icon>
            <span>Back to Quotes</span>
          </button>
        </div>

        <div class="qb-builder">
          <!-- LEFT — Product catalogue -->
          <div class="qb-catalogue">
            <div class="qb-pane-head">
              <div class="qb-pane-title">
                <lightning-icon
                  icon-name="standard:product"
                  size="small"
                ></lightning-icon>
                <span>Product Catalogue</span>
              </div>
              <div class="qb-search-wrap">
                <lightning-icon
                  icon-name="utility:search"
                  size="x-small"
                  class="qb-search-ico"
                ></lightning-icon>
                <input
                  type="text"
                  class="qb-search-input"
                  placeholder="Search..."
                  value={_productSearch}
                  onchange={handleProductSearch}
                />
              </div>
            </div>

            <template if:true={productLoading}>
              <div class="qb-spinner-wrap">
                <lightning-spinner
                  size="medium"
                  alternative-text="Loading..."
                ></lightning-spinner>
              </div>
            </template>

            <template if:false={productLoading}>
              <div class="qb-prod-grid">
                <template for:each={products} for:item="p">
                  <div key={p.productId} class="qb-prod-card">
                    <template if:true={p.imageUrl}>
                      <img src={p.imageUrl} alt={p.name} class="qb-prod-img" />
                    </template>
                    <template if:false={p.imageUrl}>
                      <div class="qb-prod-img-placeholder">
                        <lightning-icon
                          icon-name="standard:product"
                          size="medium"
                        ></lightning-icon>
                      </div>
                    </template>
                    <div class="qb-prod-info">
                      <div class="qb-prod-name" title={p.name}>{p.name}</div>
                      <div class="qb-prod-family">{p.family}</div>
                      <template if:true={p.productType}>
                        <div class="qb-prod-type-row">
                          <span class="qb-prod-type-chip">{p.productType}</span>
                          <template if:true={p.billingFrequency}>
                            <span class="qb-prod-billing-chip"
                              >{p.billingFrequency}</span
                            >
                          </template>
                        </div>
                      </template>
                      <div class="qb-prod-price">{p.price} €</div>
                    </div>
                    <button
                      class="qb-add-btn"
                      data-id={p.productId}
                      onclick={handleAddProduct}
                    >
                      {p.addLabel}
                    </button>
                  </div>
                </template>
                <template if:false={hasProducts}>
                  <div class="qb-no-results">No products found.</div>
                </template>
              </div>
            </template>
          </div>

          <!-- RIGHT — Cart + summary -->
          <div class="qb-cart-panel">
            <div class="qb-pane-head">
              <div class="qb-pane-title">
                <lightning-icon
                  icon-name="utility:cart"
                  size="small"
                ></lightning-icon>
                <span>Quote Lines</span>
                <span class="qb-count-pill">{cartCount}</span>
              </div>
            </div>

            <template if:true={cartEmpty}>
              <div class="qb-cart-empty">
                <lightning-icon
                  icon-name="utility:cart"
                  size="large"
                ></lightning-icon>
                <p>Add products to build your quote.</p>
              </div>
            </template>

            <template if:true={hasCartItems}>
              <div class="qb-cart-list">
                <template for:each={cartItems} for:item="item">
                  <div key={item.key} class="qb-cart-row">
                    <div class="qb-cart-info">
                      <div class="qb-cart-prod-name">{item.productName}</div>
                      <div class="qb-cart-prod-family">
                        {item.productFamily}
                        <template if:true={item.productType}>
                          &nbsp;·&nbsp;
                          <span class="qb-prod-type-chip qb-prod-type-chip-sm"
                            >{item.productType}</span
                          >
                          <template if:true={item.billingFrequency}>
                            &nbsp;<span
                              class="qb-prod-billing-chip qb-prod-type-chip-sm"
                              >{item.billingFrequency}</span
                            >
                          </template>
                        </template>
                      </div>
                      <template if:true={item.hasStockWarning}>
                        <div class="qb-stock-warning">
                          <lightning-icon
                            icon-name="utility:warning"
                            size="x-small"
                          ></lightning-icon>
                          {item.stockWarningMsg}
                        </div>
                      </template>
                      <template if:true={item.hasStockAlert}>
                        <div class="qb-stock-alert">
                          <lightning-icon
                            icon-name="utility:info"
                            size="x-small"
                          ></lightning-icon>
                          {item.stockWarningMsg}
                        </div>
                      </template>
                    </div>
                    <div class="qb-cart-right">
                      <div class="qb-qty-wrap">
                        <button
                          class="qb-qty-btn"
                          data-id={item.productId}
                          data-action="dec"
                          onclick={handleQtyChange}
                        >
                          −
                        </button>
                        <input
                          type="number"
                          min="1"
                          class="qb-qty-field"
                          value={item.quantity}
                          data-id={item.productId}
                          onchange={handleQtyChange}
                        />
                        <button
                          class="qb-qty-btn"
                          data-id={item.productId}
                          data-action="inc"
                          onclick={handleQtyChange}
                        >
                          +
                        </button>
                      </div>
                      <div class="qb-cart-prices">
                        <div class="qb-cart-net">{item.netLineTotal}</div>
                      </div>
                      <button
                        class="qb-remove-btn"
                        data-id={item.productId}
                        onclick={handleRemoveFromCart}
                        title="Remove"
                      >
                        <lightning-icon
                          icon-name="utility:close"
                          size="x-small"
                        ></lightning-icon>
                      </button>
                    </div>
                  </div>
                </template>
              </div>

              <!-- Stock warning banner -->
              <template if:true={hasStockWarnings}>
                <div class="qb-stock-banner">
                  <lightning-icon
                    icon-name="utility:warning"
                    size="x-small"
                    variant="inverse"
                  ></lightning-icon>
                  <span
                    >Some items exceed available stock — the quote will be sent
                    with a partial delivery note.</span
                  >
                </div>
              </template>

              <!-- Pricing summary -->
              <div class="qb-price-box">
                <div class="qb-price-line">
                  <span class="qb-price-label">Subtotal</span>
                  <span class="qb-price-val">{formattedSubtotal}</span>
                </div>
                <div class="qb-price-line qb-price-discount">
                  <span class="qb-price-label">
                    <lightning-icon
                      icon-name="utility:discount"
                      size="x-small"
                      class="qb-discount-ico"
                    ></lightning-icon>
                    Volume Discount ({bulkDiscountLabel})
                  </span>
                  <span class="qb-price-val">−{formattedDiscountAmount}</span>
                </div>
                <div class="qb-price-line">
                  <span class="qb-price-label">Terms</span>
                  <span class="qb-terms-chip">{paymentTermsLabel}</span>
                </div>
                <div class="qb-price-total-line">
                  <span>Grand Total</span>
                  <span class="qb-price-total-val">{formattedGrandTotal}</span>
                </div>
              </div>
            </template>

            <div class="qb-generate-wrap">
              <button
                class="qb-btn-generate"
                onclick={handleGenerateQuote}
                disabled={cartEmpty}
              >
                <lightning-icon
                  icon-name="utility:einstein"
                  size="x-small"
                  variant="inverse"
                ></lightning-icon>
                <span>{generateLabel}</span>
              </button>
              <p class="qb-generate-hint">
                AI score will be calculated by Agentforce after generation.
              </p>
            </div>
          </div>
        </div>
        <!-- /qb-builder -->
      </div>
      <!-- /qb-builder-wrap -->
    </template>

    <!-- ══════════════════════════════════════════════════════════════
         GENERATED RESULT VIEW
    ══════════════════════════════════════════════════════════════ -->
    <template if:true={isGeneratedView}>
      <div class="qb-panel">
        <!-- Back nav -->
        <div class="qb-panel-nav">
          <button class="qb-vb-ghost" onclick={handleBackToList}>
            <lightning-icon
              icon-name="utility:back"
              size="x-small"
            ></lightning-icon>
            <span>Back to Quotes</span>
          </button>
        </div>

        <!-- Success banner -->
        <div class="qb-success-banner">
          <div class="qb-success-icon">
            <lightning-icon
              icon-name="utility:success"
              size="medium"
              variant="success"
            ></lightning-icon>
          </div>
          <div>
            <div class="qb-success-title">Quote generated successfully</div>
            <div class="qb-success-sub">
              {generated.quoteName} &nbsp;·&nbsp; {generated.paymentTerms}
              &nbsp;·&nbsp; Discount {generated.bulkDiscount}%
            </div>
          </div>
        </div>

        <!-- Financial metric cards -->
        <div class="qb-metric-row">
          <div class="qb-metric-card">
            <div class="qb-metric-label">List Total</div>
            <div class="qb-metric-value">{generated.subtotal} €</div>
          </div>
          <div class="qb-metric-card qb-metric-red">
            <div class="qb-metric-label">Volume Discount</div>
            <div class="qb-metric-value qb-fin-red">
              −{generated.discountAmount} €
            </div>
          </div>
          <div class="qb-metric-card qb-metric-blue">
            <div class="qb-metric-label">Grand Total</div>
            <div class="qb-metric-value qb-metric-main">
              {generated.grandTotal} €
            </div>
          </div>
        </div>

        <!-- MRR / Revenue-type breakdown row -->
        <div class="qb-metric-row">
          <div class="qb-metric-card">
            <div class="qb-metric-label">One-time Revenue</div>
            <div class="qb-metric-value">{generated.oneTimeTotal} €</div>
          </div>
          <div class="qb-metric-card">
            <div class="qb-metric-label">Recurring Revenue</div>
            <div class="qb-metric-value">{generated.recurringTotal} €</div>
          </div>
          <div class="qb-metric-card qb-metric-blue">
            <div class="qb-metric-label">MRR</div>
            <div class="qb-metric-value qb-metric-main">{generated.mrr} €</div>
          </div>
        </div>

        <!-- AI panel -->
        <div class="qb-ai-panel">
          <div class="qb-ai-panel-header">
            <lightning-icon
              icon-name="utility:einstein"
              size="small"
              class="qb-ai-panel-ico"
            ></lightning-icon>
            <span class="qb-ai-panel-title"
              >Nexus AI — Acceptance Probability</span
            >
          </div>
          <div class="qb-ai-big-score">
            <span class="qb-ai-pct-large">{aiProbLabel}</span>
            <span class="qb-ai-pct-desc">estimated acceptance probability</span>
          </div>
          <div class="qb-bar-track qb-bar-dark">
            <div class={aiProbColorCls} style={aiProbStyle}></div>
          </div>
          <p class="qb-ai-reason-text">{generated.aiReason}</p>
          <div class="qb-af-source">
            <lightning-icon
              icon-name="utility:einstein"
              size="x-small"
              class="qb-af-ico"
            ></lightning-icon>
            <span
              >Analyzed by
              <strong>Nexus Quote Analyst</strong> (Agentforce)</span
            >
          </div>
        </div>

        <!-- Send to customer -->
        <div class="qb-send-section">
          <div class="qb-send-info">
            <div class="qb-send-title">Send to Customer</div>
            <div class="qb-send-desc">
              The customer will receive this quote by email and can accept or
              negotiate from their portal. Set a floor price (optional): any
              counter-offer above it is auto-accepted; within 15% it is met
              halfway; otherwise refused.
            </div>
          </div>
          <div class="qb-floor-price-row">
            <label class="qb-floor-label">Floor Price (€)</label>
            <input
              type="number"
              class="qb-floor-input"
              placeholder="e.g. 9 000"
              value={editFloorPrice}
              onchange={handleFloorPriceChange}
              min="0"
              step="0.01"
            />
          </div>
          <button
            class="qb-btn-primary"
            data-id={generated.quoteId}
            onclick={handleSendToCustomer}
            disabled={sending}
          >
            <lightning-icon
              icon-name="utility:send"
              size="x-small"
              variant="inverse"
            ></lightning-icon>
            <span>{sendingLabel}</span>
          </button>
        </div>
      </div>
    </template>

    <!-- ══════════════════════════════════════════════════════════════
         DETAIL VIEW
    ══════════════════════════════════════════════════════════════ -->
    <template if:true={isDetailView}>
      <template if:true={selectedQuote}>
        <div class="qb-panel qb-detail-panel">
          <!-- Detail page header -->
          <div class="qb-detail-header">
            <div class="qb-detail-id">
              <div class="qb-detail-icon-wrap">
                <lightning-icon
                  icon-name="standard:quotes"
                  size="medium"
                ></lightning-icon>
              </div>
              <div>
                <h2 class="qb-detail-name">{selectedQuote.name}</h2>
                <p class="qb-detail-meta">
                  {selectedQuote.accountName} &nbsp;·&nbsp;
                  {selectedQuote.opportunityName} &nbsp;·&nbsp;
                  {selectedQuote.versionLabel}
                </p>
              </div>
            </div>
            <div class="qb-detail-header-right">
              <div class="qb-badge-group">
                <span class={selectedQuote.statusBadgeCls}
                  >{selectedQuote.status}</span
                >
                <span class={selectedQuote.negBadgeCls}
                  >{selectedQuote.negotiationStatus}</span
                >
              </div>
              <button class="qb-vb-ghost" onclick={handleBackToList}>
                <lightning-icon
                  icon-name="utility:back"
                  size="x-small"
                ></lightning-icon>
                <span>Back to Quotes</span>
              </button>
            </div>
          </div>

          <!-- Two-column layout: main (table) + sidebar (AI + fin + actions) -->
          <div class="qb-detail-layout">
            <!-- LEFT — Line items table -->
            <div class="qb-detail-main">
              <div class="qb-table-section">
                <div class="qb-table-title">Quote Lines</div>
                <div class="qb-table-wrap">
                  <table class="qb-table">
                    <thead>
                      <tr>
                        <th>Product</th>
                        <th class="qb-th-center">Qty</th>
                        <th class="qb-th-right">List Price</th>
                        <th class="qb-th-right">Discount</th>
                        <th class="qb-th-right">Unit Price</th>
                        <th class="qb-th-right">Net Total</th>
                      </tr>
                    </thead>
                    <tbody>
                      <template
                        for:each={selectedQuote.lineItems}
                        for:item="li"
                      >
                        <tr key={li.lineItemId}>
                          <td>
                            <div class="qb-li-name">{li.productName}</div>
                            <div class="qb-li-family">{li.productFamily}</div>
                          </td>
                          <td class="qb-td-center">{li.quantity}</td>
                          <td class="qb-td-right">{li.listPrice} €</td>
                          <td class="qb-td-right qb-td-discount">
                            {li.discount}%
                          </td>
                          <td class="qb-td-right">{li.unitPrice} €</td>
                          <td class="qb-td-right qb-td-net">
                            {li.formattedNetTotal}
                          </td>
                        </tr>
                      </template>
                    </tbody>
                  </table>
                </div>
              </div>

              <!-- Action bar inside main column -->
              <div class="qb-action-bar">
                <!-- Send + floor price + revise: only for editable quotes (not accepted/rejected/signed) -->
                <template if:true={canShowQuoteActions}>
                  <div class="qb-floor-price-row">
                    <label class="qb-floor-label">Floor Price (€)</label>
                    <input
                      type="number"
                      class="qb-floor-input"
                      placeholder="Optional"
                      value={editFloorPrice}
                      onchange={handleFloorPriceChange}
                      min="0"
                      step="0.01"
                    />
                  </div>
                  <button
                    class="qb-btn-outline"
                    data-id={selectedQuote.quoteId}
                    onclick={handleSendToCustomer}
                    disabled={sending}
                  >
                    <lightning-icon
                      icon-name="utility:send"
                      size="x-small"
                    ></lightning-icon>
                    <span>{sendingLabel}</span>
                  </button>
                  <button
                    class="qb-btn-outline"
                    data-id={selectedQuote.quoteId}
                    onclick={handleOpenEditVersion}
                  >
                    <lightning-icon
                      icon-name="utility:edit"
                      size="x-small"
                    ></lightning-icon>
                    <span>Revise (New Version)</span>
                  </button>
                </template>
                <!-- Generate Contract: only for accepted quotes -->
                <template if:true={canGenerateContract}>
                  <button
                    class="qb-btn-contract"
                    data-id={selectedQuote.quoteId}
                    onclick={handleGenerateAndSendContract}
                    disabled={generatingContract}
                  >
                    <lightning-icon
                      icon-name="utility:contract_line_outcome"
                      size="x-small"
                      variant="inverse"
                    ></lightning-icon>
                    <span>{generateContractLabel}</span>
                  </button>
                </template>
              </div>
            </div>

            <!-- RIGHT SIDEBAR — AI + financials -->
            <div class="qb-detail-sidebar">
              <!-- AI panel -->
              <div class="qb-ai-panel">
                <div class="qb-ai-panel-header">
                  <lightning-icon
                    icon-name="utility:einstein"
                    size="small"
                    class="qb-ai-panel-ico"
                  ></lightning-icon>
                  <span class="qb-ai-panel-title">AI Score</span>
                </div>
                <div class="qb-ai-big-score">
                  <span class="qb-ai-pct-large"
                    >{selectedQuote.acceptanceProbability}%</span
                  >
                  <span class="qb-ai-pct-desc">acceptance probability</span>
                </div>
                <div class="qb-bar-track qb-bar-dark">
                  <div
                    class={selectedQuote.probColorCls}
                    style={selectedQuote.probStyle}
                  ></div>
                </div>
                <p class="qb-ai-reason-text">{selectedQuote.aiReason}</p>
                <div class="qb-af-source">
                  <lightning-icon
                    icon-name="utility:einstein"
                    size="x-small"
                    class="qb-af-ico"
                  ></lightning-icon>
                  <span>Scored by <strong>Nexus Quote Analyst</strong></span>
                </div>
              </div>

              <!-- Financial metrics -->
              <div class="qb-sidebar-fin">
                <div class="qb-sidebar-fin-item">
                  <div class="qb-fin-label">Grand Total</div>
                  <div class="qb-fin-value qb-fin-main">
                    {selectedQuote.formattedTotal}
                  </div>
                </div>
                <template if:true={selectedQuote.formattedFinalPrice}>
                  <div class="qb-sidebar-fin-item">
                    <div class="qb-fin-label">Final Negotiated Price</div>
                    <div class="qb-fin-value qb-fin-green">
                      {selectedQuote.formattedFinalPrice}
                    </div>
                  </div>
                </template>
                <div class="qb-sidebar-fin-item">
                  <div class="qb-fin-label">Payment</div>
                  <div class="qb-fin-value">{selectedQuote.paymentTerms}</div>
                </div>
                <div class="qb-sidebar-fin-item">
                  <div class="qb-fin-label">Volume Discount</div>
                  <div class="qb-fin-value qb-fin-red">
                    {selectedQuote.bulkDiscount}%
                  </div>
                </div>
                <div class="qb-sidebar-fin-item">
                  <div class="qb-fin-label">Version</div>
                  <div class="qb-fin-value">{selectedQuote.versionLabel}</div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </template>
    </template>

    <!-- ══════════════════════════════════════════════════════════════
         EDIT VERSION VIEW
    ══════════════════════════════════════════════════════════════ -->
    <template if:true={isEditVersionView}>
      <div class="qb-panel">
        <!-- Back nav -->
        <div class="qb-panel-nav">
          <button class="qb-vb-ghost" onclick={handleBackToList}>
            <lightning-icon
              icon-name="utility:back"
              size="x-small"
            ></lightning-icon>
            <span>Back to Quotes</span>
          </button>
        </div>

        <div class="qb-edit-header">
          <div class="qb-edit-icon-wrap">
            <lightning-icon
              icon-name="utility:edit"
              size="small"
              variant="inverse"
            ></lightning-icon>
          </div>
          <div>
            <div class="qb-panel-title">Revise Quote — New Version</div>
            <div class="qb-panel-sub">
              Adjust quantities, prices and discounts. A v+1 version will be
              created and re-scored by AI.
            </div>
          </div>
        </div>

        <!-- Editable table -->
        <div class="qb-table-wrap qb-table-wrap-edit">
          <table class="qb-table qb-table-edit">
            <thead>
              <tr>
                <th>Product</th>
                <th class="qb-th-center">Qty</th>
                <th class="qb-th-right">List Price (€)</th>
                <th class="qb-th-right">Discount (%)</th>
                <th class="qb-th-right">Net Price (€)</th>
                <th class="qb-th-right">Line Total</th>
              </tr>
            </thead>
            <tbody>
              <template for:each={editLineItems} for:item="li">
                <tr key={li.key}>
                  <td>
                    <div class="qb-li-name">{li.productName}</div>
                    <div class="qb-li-family">{li.productFamily}</div>
                  </td>
                  <td class="qb-td-center">
                    <input
                      type="number"
                      min="1"
                      class="qb-edit-input qb-edit-qty"
                      value={li.quantity}
                      data-key={li.key}
                      onchange={handleEditLineQty}
                    />
                  </td>
                  <td class="qb-td-right">
                    <input
                      type="number"
                      min="0"
                      step="0.01"
                      class="qb-edit-input qb-edit-price"
                      value={li.listPrice}
                      data-key={li.key}
                      onchange={handleEditLinePrice}
                    />
                  </td>
                  <td class="qb-td-right">
                    <input
                      type="number"
                      min="0"
                      max="100"
                      step="0.5"
                      class="qb-edit-input qb-edit-disc"
                      value={li.discount}
                      data-key={li.key}
                      onchange={handleEditLineDiscount}
                    />
                  </td>
                  <td class="qb-td-right qb-td-net">{li.unitPrice} €</td>
                  <td class="qb-td-right qb-td-net">{li.netTotal} €</td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>

        <!-- Conditions row -->
        <div class="qb-conditions-row">
          <div class="qb-condition-field">
            <label class="qb-field-label">Global Volume Discount (%)</label>
            <input
              type="number"
              min="0"
              max="100"
              class="qb-field-input"
              value={editDiscount}
              onchange={handleEditDiscount}
            />
          </div>
          <div class="qb-condition-field">
            <label class="qb-field-label">Payment Terms</label>
            <select class="qb-field-select" onchange={handleEditPaymentTerms}>
              <option value="Net 30" selected={isPaymentNet30}>Net 30</option>
              <option value="Net 45" selected={isPaymentNet45}>Net 45</option>
              <option value="Net 60" selected={isPaymentNet60}>Net 60</option>
              <option value="Net 90" selected={isPaymentNet90}>Net 90</option>
              <option value="Immediate" selected={isPaymentImmediate}>
                Immediate
              </option>
            </select>
          </div>
          <div class="qb-condition-field">
            <label class="qb-field-label">Valid until</label>
            <input
              type="date"
              class="qb-field-input"
              value={editExpiration}
              onchange={handleEditExpiration}
            />
          </div>
        </div>

        <!-- Revised total -->
        <div class="qb-revised-total">
          <span class="qb-revised-label">Revised Total</span>
          <span class="qb-revised-val">{editGrandTotalFormatted}</span>
        </div>

        <!-- Save -->
        <div class="qb-edit-actions">
          <button
            class="qb-btn-primary"
            onclick={handleSaveVersion}
            disabled={savingVersion}
          >
            <lightning-icon
              icon-name="utility:save"
              size="x-small"
              variant="inverse"
            ></lightning-icon>
            <span>{saveVersionLabel}</span>
          </button>
        </div>
      </div>
    </template>
  </div>
</template>

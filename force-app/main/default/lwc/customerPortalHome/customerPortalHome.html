<template>
    <div class="portal-wrap">

        <!-- ── Welcome Header ─────────────────────────────────────────────── -->
        <div class="welcome-bar">
            <div class="welcome-left">
                <div class="avatar">{initials}</div>
                <div>
                    <h2 class="welcome-title">Bonjour, {firstName}&nbsp;&#x1F44B;</h2>
                    <p class="welcome-sub">Bienvenue sur votre espace TALCORE</p>
                </div>
            </div>
            <div class="welcome-right">
                <div class="talexo-badge">TALCORE</div>
            </div>
        </div>

        <!-- ── Journey Progress ───────────────────────────────────────────── -->
        <div class="journey-card">
            <h3 class="journey-title">Votre parcours</h3>
            <div class="journey-steps">
                <template for:each={journeySteps} for:item="step">
                    <div key={step.id} class={step.wrapClass}>
                        <div class={step.dotClass}>
                            <template if:true={step.done}>&#x2713;</template>
                            <template if:false={step.done}>{step.num}</template>
                        </div>
                        <span class="j-label">{step.label}</span>
                        <template if:true={step.active}>
                            <span class="j-active-tag">En cours</span>
                        </template>
                    </div>
                </template>
            </div>
            <div class="journey-bar-wrap">
                <div class="journey-bar-fill" style={journeyProgressStyle}></div>
            </div>
        </div>

        <!-- ── Stats Row ──────────────────────────────────────────────────── -->
        <div class="stats-row">
            <div class="stat-card">
                <span class="stat-icon">&#x1F4CA;</span>
                <div class="stat-body">
                    <span class="stat-val">{summary.activeDeals}</span>
                    <span class="stat-lbl">Offres actives</span>
                </div>
            </div>
            <div class="stat-card">
                <span class="stat-icon">&#x1F4E6;</span>
                <div class="stat-body">
                    <span class="stat-val">{summary.totalOrders}</span>
                    <span class="stat-lbl">Commandes</span>
                </div>
            </div>
            <div class="stat-card">
                <span class="stat-icon">&#x1F3F7;&#xFE0F;</span>
                <div class="stat-body">
                    <span class="stat-val">{summary.openCases}</span>
                    <span class="stat-lbl">Tickets ouverts</span>
                </div>
            </div>
            <div class="stat-card stat-card-highlight">
                <span class="stat-icon">&#x2B50;</span>
                <div class="stat-body">
                    <span class="stat-val">{summary.latestOppStage}</span>
                    <span class="stat-lbl">Statut actuel</span>
                </div>
            </div>
        </div>

        <!-- ── Quick Access Grid ──────────────────────────────────────────── -->
        <div class="quick-grid">
            <div class="quick-card qc-deals" onclick={goDeals}>
                <div class="qc-icon">&#x1F4CB;</div>
                <div class="qc-body">
                    <h4>Mes Offres</h4>
                    <p>Suivez l'avancement de vos devis et opportunit&#xe9;s</p>
                </div>
                <span class="qc-arrow">&#x2192;</span>
            </div>
            <div class="quick-card qc-orders" onclick={goOrders}>
                <div class="qc-icon">&#x1F6D2;</div>
                <div class="qc-body">
                    <h4>Mes Commandes</h4>
                    <p>Consultez et suivez toutes vos commandes</p>
                </div>
                <span class="qc-arrow">&#x2192;</span>
            </div>
            <div class="quick-card qc-support" onclick={goSupport}>
                <div class="qc-icon">&#x1F4AC;</div>
                <div class="qc-body">
                    <h4>Support</h4>
                    <p>Cr&#xe9;ez et suivez vos tickets d'assistance</p>
                </div>
                <span class="qc-arrow">&#x2192;</span>
            </div>
            <div class="quick-card qc-catalog" onclick={goCatalog}>
                <div class="qc-icon">&#x1F4BB;</div>
                <div class="qc-body">
                    <h4>Catalogue</h4>
                    <p>D&#xe9;couvrez et commandez nos produits IT</p>
                </div>
                <span class="qc-arrow">&#x2192;</span>
            </div>
        </div>

    </div>
</template>

<template>
  <div class="npcart-wrap">
    <!-- ── Main grid (8/4 col split matches TSX lg:grid-cols-12) ── -->
    <div class="npcart-layout">
      <!-- Items list -->
      <div class="npcart-items">
        <template if:true={hasItems}>
          <template for:each={cartItems} for:item="item">
            <c-nexus-portal-cart-item
              key={item.itemId}
              item-id={item.itemId}
              product-id={item.productId}
              product-name={item.name}
              product-family={item.family}
              product-description={item.description}
              image-url={item.imageUrl}
              unit-price={item.unitPrice}
              quantity={item.quantity}
              onremoveitem={handleRemoveItem}
              onupdateqty={handleUpdateQty}
            ></c-nexus-portal-cart-item>
          </template>
        </template>

        <!-- Empty state — dashed border, Package icon, matches TSX -->
        <template if:false={hasItems}>
          <div class="npcart-empty">
            <div class="npcart-empty-icon">
              <lightning-icon
                icon-name="utility:package"
                size="large"
              ></lightning-icon>
            </div>
            <h3 class="npcart-empty-title">Your cart is empty</h3>
            <button class="npcart-empty-btn" onclick={handleGoCatalog}>
              Explore Catalog
            </button>
          </div>
        </template>
      </div>

      <!-- Summary column (only when items exist) -->
      <template if:true={hasItems}>
        <div class="npcart-summary-col">
          <c-nexus-portal-cart-summary
            subtotal={subtotal}
            item-count={itemCount}
            sparks-balance={sparksBalance}
            is-b2-c={isB2C}
            onplaceorder={handlePlaceOrder}
            onrequestquote={handleRequestQuote}
          ></c-nexus-portal-cart-summary>
        </div>
      </template>
    </div>

    <!-- ── Quote Generation Modal (B2B only) ── -->
    <template if:false={isB2C}>
      <template if:true={showQuoteModal}>
        <div class="npcart-overlay">
          <div class="npcart-modal">
            <template if:true={isGeneratingQuote}>
              <div class="npcart-modal-loading">
                <div class="npcart-spinner">
                  <div class="npcart-spinner-ring"></div>
                </div>
                <h3 class="npcart-modal-h">AI is building your quote...</h3>
                <p class="npcart-modal-sub">
                  Applying volume pricing, AI scoring &amp; floor calculation
                </p>
              </div>
            </template>

            <template if:true={showQuoteResult}>
              <!-- Error state -->
              <template if:true={hasError}>
                <div class="npcart-modal-result">
                  <div class="npcart-modal-top">
                    <div class="npcart-modal-error-icon">&#x2715;</div>
                    <button
                      class="npcart-modal-close"
                      onclick={handleCloseModal}
                    >
                      &#x2715;
                    </button>
                  </div>
                  <h3 class="npcart-modal-h">Request Failed</h3>
                  <p class="npcart-modal-sub npcart-error-msg">{quoteError}</p>
                  <button class="npcart-done-btn" onclick={handleCloseModal}>
                    Close
                  </button>
                </div>
              </template>
              <!-- Success state -->
              <template if:false={hasError}>
                <div class="npcart-modal-result">
                  <div class="npcart-modal-top">
                    <div class="npcart-modal-ai-badge">
                      <lightning-icon
                        icon-name="utility:sparkles"
                        size="x-small"
                        variant="inverse"
                      ></lightning-icon>
                    </div>
                    <button
                      class="npcart-modal-close"
                      onclick={handleCloseModal}
                    >
                      &#x2715;
                    </button>
                  </div>
                  <h3 class="npcart-modal-h">Your quote is ready!</h3>
                  <p class="npcart-modal-sub npcart-modal-sub--strong">
                    {generatedQuoteName}
                  </p>
                  <p class="npcart-modal-sub">
                    AI-generated &amp; presented instantly. Our agent is ready
                    to negotiate pricing and terms with you right now.
                  </p>
                  <div class="npcart-modal-stats">
                    <div class="npcart-stat">
                      <div class="npcart-stat-label">Status</div>
                      <div class="npcart-stat-value npcart-stat--green">
                        Presented
                      </div>
                    </div>
                    <div class="npcart-stat">
                      <div class="npcart-stat-label">Response time</div>
                      <div class="npcart-stat-value npcart-stat--green">
                        Instant
                      </div>
                    </div>
                  </div>
                  <button class="npcart-quotes-btn npcart-quotes-btn--ai" onclick={handleGoToQuotes}>
                    <lightning-icon
                      icon-name="utility:einstein"
                      size="x-small"
                      variant="inverse"
                    ></lightning-icon>
                    Negotiate with AI →
                  </button>
                  <button
                    class="npcart-done-btn npcart-done-ghost"
                    onclick={handleCloseModal}
                  >
                    View later
                  </button>
                </div>
              </template>
            </template>
          </div>
        </div>
      </template> </template
    ><!-- end if:false={isB2C} -->
  </div>
</template>

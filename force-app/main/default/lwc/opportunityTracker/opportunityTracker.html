<template>
    <div class="opp-wrap">

        <!-- Header -->
        <div class="opp-header">
            <h2 class="opp-title">My Deals &amp; Quotes</h2>
            <p class="opp-sub">Track every enquiry from submission to completion</p>
        </div>

        <!-- Loading -->
        <template if:true={isLoading}>
            <div class="spinner-wrap">
                <lightning-spinner alternative-text="Loading..." size="medium"></lightning-spinner>
            </div>
        </template>

        <!-- Opportunities list -->
        <template if:true={hasOpportunities}>
            <template for:each={opportunities} for:item="opp">
                <div key={opp.oppId} class="opp-card">

                    <!-- Card header row -->
                    <div class="card-top">
                        <div class="card-left">
                            <span class={opp.stageBadgeClass}>{opp.stageName}</span>
                            <h3 class="opp-name">{opp.name}</h3>
                            <div class="opp-meta">
                                <template if:true={opp.amount}>
                                    <span class="meta-chip">&#xA3;{opp.formattedAmount}</span>
                                </template>
                                <template if:true={opp.closeDate}>
                                    <span class="meta-chip">&#x1F4C5; Est. Close: {opp.closeDate}</span>
                                </template>
                                <span class="meta-chip">&#x1F4CC; Opened: {opp.createdDate}</span>
                            </div>
                        </div>
                        <div class="card-right">
                            <div class={opp.statusDotClass}></div>
                        </div>
                    </div>

                    <!-- Closed Lost state -->
                    <template if:true={opp.isLost}>
                        <div class="lost-banner">
                            &#x274C; This enquiry was closed. Please contact us to discuss further options.
                        </div>
                    </template>

                    <!-- Progress bar (only for non-lost) -->
                    <template if:false={opp.isLost}>
                        <div class="progress-section">
                            <div class="progress-track">
                                <div class="progress-fill" style={opp.progressStyle}></div>
                            </div>
                            <div class="stage-steps">
                                <template for:each={opp.stageSteps} for:item="step">
                                    <div key={step.name} class={step.stepClass}>
                                        <div class={step.dotClass}>
                                            <template if:true={step.isDone}>&#x2713;</template>
                                            <template if:false={step.isDone}>{step.index}</template>
                                        </div>
                                        <span class="step-lbl">{step.label}</span>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </template>

                    <!-- Description -->
                    <template if:true={opp.description}>
                        <p class="opp-desc">{opp.description}</p>
                    </template>

                </div>
            </template>
        </template>

        <!-- Empty state -->
        <template if:true={noOpportunities}>
            <div class="empty-state">
                <div class="empty-icon">&#x1F4CB;</div>
                <h3>No deals yet</h3>
                <p>Submit an enquiry using the <strong>Get a Quote</strong> form and our team will create a personalised offer for you.</p>
            </div>
        </template>

    </div>
</template>

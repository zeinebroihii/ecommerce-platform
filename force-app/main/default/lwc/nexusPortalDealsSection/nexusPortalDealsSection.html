<template>
    <section class="npds-section">
        <div class="npds-container">

            <!-- ── Header ── -->
            <div class="npds-header">
                <div class="npds-header-left">
                    <div class="npds-eyebrow">
                        <div class="npds-eyebrow-line"></div>
                        Offres Exclusives
                    </div>
                    <h2 class="npds-heading">
                        TOP <span class="npds-heading-grad">DEALS</span>
                    </h2>
                </div>
                <p class="npds-subtitle">
                    Des offres &agrave; dur&eacute;e limit&eacute;e s&eacute;lectionn&eacute;es pour vous.
                    Ne manquez pas ces opportunit&eacute;s.
                </p>
            </div>

            <!-- ── Cards Grid ── -->
            <div class="npds-grid">
                <template for:each={deals} for:item="deal">
                    <div key={deal.id} class="npds-card">

                        <!-- ── Image area ── -->
                        <div class="npds-card-img-wrap">
                            <img src={deal.image} alt={deal.name} class="npds-card-img" referrerpolicy="no-referrer" />
                            <div class="npds-card-hover-overlay"></div>

                            <!-- Top-left: Family + Active Node badges -->
                            <div class="npds-card-badges-tl">
                                <span class="npds-family-badge">{deal.family}</span>
                                <div class="npds-active-node">
                                    <span class="npds-active-pulse"></span>
                                    Active Node
                                </div>
                            </div>

                            <!-- Top-right: Quick actions (slide in on hover) -->
                            <div class="npds-card-actions-tr">
                                <button class="npds-action-btn" onclick={handleAddToCart} data-id={deal.id} aria-label="Ajouter au panier">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
                                        <path d="M1 1h4l2.68 13.39a2 2 0 002 1.61h9.72a2 2 0 001.97-1.67L21 6H6"/>
                                    </svg>
                                </button>
                                <button class="npds-action-btn" aria-label="Quick view">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
                                    </svg>
                                </button>
                            </div>

                            <!-- Bottom-right: Detail arrow (slides up on hover) -->
                            <button class="npds-detail-btn" onclick={handleViewDetails} data-id={deal.id} aria-label="Voir les d&eacute;tails">
                                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M9 5l7 7-7 7"/>
                                </svg>
                            </button>

                            <!-- Bottom-left: Price + Discount overlay (slides up on hover) -->
                            <div class="npds-price-overlay">
                                <span class="npds-price-msrp">MSRP</span>
                                <span class="npds-price-original">${deal.originalPriceFormatted}</span>
                                <span class="npds-price-sale">${deal.salePriceFormatted}</span>
                                <span class="npds-discount-badge">-{deal.discount}%</span>
                            </div>
                        </div>

                        <!-- ── Content area ── -->
                        <div class="npds-card-body">
                            <div class="npds-card-meta-row">
                                <div class="npds-stars">
                                    <svg width="10" height="10" viewBox="0 0 24 24" fill="#f59e0b" stroke="none"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
                                    <svg width="10" height="10" viewBox="0 0 24 24" fill="#f59e0b" stroke="none"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
                                    <svg width="10" height="10" viewBox="0 0 24 24" fill="#f59e0b" stroke="none"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
                                    <svg width="10" height="10" viewBox="0 0 24 24" fill="#f59e0b" stroke="none"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
                                    <svg width="10" height="10" viewBox="0 0 24 24" fill="#f59e0b" stroke="none"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
                                    <span class="npds-rating-num">4.9</span>
                                </div>
                                <span class="npds-product-code">ID: {deal.productCode}</span>
                            </div>

                            <h4 class="npds-card-name">{deal.name}</h4>
                            <p class="npds-card-desc">{deal.description}</p>

                            <div class="npds-card-footer">
                                <div class="npds-verified">
                                    <div class="npds-verified-row">
                                        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#4f46e5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                                            <polyline points="9 12 11 14 15 10"/>
                                        </svg>
                                        <span class="npds-verified-label">Nexus Verified</span>
                                    </div>
                                    <span class="npds-enterprise-label">Enterprise Ready</span>
                                </div>
                                <button class="npds-cart-btn" onclick={handleAddToCart} data-id={deal.id} aria-label="Ajouter au panier">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
                                        <path d="M1 1h4l2.68 13.39a2 2 0 002 1.61h9.72a2 2 0 001.97-1.67L21 6H6"/>
                                    </svg>
                                </button>
                            </div>
                        </div>

                    </div>
                </template>
            </div>

        </div>
    </section>
</template>

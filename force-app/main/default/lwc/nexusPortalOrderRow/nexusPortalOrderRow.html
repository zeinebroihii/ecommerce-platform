<template>
    <div class="npor-card">

        <!-- Left: icon + info -->
        <div class="npor-left">
            <div class="npor-icon-box">
                <lightning-icon icon-name="utility:package" size="small"></lightning-icon>
            </div>
            <div class="npor-info">
                <h4 class="npor-id">{orderNumber}</h4>
                <p class="npor-date">{orderDate}</p>
            </div>
        </div>

        <!-- Right: total + status + action -->
        <div class="npor-right">
            <div class="npor-total">{formattedTotal}</div>
            <span class={statusBadgeClass}>{status}</span>
            <button class="npor-btn" onclick={handleDetails}>
                Détails
                <lightning-icon icon-name="utility:chevronright" size="xx-small" class="npor-btn-icon"></lightning-icon>
            </button>
        </div>

    </div>
</template>

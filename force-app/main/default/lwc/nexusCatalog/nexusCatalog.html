<template>
    <div class="nc2-wrap">

        <!-- ── Layout ── -->
        <div class="nc2-layout">

            <!-- ══════════════════════════════════
                 SIDEBAR
            ══════════════════════════════════ -->
            <aside class="nc2-sidebar">
                <div class="nc2-sidebar-inner">

                    <!-- Sidebar header -->
                    <div class="nc2-sidebar-header">
                        <div class="nc2-sidebar-title-wrap">
                            <div class="nc2-sidebar-title-icon">
                                <lightning-icon icon-name="utility:layers" size="x-small" class="nc2-title-icon"></lightning-icon>
                            </div>
                            <span class="nc2-sidebar-title">Filters</span>
                        </div>
                        <template if:true={hasActiveFilters}>
                            <button class="nc2-reset-icon-btn" onclick={handleResetFilters} title="Reset All">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
                                    <path d="M3 3v5h5"/>
                                </svg>
                            </button>
                        </template>
                    </div>

                    <!-- All Products -->
                    <nav class="nc2-cat-nav">
                        <button class={allBtnClass} onclick={handleSelectAll}>
                            <div class="nc2-cat-icon">
                                <lightning-icon icon-name="utility:layout" size="x-small"></lightning-icon>
                            </div>
                            <span class="nc2-cat-label">All Products</span>
                        </button>

                        <!-- Categories -->
                        <template for:each={categoriesEnriched} for:item="cat">
                            <div key={cat.id} class="nc2-cat-group">
                                <button class={cat.btnClass}
                                        data-id={cat.id}
                                        onclick={handleToggleCategory}>
                                    <div class={cat.iconWrapClass}>
                                        <lightning-icon icon-name={cat.iconName} size="x-small"></lightning-icon>
                                    </div>
                                    <span class="nc2-cat-label">{cat.name}</span>
                                    <svg class="nc2-chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <polyline points="6 9 12 15 18 9"/>
                                    </svg>
                                </button>

                                <!-- Subcategories -->
                                <template if:true={cat.isExpanded}>
                                    <div class="nc2-sub-list">
                                        <template for:each={cat.subcategories} for:item="sub">
                                            <button key={sub.id}
                                                    class={sub.btnClass}
                                                    data-category={cat.id}
                                                    data-sub={sub.id}
                                                    onclick={handleSelectSubcategory}>
                                                <div class={sub.dotClass}></div>
                                                {sub.name}
                                            </button>
                                        </template>
                                    </div>
                                </template>
                            </div>
                        </template>
                    </nav>

                    <!-- Availability Filter -->
                    <div class="nc2-filter-section">
                        <div class="nc2-filter-section-header">
                            <span class="nc2-filter-section-title">Disponibilité</span>
                            <template if:true={hasStatusFilters}>
                                <button class="nc2-clear-link" onclick={handleClearStatus}>Clear</button>
                            </template>
                        </div>
                        <div class="nc2-filter-list">
                            <template for:each={availabilityItems} for:item="item">
                                <div key={item.status} class="nc2-filter-row">
                                    <button class={item.checkClass}
                                            data-status={item.status}
                                            onclick={handleToggleStatus}>
                                        <template if:true={item.isChecked}>
                                            <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                                                <polyline points="20 6 9 17 4 12"/>
                                            </svg>
                                        </template>
                                    </button>
                                    <span class={item.labelClass}>{item.status}</span>
                                    <span class="nc2-filter-count">{item.count}</span>
                                </div>
                            </template>
                        </div>
                    </div>

                    <!-- Brand Filter -->
                    <div class="nc2-filter-section">
                        <div class="nc2-filter-section-header">
                            <span class="nc2-filter-section-title">Marque</span>
                            <template if:true={hasBrandFilters}>
                                <button class="nc2-clear-link" onclick={handleClearBrand}>Clear</button>
                            </template>
                        </div>
                        <div class="nc2-filter-list">
                            <template for:each={brandItems} for:item="item">
                                <div key={item.brand} class="nc2-filter-row">
                                    <button class={item.checkClass}
                                            data-brand={item.brand}
                                            onclick={handleToggleBrand}>
                                        <template if:true={item.isChecked}>
                                            <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                                                <polyline points="20 6 9 17 4 12"/>
                                            </svg>
                                        </template>
                                    </button>
                                    <span class={item.labelClass}>{item.brand}</span>
                                    <span class="nc2-filter-count">{item.count}</span>
                                </div>
                            </template>
                        </div>
                    </div>

                    <!-- Price Range -->
                    <div class="nc2-filter-section">
                        <span class="nc2-filter-section-title">Price Range</span>
                        <div class="nc2-price-wrap">
                            <input type="range" min="0" max="20000" step="500"
                                   value={priceMax}
                                   oninput={handlePriceChange}
                                   class="nc2-range"/>
                            <div class="nc2-price-labels">
                                <span>$0</span>
                                <span>${priceMax}</span>
                            </div>
                        </div>
                    </div>

                    <!-- Reset -->
                    <button class="nc2-reset-btn" onclick={handleResetFilters}>Reset Filters</button>

                    <!-- Custom Build CTA -->
                    <div class="nc2-cta-card">
                        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#34d399" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="nc2-cta-icon">
                            <path d="M12 2l1.5 4.5L18 8l-4.5 1.5L12 14l-1.5-4.5L6 8l4.5-1.5z"/>
                            <path d="M2 20l1 3 3-1"/>
                        </svg>
                        <h4 class="nc2-cta-title">Need a Custom Build?</h4>
                        <p class="nc2-cta-desc">Our engineers can design a bespoke solution for your specific requirements.</p>
                        <button class="nc2-cta-btn">Consult an Expert</button>
                        <div class="nc2-cta-glow"></div>
                    </div>

                </div>
            </aside>

            <!-- ══════════════════════════════════
                 MAIN PANEL
            ══════════════════════════════════ -->
            <div class="nc2-main">

                <!-- Breadcrumb + count -->
                <div class="nc2-topbar">
                    <div class="nc2-breadcrumb">
                        <span class={breadcrumbAllClass}>Catalog</span>
                        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
                        <template if:false={showBreadcrumbCategory}>
                            <span class="nc2-bc-item nc2-bc-item--active">All Products</span>
                        </template>
                        <!-- Reveal Combo Builder button (shown when a slot is being filled) -->
                        <template if:true={hasActiveComboSlot}>
                            <button class="nc2-reveal-combo-btn" onclick={handleRevealComboBuilder}>
                                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                    <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
                                </svg>
                                Reveal Combo Builder
                            </button>
                        </template>
                        <template if:true={showBreadcrumbCategory}>
                            <span class="nc2-bc-item">All Products</span>
                            <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
                            <template if:false={showBreadcrumbSubcategory}>
                                <span class="nc2-bc-item nc2-bc-item--active">{breadcrumbCategory.name}</span>
                            </template>
                            <template if:true={showBreadcrumbSubcategory}>
                                <span class="nc2-bc-item">{breadcrumbCategory.name}</span>
                                <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
                                <span class="nc2-bc-item nc2-bc-item--active">{breadcrumbSubcategory.name}</span>
                            </template>
                        </template>
                    </div>
                    <span class="nc2-result-count">Showing <strong>{filteredCount}</strong> Results</span>
                </div>

                <!-- Active filter pills -->
                <template if:true={hasActiveFilters}>
                    <div class="nc2-active-filters">
                        <span class="nc2-active-label">Active Filters:</span>
                        <template for:each={activeFilterPills} for:item="pill">
                            <div key={pill.id} class="nc2-pill">
                                <span>{pill.label}</span>
                                <button class="nc2-pill-remove"
                                        data-type={pill.filterType}
                                        data-value={pill.value}
                                        onclick={handleRemoveFilter}>
                                    <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                                </button>
                            </div>
                        </template>
                        <button class="nc2-clear-all" onclick={handleClearAllFilters}>Clear All</button>
                    </div>
                </template>

                <!-- Toolbar: search + sort + view mode -->
                <div class="nc2-toolbar">
                    <div class="nc2-toolbar-search">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="nc2-search-icon">
                            <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
                        </svg>
                        <input type="text"
                               class="nc2-search-input"
                               placeholder="Search products..."
                               value={searchQuery}
                               oninput={handleSearch}/>
                    </div>
                    <div class="nc2-toolbar-right">
                        <select class="nc2-sort-select" onchange={handleSortChange}>
                            <option value="rating">Top Rated</option>
                            <option value="price-asc">Price: Low to High</option>
                            <option value="price-desc">Price: High to Low</option>
                        </select>
                        <div class="nc2-view-toggle">
                            <button class={gridBtnClass} onclick={handleViewGrid} title="Grid view">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                                    <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
                                    <rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/>
                                </svg>
                            </button>
                            <button class={listBtnClass} onclick={handleViewList} title="List view">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/>
                                    <line x1="8" y1="18" x2="21" y2="18"/>
                                    <line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/>
                                    <line x1="3" y1="18" x2="3.01" y2="18"/>
                                </svg>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Product grid -->
                <template if:true={hasProducts}>
                    <div class={gridClass}>
                        <template for:each={filteredProducts} for:item="p">
                            <div key={p.id} class={p.cardClass}>

                                <!-- Index badge -->
                                <div class="nc2-card-index">{p.indexNum}</div>

                                <!-- Image -->
                                <div class="nc2-card-img-wrap" data-id={p.id} onclick={handleViewProduct}>
                                    <img src={p.image} alt={p.name} class="nc2-card-img" referrerpolicy="no-referrer"/>

                                    <!-- Overlay actions -->
                                    <div class="nc2-card-overlay">
                                        <!-- Default actions (fav + cart) -->
                                        <div class="nc2-card-actions">
                                            <button class={p.favBtnClass}
                                                    data-id={p.id}
                                                    onclick={handleToggleFavorite}
                                                    title="Favorite">
                                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                                    <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
                                                </svg>
                                            </button>
                                            <button class="nc2-card-add"
                                                    data-id={p.id}
                                                    onclick={handleAddToCart}
                                                    title="Add to cart">
                                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                                                    <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
                                                </svg>
                                            </button>
                                        </div>

                                        <!-- Add to Nexus Build — prominent pill at bottom of image, combo mode only -->
                                        <template if:true={hasActiveComboSlot}>
                                            <button class="nc2-card-combo-pill"
                                                    data-id={p.id}
                                                    onclick={handleAddToCombo}
                                                    title="Add to Nexus Build">
                                                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                                    <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
                                                </svg>
                                                Add to Nexus Build
                                            </button>
                                        </template>
                                    </div>

                                    <!-- NEW badge -->
                                    <template if:true={p.isNew}>
                                        <span class="nc2-card-badge-new">Save 5%</span>
                                    </template>
                                </div>

                                <!-- Body -->
                                <div class="nc2-card-body">
                                    <!-- Stars -->
                                    <div class="nc2-stars">
                                        <template for:each={p.stars} for:item="s">
                                            <svg key={s.n} class={s.cls} width="11" height="11" viewBox="0 0 24 24">
                                                <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
                                            </svg>
                                        </template>
                                        <span class="nc2-reviews">({p.reviews})</span>
                                    </div>

                                    <!-- Title -->
                                    <h3 class="nc2-card-name"
                                        data-id={p.id}
                                        onclick={handleViewProduct}>
                                        {p.name}
                                    </h3>

                                    <!-- Free shipping -->
                                    <span class="nc2-free-ship">Free Shipping</span>

                                    <!-- Price -->
                                    <div class="nc2-price-row">
                                        <span class="nc2-price">{p.priceFormatted}</span>
                                    </div>
                                    <span class="nc2-price-origin">from United States</span>

                                    <!-- Description -->
                                    <p class="nc2-card-desc">"{p.description}"</p>
                                </div>

                                <!-- Add to Nexus Build bottom bar (shown when a combo slot is active) -->
                                <template if:true={hasActiveComboSlot}>
                                    <button class="nc2-add-nexus-bar"
                                            data-id={p.id}
                                            onclick={handleAddToCombo}>
                                        <span>Add to Nexus Build</span>
                                        <div class="nc2-add-nexus-bar-icon">
                                            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                                        </div>
                                    </button>
                                </template>

                            </div>
                        </template>
                    </div>
                </template>

                <!-- Empty state -->
                <template if:false={hasProducts}>
                    <div class="nc2-empty">
                        <div class="nc2-empty-icon">
                            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                                <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
                            </svg>
                        </div>
                        <h3 class="nc2-empty-title">No Products Found</h3>
                        <p class="nc2-empty-desc">Try adjusting your filters or search query.</p>
                        <button class="nc2-empty-btn" onclick={handleResetFilters}>Clear All Filters</button>
                    </div>
                </template>

            </div>
        </div>

        <!-- ── Product Detail View ── -->
        <template if:true={isDetailViewOpen}>
            <c-nexus-product-detail-view
                product={detailProduct}
                favorites={favoritedIds}
                all-products={allProductsList}
                onclose={handleDetailClose}
                onaddtocart={handleDetailAddToCart}
                ontogglefavorite={handleDetailToggleFavorite}
                onviewproduct={handleSimilarProductView}>
            </c-nexus-product-detail-view>
        </template>

        <!-- ── Toast ── -->
        <template if:true={showToast}>
            <div class="nc2-toast">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <polyline points="20 6 9 17 4 12"/>
                </svg>
                Added to cart
            </div>
        </template>

    </div>
</template>

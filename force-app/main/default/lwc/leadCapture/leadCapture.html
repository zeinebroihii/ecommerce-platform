<template>
    <div class="talexo-form-wrap">

        <!-- ── Success State ──────────────────────────────────────────────── -->
        <template if:true={isSubmitted}>
            <div class="success-card">
                <div class="success-ring">&#x2713;</div>
                <h2>Merci, {firstName}&nbsp;!</h2>
                <p>
                    Vos informations ont &#xe9;t&#xe9; re&#xe7;ues et sont en cours de traitement.<br/>
                    Notre &#xe9;quipe vous contactera sous <strong>24 heures</strong>.
                </p>
                <lightning-button label="Explorer nos produits" variant="brand" onclick={handleReset}></lightning-button>
            </div>
        </template>

        <!-- ── Form ───────────────────────────────────────────────────────── -->
        <template if:false={isSubmitted}>
            <div class="form-layout">

                <!-- Left: branding -->
                <div class="form-copy">
                    <div class="talexo-wordmark">TALCORE</div>
                    <h2 class="copy-heading">
                        Rejoignez notre r&#xe9;seau<br/>
                        <span class="copy-accent">IT &amp; Entreprise</span>
                    </h2>
                    <p class="copy-desc">
                        Remplissez le formulaire et notre &#xe9;quipe vous pr&#xe9;parera une
                        offre personnalis&#xe9;e — tarifs volume, gestionnaire d&#xe9;di&#xe9;
                        et support prioritaire inclus.
                    </p>
                    <ul class="copy-perks">
                        <li>&#x2713;&nbsp; Tarifs volume d&#xe8;s 5 unit&#xe9;s</li>
                        <li>&#x2713;&nbsp; Gestionnaire de compte d&#xe9;di&#xe9;</li>
                        <li>&#x2713;&nbsp; Support technique 24/7</li>
                        <li>&#x2713;&nbsp; Configuration sur mesure</li>
                        <li>&#x2713;&nbsp; Garantie &amp; maintenance incluses</li>
                    </ul>
                    <div class="copy-badges">
                        <span class="badge">&#x1F512; SSL s&#xe9;curis&#xe9;</span>
                        <span class="badge">&#x1F1EC;&#x1F1E7; Livraison UK</span>
                        <span class="badge">&#x2B50; Certifi&#xe9; ISO</span>
                    </div>
                </div>

                <!-- Right: form card -->
                <div class="form-card">
                    <div class="form-card-header">
                        <h3>Cr&#xe9;er mon compte</h3>
                        <p>Les champs marqu&#xe9;s * sont obligatoires</p>
                    </div>

                    <template if:true={errorMsg}>
                        <div class="form-error-banner">{errorMsg}</div>
                    </template>

                    <!-- Section 1: Personal -->
                    <div class="form-section">
                        <div class="section-label"><span class="section-num">01</span> Informations personnelles</div>

                        <lightning-combobox label="Civilit&#xe9;" name="salutation" value={salutation} options={salutationOptions} onchange={handleField}></lightning-combobox>

                        <div class="two-col">
                            <lightning-input label="Pr&#xe9;nom *"   name="firstName" value={firstName} onchange={handleField} required></lightning-input>
                            <lightning-input label="Nom *"           name="lastName"  value={lastName}  onchange={handleField} required></lightning-input>
                        </div>

                        <lightning-input label="Email professionnel *" name="email" type="email" value={email} onchange={handleField} required></lightning-input>

                        <div class="two-col">
                            <lightning-input label="T&#xe9;l&#xe9;phone"              name="phone" type="tel" value={phone} onchange={handleField}></lightning-input>
                            <lightning-input label="Fonction / Responsabilit&#xe9;" name="title" value={title} placeholder="ex. Directeur IT, DSI..." onchange={handleField}></lightning-input>
                        </div>
                    </div>

                    <!-- Section 2: Company -->
                    <div class="form-section">
                        <div class="section-label"><span class="section-num">02</span> Informations entreprise</div>

                        <lightning-input label="Nom de l'entreprise *" name="company" value={company} onchange={handleField} required></lightning-input>

                        <div class="two-col">
                            <lightning-combobox label="Secteur d'activit&#xe9;" name="industry" value={industry} options={industryOptions} onchange={handleField}></lightning-combobox>
                            <lightning-combobox label="Nombre d'employ&#xe9;s"   name="employees" value={employees} options={employeeOptions} onchange={handleField}></lightning-combobox>
                        </div>

                        <div class="two-col">
                            <lightning-input label="Chiffre d'affaires annuel (&#xa3;)" name="annualRevenue" type="number" value={annualRevenue} placeholder="ex. 500000" onchange={handleField}></lightning-input>
                            <lightning-input label="Pays *" name="country" value={country} onchange={handleField} required></lightning-input>
                        </div>

                        <div class="three-col">
                            <lightning-input label="Ville *"              name="city"  value={city}  onchange={handleField} required></lightning-input>
                            <lightning-input label="R&#xe9;gion / Province" name="state" value={state} onchange={handleField}></lightning-input>
                            <lightning-input label="Code postal"           name="zip"   value={zip}   onchange={handleField}></lightning-input>
                        </div>

                        <lightning-textarea label="Que recherchez-vous ?" name="description" value={description} max-length="500" onchange={handleField} placeholder="ex. 20 laptops pour d&#xe9;veloppeurs, serveurs, configuration r&#xe9;seau..."></lightning-textarea>
                    </div>

                    <!-- Submit -->
                    <div class="form-submit-row">
                        <lightning-button label="Soumettre ma demande" variant="brand" disabled={isLoading} onclick={handleSubmit}></lightning-button>
                        <template if:true={isLoading}>
                            <lightning-spinner size="small" alternative-text="Envoi..."></lightning-spinner>
                        </template>
                    </div>

                    <p class="form-legal">
                        En soumettant ce formulaire, vous acceptez notre politique de confidentialit&#xe9;.
                        Vos donn&#xe9;es ne seront jamais partag&#xe9;es avec des tiers.
                    </p>
                </div>
            </div>
        </template>
    </div>
</template>

<template>
    <div class="nld-wrap">

        <!-- ── Header ── -->
        <div class="nld-header">
            <div class="nld-header-icon">
                <lightning-icon icon-name="utility:einstein" size="small" variant="inverse"></lightning-icon>
            </div>
            <div class="nld-header-text">
                <h3 class="nld-title">Nexus AI — Décision Admin</h3>
                <p class="nld-subtitle">Analyse intelligente du lead B2B</p>
            </div>
            <button class="nld-btn-refresh" onclick={handleRefresh} disabled={isRefreshing} title="Rafraîchir l'analyse">
                <lightning-icon icon-name="utility:refresh" size="x-small" variant="inverse"></lightning-icon>
            </button>
        </div>

        <!-- ── Loading ── -->
        <template if:true={isLoading}>
            <div class="nld-loading">Chargement de l'analyse IA...</div>
        </template>

        <!-- ── Main content ── -->
        <template if:false={isLoading}>

            <!-- Score ring -->
            <div class="nld-score-section">
                <div class={scoreRingClass}>
                    <span class="nld-score-num">{score}</span>
                    <span class="nld-score-divider">/100</span>
                </div>
                <div class="nld-score-right">
                    <div class={scoreLabelClass}>{scoreLabel}</div>
                    <template if:true={hasIntent}>
                        <div class="nld-intent-badge">{intent}</div>
                    </template>
                </div>
            </div>

            <!-- AI Reason -->
            <template if:true={hasReason}>
                <div class="nld-reason-box">
                    <div class="nld-reason-label">
                        <lightning-icon icon-name="utility:sparkles" size="x-small" class="nld-sparkle"></lightning-icon>
                        &nbsp;Analyse IA
                    </div>
                    <p class="nld-reason-text">{reason}</p>
                </div>
            </template>

            <!-- Current decision status -->
            <div class="nld-status-row">
                <span class="nld-status-label">Statut :</span>
                <span class={decisionBadgeClass}>{decisionLabel}</span>
            </div>

            <!-- Agent deep-analysis button (always visible) -->
            <a class="nld-btn-agent"
               href="https://orgfarm-56b3b63a30-dev-ed.develop.lightning.force.com/AiCopilot/copilotStudio.app#/copilot/builder?copilotId=0Xxg5000000b81pCAA&versionId=0X9g5000000s8mzCAA"
               target="_blank"
               rel="noopener noreferrer"
               onclick={handleCopyPrompt}>
                <lightning-icon icon-name="utility:einstein" size="x-small" variant="inverse"></lightning-icon>
                &nbsp;Analyse approfondie — Nexus Lead Analyst
            </a>

            <!-- Decision status message -->
            <template if:false={isPending}>
                <div class="nld-decided-msg">
                    <lightning-icon icon-name="utility:check" size="x-small" class="nld-decided-icon"></lightning-icon>
                    &nbsp;Décision enregistrée — statut : <strong>{leadStatus}</strong>
                </div>
            </template>

        </template>
    </div>
</template>

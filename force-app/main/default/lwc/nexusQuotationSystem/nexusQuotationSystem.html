<template>
  <!-- ── Floating new-message notification ── -->
  <template if:true={_floatingNotif}>
    <div class="nqs-notif-bubble">
      <div class="nqs-notif-avatar">S</div>
      <div class="nqs-notif-body">
        <div class="nqs-notif-title">New message from your advisor</div>
        <div class="nqs-notif-sub">{_floatingNotif.quoteName}</div>
      </div>
      <button
        class="nqs-notif-view-btn"
        data-id={_floatingNotif.quoteId}
        onclick={handleNotifView}
      >
        View
      </button>
      <button class="nqs-notif-dismiss-btn" onclick={handleNotifDismiss}>
        ✕
      </button>
    </div>
  </template>

  <!-- ── Testimonial popup (fires after quote acceptance) ── -->
  <template if:true={_showTestimonialForm}>
    <c-nexus-testimonial-form
      quote-id={_testimonialQuoteId}
      quote-name={_testimonialQuoteName}
      onclose={handleTestimonialClose}
      onsubmitted={handleTestimonialClose}
    ></c-nexus-testimonial-form>
  </template>

  <!-- ═══════════════════════ MAIN LIST VIEW ═══════════════════════════════ -->
  <div class="nqs-wrap">
    <!-- Toolbar -->
    <div class="nqs-toolbar">
      <div class="nqs-toolbar-left">
        <div class="nqs-filter-bar">
          <template for:each={filterOptions} for:item="f">
            <button
              key={f.id}
              class={f.cls}
              data-id={f.id}
              onclick={handleFilterChange}
            >
              {f.label}
            </button>
          </template>
        </div>
        <template if:true={hasQuotes}>
          <span class="nqs-quote-count">{filteredQuotes.length} quotes</span>
        </template>
      </div>
    </div>

    <!-- Loading state -->
    <template if:true={isLoading}>
      <div class="nqs-loading-wrap">
        <lightning-spinner
          alternative-text="Loading..."
          size="medium"
        ></lightning-spinner>
      </div>
    </template>

    <!-- Empty state -->
    <template if:true={isEmpty}>
      <div class="nqs-empty">
        <div class="nqs-empty-icon-wrap">
          <lightning-icon
            icon-name="utility:contract"
            size="medium"
          ></lightning-icon>
        </div>
        <div class="nqs-empty-text">
          <h3 class="nqs-empty-title">No quotes yet</h3>
          <p class="nqs-empty-sub">
            Submitted quote requests will appear here. Contact your account
            manager or submit a new request to get started.
          </p>
        </div>
      </div>
    </template>

    <!-- Quote table -->
    <template if:true={hasQuotes}>
      <div class="nqs-table-wrap">
        <table class="nqs-table">
          <thead>
            <tr class="nqs-thead-row">
              <th class="nqs-th-col">Reference</th>
              <th class="nqs-th-col">Expiry Date</th>
              <th class="nqs-th-col nqs-th-right">Amount</th>
              <th class="nqs-th-col nqs-th-center">Status</th>
              <th class="nqs-th-col nqs-th-right">Actions</th>
            </tr>
          </thead>
          <tbody>
            <template for:each={filteredQuotes} for:item="q">
              <tr key={q.quoteId} class="nqs-tbody-row">
                <!-- Reference -->
                <td class="nqs-td-col">
                  <div class="nqs-ref-cell">
                    <div class="nqs-ref-icon-box">
                      <lightning-icon
                        icon-name="utility:file"
                        size="x-small"
                      ></lightning-icon>
                    </div>
                    <div>
                      <div class="nqs-ref-name">
                        {q.name}
                        <template if:true={q.hasUnreadMsg}>
                          <span class="nqs-unread-dot"></span>
                        </template>
                      </div>
                    </div>
                  </div>
                </td>
                <!-- Expiry -->
                <td class="nqs-td-col nqs-td-muted">{q.displayDate}</td>
                <!-- Amount -->
                <td class="nqs-td-col nqs-td-amount">{q.displayTotal}</td>
                <!-- Status -->
                <td class="nqs-td-col nqs-td-center">
                  <span class={q.badgeCls}>{q.status}</span>
                </td>
                <!-- Actions -->
                <td class="nqs-td-col nqs-td-actions">
                  <button
                    class="nqs-row-view-btn"
                    data-id={q.quoteId}
                    onclick={handleOpenDetail}
                  >
                    View Details
                  </button>
                  <button
                    class="nqs-row-pdf-btn"
                    data-id={q.quoteId}
                    onclick={handleDownloadPDFCard}
                  >
                    <lightning-icon
                      icon-name="utility:download"
                      size="x-small"
                    ></lightning-icon>
                    PDF
                  </button>
                </td>
              </tr>
            </template>
          </tbody>
        </table>
      </div>
    </template>
  </div>

  <!-- ═══════════════════════ DETAIL MODAL ═════════════════════════════════ -->
  <template if:true={showDetailModal}>
    <div class="nqs-overlay" onclick={handleCloseDetail}>
      <div class="nqs-modal" onclick={handleStopProp}>
        <!-- Modal Header -->
        <div class="nqs-modal-header">
          <div class="nqs-modal-header-left">
            <div class="nqs-modal-icon-box">
              <lightning-icon
                icon-name="utility:file"
                size="small"
                variant="inverse"
              ></lightning-icon>
            </div>
            <div>
              <div class="nqs-modal-id-row">
                <h3 class="nqs-modal-id">{selectedQuote.name}</h3>
                <span class={selectedQuote.badgeCls}
                  >{selectedQuote.status}</span
                >
                <span class="nqs-version-chip"
                  >{selectedQuote.versionLabel}</span
                >
              </div>
              <p class="nqs-modal-meta">
                {selectedQuote.opportunityName} &nbsp;·&nbsp; Expires:
                {selectedQuote.displayDate}
              </p>
            </div>
          </div>
          <div class="nqs-modal-header-right">
            <button class="nqs-pdf-btn" onclick={handleDownloadPDF}>
              <lightning-icon
                icon-name="utility:download"
                size="x-small"
              ></lightning-icon>
              PDF
            </button>

            <!-- Accepted + contract generated → DocuSign emails sent -->
            <template if:true={showSignFinalContract}>
              <span class="nqs-dvelop-signing-chip">
                <lightning-icon
                  icon-name="utility:email"
                  size="x-small"
                  variant="inverse"
                ></lightning-icon>
                &nbsp;DocuSign signing in progress — check your email
              </span>
            </template>

            <!-- Accepted but contract not yet sent → show waiting banner -->
            <template if:true={showContractPendingBanner}>
              <span class="nqs-contract-pending-chip">
                <lightning-icon
                  icon-name="utility:clock"
                  size="x-small"
                ></lightning-icon>
                &nbsp;Contract being prepared…
              </span>
            </template>

            <!-- Expiry warning badge -->
            <template if:true={selectedQuote.expiryWarning}>
              <span class="nqs-expiry-badge">
                ⏰ {selectedQuote.expiryLabel}
              </span>
            </template>
            <template if:true={selectedQuote.isExpired}>
              <span class="nqs-expired-badge">Expired</span>
            </template>

            <!-- Presented → customer can accept, counter, or reject -->
            <template if:true={selectedQuote.canDecide}>
              <button
                class="nqs-accept-btn"
                onclick={handleAcceptQuote}
                disabled={decideDisabled}
              >
                ✓ Accept
              </button>
              <button
                class="nqs-counter-btn"
                onclick={handleShowCounterForm}
                disabled={decideDisabled}
              >
                ↔ Counter Offer
              </button>
              <button
                class="nqs-reject-btn"
                onclick={handleShowRejectForm}
                disabled={decideDisabled}
              >
                ✕ Reject
              </button>
            </template>
            <button class="nqs-close-x-btn" onclick={handleCloseDetail}>
              ✕
            </button>
          </div>
        </div>

        <!-- Modal Body -->
        <div class="nqs-modal-body">
          <!-- Sidebar tabs -->
          <div class="nqs-modal-sidebar">
            <button class={tabDetailsCls} onclick={handleTabDetails}>
              <lightning-icon
                icon-name="utility:file"
                size="x-small"
                variant={tabDetailsVariant}
              ></lightning-icon>
              <span class="nqs-mtab-label">Details</span>
            </button>
            <button class={tabMessagesCls} onclick={handleTabMessages}>
              <lightning-icon
                icon-name="utility:chat"
                size="x-small"
                variant={tabMessagesVariant}
              ></lightning-icon>
              <span class="nqs-mtab-label">Messages</span>
              <template if:true={hasUnreadMessages}>
                <span class="nqs-tab-badge">{unreadBadgeLabel}</span>
              </template>
            </button>
            <button class={tabHistoryCls} onclick={handleTabHistory}>
              <lightning-icon
                icon-name="utility:clock"
                size="x-small"
                variant={tabHistoryVariant}
              ></lightning-icon>
              <span class="nqs-mtab-label">History</span>
            </button>
          </div>

          <!-- Content pane -->
          <div class="nqs-modal-content">
            <!-- ══════ DETAILS TAB ══════ -->
            <template if:true={isDetailsTab}>
              <div class="nqs-details-grid">
                <!-- Left column -->
                <div class="nqs-details-left">
                  <!-- Product table (mock/rich data) -->
                  <template if:true={selectedQuoteHasProducts}>
                    <div class="nqs-detail-card nqs-p0">
                      <div class="nqs-detail-card-title">
                        Products &amp; Services
                      </div>
                      <div class="nqs-prod-table-wrap">
                        <table class="nqs-prod-table">
                          <thead>
                            <tr>
                              <th class="nqs-th">Description</th>
                              <th class="nqs-th nqs-th-center">Qty</th>
                              <th class="nqs-th nqs-th-center">Type</th>
                              <th class="nqs-th nqs-th-right">Unit Price</th>
                              <th class="nqs-th nqs-th-right">Total</th>
                            </tr>
                          </thead>
                          <tbody>
                            <template
                              for:each={selectedQuoteProducts}
                              for:item="item"
                            >
                              <tr key={item.key} class="nqs-prod-row">
                                <td class="nqs-td">
                                  <div class="nqs-prod-cell">
                                    <div class="nqs-prod-img-wrap">
                                      <template if:true={item.hasImage}>
                                        <img
                                          src={item.productImage}
                                          alt={item.productName}
                                          class="nqs-prod-img"
                                        />
                                      </template>
                                      <template if:false={item.hasImage}>
                                        <lightning-icon
                                          icon-name="standard:product"
                                          size="small"
                                          class="nqs-prod-icon"
                                        ></lightning-icon>
                                      </template>
                                    </div>
                                    <div>
                                      <div class="nqs-prod-name">
                                        {item.productName}
                                      </div>
                                      <div class="nqs-prod-family">
                                        {item.productFamily}
                                      </div>
                                    </div>
                                  </div>
                                </td>
                                <td class="nqs-td nqs-td-center nqs-prod-qty">
                                  {item.quantity}
                                </td>
                                <td class="nqs-td nqs-td-center">
                                  <span class={item.chargeTypeBadgeCls}
                                    >{item.chargeType}</span
                                  >
                                  <template if:true={item.billingLabel}>
                                    <span class="nqs-billing-label"
                                      >{item.billingLabel}</span
                                    >
                                  </template>
                                </td>
                                <td class="nqs-td nqs-td-right nqs-prod-unit">
                                  {item.unitPrice}
                                </td>
                                <td class="nqs-td nqs-td-right nqs-prod-total">
                                  {item.totalPrice}
                                </td>
                              </tr>
                            </template>
                          </tbody>
                        </table>
                      </div>
                    </div>
                  </template>

                  <!-- Fallback: plain description (Salesforce real data) -->
                  <template if:false={selectedQuoteHasProducts}>
                    <div class="nqs-detail-card">
                      <div class="nqs-detail-card-title">Quote Details</div>
                      <div class="nqs-detail-card-body">
                        <div class="nqs-detail-row">
                          <span class="nqs-detail-label">Reference</span>
                          <span class="nqs-detail-val"
                            >{selectedQuote.name}</span
                          >
                        </div>
                        <div class="nqs-detail-row">
                          <span class="nqs-detail-label">Opportunity</span>
                          <span class="nqs-detail-val"
                            >{selectedQuote.opportunityName}</span
                          >
                        </div>
                        <div class="nqs-detail-row">
                          <span class="nqs-detail-label">Expiry</span>
                          <span class="nqs-detail-val"
                            >{selectedQuote.displayDate}</span
                          >
                        </div>
                        <template if:true={selectedQuote.description}>
                          <div class="nqs-detail-row nqs-detail-row-col">
                            <span class="nqs-detail-label">Description</span>
                            <p class="nqs-detail-desc">
                              {selectedQuote.description}
                            </p>
                          </div>
                        </template>
                      </div>
                    </div>
                  </template>

                  <!-- Commercial terms (always shown) -->
                  <div class="nqs-detail-card">
                    <div class="nqs-detail-card-title">Commercial Terms</div>
                    <div class="nqs-detail-card-body nqs-terms-grid">
                      <div>
                        <div class="nqs-detail-label">Payment Terms</div>
                        <div class="nqs-terms-val">
                          {selectedQuote.paymentTerms}
                        </div>
                      </div>
                      <div>
                        <div class="nqs-detail-label">Offer Validity</div>
                        <div class="nqs-terms-val">
                          {selectedQuote.displayDate}
                        </div>
                      </div>
                      <template if:true={signatureDeadlineLabel}>
                        <div>
                          <div class="nqs-detail-label">Signature Deadline</div>
                          <div class="nqs-terms-val">
                            {signatureDeadlineLabel}
                          </div>
                        </div>
                      </template>
                      <template if:true={selectedQuote.description}>
                        <div class="nqs-terms-full">
                          <div class="nqs-detail-label">Special Notes</div>
                          <div class="nqs-terms-note">
                            {selectedQuote.description}
                          </div>
                        </div>
                      </template>
                      <template if:true={hasGeneralTerms}>
                        <div class="nqs-terms-full nqs-terms-gtc-wrap">
                          <div class="nqs-detail-label">
                            General Terms &amp; Conditions
                          </div>
                          <div class="nqs-terms-gtc">{generalTerms}</div>
                        </div>
                      </template>
                    </div>
                  </div>
                </div>

                <!-- Right column -->
                <div class="nqs-details-right">
                  <!-- Financial summary -->
                  <div class="nqs-summary-card">
                    <div class="nqs-detail-card-title">Financial Summary</div>
                    <div class="nqs-detail-card-body">
                      <!-- One-time / Recurring split -->
                      <template if:true={selectedQuote.hasOneTime}>
                        <div class="nqs-detail-row">
                          <span class="nqs-detail-label">
                            <span class="nqs-charge-badge nqs-charge-onetime"
                              >One-time</span
                            >
                          </span>
                          <span class="nqs-detail-val"
                            >{selectedQuote.formattedOneTime}</span
                          >
                        </div>
                      </template>
                      <template if:true={selectedQuote.hasRecurring}>
                        <div class="nqs-detail-row">
                          <span class="nqs-detail-label">
                            <span class="nqs-charge-badge nqs-charge-recurring"
                              >Recurring</span
                            >
                          </span>
                          <span class="nqs-detail-val"
                            >{selectedQuote.formattedRecurring}</span
                          >
                        </div>
                        <template if:true={selectedQuote.hasMrr}>
                          <div class="nqs-detail-row">
                            <span class="nqs-detail-label nqs-muted"
                              >Monthly (MRR)</span
                            >
                            <span class="nqs-mrr-val"
                              >{selectedQuote.formattedMrr}/mo</span
                            >
                          </div>
                        </template>
                      </template>
                      <template if:true={selectedQuote.hasOneTime}>
                        <template if:true={selectedQuote.hasRecurring}>
                          <div class="nqs-summary-divider"></div>
                        </template>
                      </template>

                      <div class="nqs-detail-row">
                        <span class="nqs-detail-label">Subtotal</span>
                        <span class="nqs-detail-val"
                          >{selectedQuote.displayTotal}</span
                        >
                      </div>
                      <template if:true={selectedQuote.volumeDiscountApplied}>
                        <div class="nqs-detail-row">
                          <span class="nqs-detail-label"
                            >Volume Discount
                            ({selectedQuote.bulkDiscount}%)</span
                          >
                          <span class="nqs-discount-val"
                            >−{selectedQuote.discountAmount}</span
                          >
                        </div>
                      </template>
                      <div class="nqs-summary-total-row">
                        <div>
                          <div class="nqs-detail-label">Net Total</div>
                          <div class="nqs-summary-big-total">
                            {selectedQuote.discountedTotal}
                          </div>
                        </div>
                        <template if:true={selectedQuote.volumeDiscountApplied}>
                          <span class="nqs-badge nqs-badge-success"
                            >Volume Discount Applied</span
                          >
                        </template>
                      </div>
                    </div>
                  </div>

                  <!-- Negotiation status card -->
                  <div class="nqs-detail-card">
                    <div class="nqs-detail-card-title">Negotiation Status</div>
                    <div class="nqs-detail-card-body">
                      <div class="nqs-detail-row">
                        <span class="nqs-detail-label">Stage</span>
                        <span class="nqs-detail-val"
                          >{selectedQuote.negotiationStatus}</span
                        >
                      </div>
                      <div class="nqs-detail-row">
                        <span class="nqs-detail-label">Internal Approval</span>
                        <span class="nqs-detail-val">
                          <template if:true={selectedQuote.needsApproval}>
                            <span class="nqs-approval-pending"
                              >⏳ Pending Approval</span
                            >
                          </template>
                          <template if:true={selectedQuote.isApproved}>
                            <span class="nqs-approval-ok">✓ Approved</span>
                          </template>
                          <template if:false={selectedQuote.needsApproval}>
                            <template if:false={selectedQuote.isApproved}>
                              <span>{selectedQuote.approvalStatus}</span>
                            </template>
                          </template>
                        </span>
                      </div>
                      <template if:true={selectedQuote.customerCounterPrice}>
                        <div class="nqs-detail-row">
                          <span class="nqs-detail-label"
                            >Your Counter-Offer</span
                          >
                          <span class="nqs-counter-value"
                            >{selectedQuote.customerCounterPrice}</span
                          >
                        </div>
                        <template if:true={selectedQuote.counterMessage}>
                          <div class="nqs-detail-row nqs-detail-row-col">
                            <span class="nqs-detail-label"
                              >Counter Message</span
                            >
                            <p class="nqs-detail-desc">
                              {selectedQuote.counterMessage}
                            </p>
                          </div>
                        </template>
                      </template>
                    </div>
                  </div>

                  <!-- Auto-negotiation counter-offer form -->
                  <template if:true={showCounterForm}>
                    <div class="nqs-counter-form-card">
                      <div class="nqs-detail-card-title">
                        Submit a Counter Offer
                      </div>
                      <div class="nqs-detail-card-body">
                        <p class="nqs-counter-hint">
                          Propose your price — our system responds instantly: if
                          your offer is close to the threshold, a mid-point
                          price will be automatically proposed.
                        </p>
                        <div class="nqs-counter-input-row">
                          <label class="nqs-detail-label">Your price (€)</label>
                          <input
                            type="number"
                            class="nqs-counter-input"
                            placeholder="e.g. 45000"
                            value={_counterPrice}
                            oninput={handleCounterPriceInput}
                            min="1"
                          />
                        </div>
                        <div class="nqs-counter-input-row">
                          <label class="nqs-detail-label"
                            >Message (optional)</label
                          >
                          <textarea
                            class="nqs-counter-textarea"
                            placeholder="Explain your reasoning..."
                            oninput={handleCounterMessageInput}
                          ></textarea>
                        </div>
                        <div class="nqs-counter-form-btns">
                          <button
                            class="nqs-cancel-btn"
                            onclick={handleCancelCounter}
                          >
                            Cancel
                          </button>
                          <button
                            class="nqs-submit-counter-btn"
                            onclick={handleSubmitCounter}
                            disabled={_counterSubmitting}
                          >
                            {counterSubmitLabel}
                          </button>
                        </div>
                      </div>
                    </div>
                  </template>
                </div>
              </div>
            </template>

            <!-- ══════ MESSAGES TAB ══════ -->
            <template if:true={isMessagesTab}>
              <div class="nqs-messages-wrap">
                <div class="nqs-messages-list">
                  <template if:false={hasMessages}>
                    <div class="nqs-no-messages">
                      <lightning-icon
                        icon-name="utility:chat"
                        size="medium"
                      ></lightning-icon>
                      <p>Start the conversation with your advisor.</p>
                    </div>
                  </template>
                  <template if:true={hasMessages}>
                    <template for:each={formattedMessages} for:item="m">
                      <div key={m.id} class={m.rowCls}>
                        <div class={m.avatarCls}>{m.avatarInitial}</div>
                        <div class={m.bubbleCls}>
                          <p class="nqs-bubble-text">{m.text}</p>
                          <div class={m.timeCls}>{m.time}</div>
                        </div>
                      </div>
                    </template>
                  </template>
                </div>
                <div class="nqs-msg-input-bar">
                  <input
                    type="text"
                    class="nqs-msg-input"
                    placeholder="Ask your advisor a question..."
                    value={messageInput}
                    onchange={handleMessageInput}
                    onkeydown={handleMessageKeydown}
                  />
                  <button class="nqs-msg-send" onclick={handleSendMessage}>
                    <lightning-icon
                      icon-name="utility:send"
                      size="x-small"
                      variant="inverse"
                    ></lightning-icon>
                  </button>
                </div>
              </div>
            </template>

            <!-- ══════ HISTORY TAB ══════ -->
            <template if:true={isHistoryTab}>
              <div class="nqs-history-wrap">
                <template if:false={selectedQuoteHasVersions}>
                  <!-- No version data (Salesforce real quote without history) -->
                  <div class="nqs-history-sf">
                    <div class="nqs-history-item">
                      <div class="nqs-history-dot nqs-history-dot-active"></div>
                      <div class="nqs-history-content">
                        <div class="nqs-history-label">Current Status</div>
                        <div class="nqs-history-status">
                          {selectedQuote.status}
                        </div>
                        <div class="nqs-history-date">
                          Expires: {selectedQuote.displayDate}
                        </div>
                      </div>
                    </div>
                    <div class="nqs-history-item">
                      <div class="nqs-history-dot"></div>
                      <div class="nqs-history-content">
                        <div class="nqs-history-label">Total Amount</div>
                        <div class="nqs-history-status">
                          {selectedQuote.displayTotal}
                        </div>
                      </div>
                    </div>
                  </div>
                </template>

                <template if:true={selectedQuoteHasVersions}>
                  <!-- Version history header -->
                  <div class="nqs-vh-header">
                    <h3 class="nqs-vh-title">Version History</h3>
                    <span class="nqs-badge nqs-badge-primary"
                      >{selectedQuote.versionCount} Revisions</span
                    >
                  </div>

                  <!-- Version cards -->
                  <div class="nqs-vh-list">
                    <template for:each={selectedQuoteVersions} for:item="v">
                      <div key={v.key} class="nqs-vh-card">
                        <div class="nqs-vh-card-main">
                          <div class="nqs-vh-card-left">
                            <div class={v.iconCls}>{v.versionLabel}</div>
                            <div>
                              <div class="nqs-vh-name">
                                Revision {v.versionLabel}
                                <template if:true={v.isCurrentVersion}>
                                  <span class="nqs-vh-current-chip"
                                    >Current</span
                                  >
                                </template>
                              </div>
                              <div class="nqs-vh-date">
                                {v.date} &nbsp;·&nbsp; {v.status}
                              </div>
                            </div>
                          </div>
                          <div class="nqs-vh-card-right">
                            <div class="nqs-vh-total-block">
                              <div class="nqs-detail-label">Amount</div>
                              <div class="nqs-vh-total">{v.displayTotal}</div>
                            </div>
                            <div class="nqs-vh-actions">
                              <!-- SF version: click to view its details -->
                              <template if:true={v.isSfVersion}>
                                <button
                                  class="nqs-vh-toggle-btn"
                                  data-id={v.quoteId}
                                  onclick={handleViewVersion}
                                >
                                  👁 View
                                </button>
                              </template>
                              <!-- Mock version: expand/collapse product list -->
                              <template if:false={v.isSfVersion}>
                                <button
                                  class="nqs-vh-toggle-btn"
                                  data-version={v.version}
                                  onclick={handleToggleVersion}
                                >
                                  {v.expandBtnLabel}
                                </button>
                              </template>
                              <button
                                class="nqs-vh-pdf-btn"
                                onclick={handleDownloadPDF}
                                title="PDF"
                              >
                                <lightning-icon
                                  icon-name="utility:download"
                                  size="x-small"
                                ></lightning-icon>
                              </button>
                            </div>
                          </div>
                        </div>

                        <!-- Expandable line items (mock only) -->
                        <template if:true={v.isExpanded}>
                          <div class="nqs-vh-expand">
                            <div
                              class="nqs-detail-label"
                              style="margin-bottom: 0.5rem"
                            >
                              Lines in this revision
                            </div>
                            <template for:each={v.expandProducts} for:item="ep">
                              <div key={ep.key} class="nqs-vh-line">
                                <span class="nqs-vh-line-name"
                                  >{ep.productName}</span
                                >
                                <span class="nqs-vh-line-total"
                                  >{ep.lineTotal}</span
                                >
                              </div>
                            </template>
                          </div>
                        </template>
                      </div>
                    </template>
                  </div>
                </template>
              </div>
            </template>
          </div>
          <!-- end modal-content -->
        </div>
        <!-- end modal-body -->

        <!-- Reject form (inline panel at bottom) -->
        <template if:true={showRejectForm}>
          <div class="nqs-reject-panel">
            <div class="nqs-reject-inner">
              <h4 class="nqs-reject-title">Reason for rejection (optional)</h4>
              <textarea
                class="nqs-reject-textarea"
                placeholder="Explain the reason for rejection..."
                value={rejectReason}
                onchange={handleRejectReason}
              ></textarea>
              <div class="nqs-reject-actions">
                <button
                  class="nqs-confirm-reject-btn"
                  onclick={handleConfirmReject}
                  disabled={decideDisabled}
                >
                  Confirm Rejection
                </button>
                <button class="nqs-cancel-btn" onclick={handleCancelReject}>
                  Cancel
                </button>
              </div>
            </div>
          </div>
        </template>
      </div>
      <!-- end nqs-modal -->
    </div>
    <!-- end overlay -->
  </template>

  <!-- ═══════════════════════ NEW QUOTE FORM MODAL ══════════════════════════ -->
  <template if:true={showNewForm}>
    <div class="nqs-overlay" onclick={handleCloseNewForm}>
      <div class="nqs-form-modal" onclick={handleStopProp}>
        <!-- Form step -->
        <template if:true={isFormStep}>
          <div class="nqs-form-header">
            <div class="nqs-form-header-left">
              <div class="nqs-form-icon-box">
                <lightning-icon
                  icon-name="utility:company"
                  size="small"
                  variant="inverse"
                ></lightning-icon>
              </div>
              <div>
                <h3 class="nqs-form-title">B2B Quote Request</h3>
                <p class="nqs-form-sub">Nexus Enterprise Solutions</p>
              </div>
            </div>
            <button
              class="nqs-close-x-btn nqs-close-light"
              onclick={handleCloseNewForm}
            >
              ✕
            </button>
          </div>
          <form class="nqs-form-body" onsubmit={handleFormSubmit}>
            <div class="nqs-form-row">
              <div class="nqs-form-field">
                <label class="nqs-form-label">Company Name</label>
                <div class="nqs-form-input-wrap">
                  <lightning-icon
                    icon-name="utility:company"
                    size="x-small"
                    class="nqs-input-icon"
                  ></lightning-icon>
                  <input
                    required
                    type="text"
                    class="nqs-form-input"
                    placeholder="Nexus Corp"
                    value={formCompany}
                    onchange={handleFormCompany}
                  />
                </div>
              </div>
              <div class="nqs-form-field">
                <label class="nqs-form-label">Professional Email</label>
                <div class="nqs-form-input-wrap">
                  <lightning-icon
                    icon-name="utility:email"
                    size="x-small"
                    class="nqs-input-icon"
                  ></lightning-icon>
                  <input
                    required
                    type="email"
                    class="nqs-form-input"
                    placeholder="ceo@nexus.com"
                    value={formEmail}
                    onchange={handleFormEmail}
                  />
                </div>
              </div>
            </div>
            <div class="nqs-form-field">
              <label class="nqs-form-label">Estimated Quantity</label>
              <div class="nqs-form-input-wrap nqs-form-input-wrap-sm">
                <lightning-icon
                  icon-name="utility:number_input"
                  size="x-small"
                  class="nqs-input-icon"
                ></lightning-icon>
                <input
                  type="number"
                  min="1"
                  class="nqs-form-input"
                  placeholder="10"
                  value={formQty}
                  onchange={handleFormQty}
                />
              </div>
            </div>
            <div class="nqs-form-field">
              <label class="nqs-form-label">Message (optional)</label>
              <textarea
                class="nqs-form-textarea"
                placeholder="Describe your needs, desired products, timelines..."
                value={formMessage}
                onchange={handleFormMessage}
              ></textarea>
            </div>
            <button
              type="submit"
              class="nqs-submit-btn"
              disabled={formSubmitting}
            >
              {formSubmitLabel}
            </button>
          </form>
        </template>

        <!-- Success step -->
        <template if:true={isSuccessStep}>
          <div class="nqs-success-body">
            <div class="nqs-success-icon-wrap">
              <lightning-icon
                icon-name="utility:success"
                size="large"
                variant="success"
              ></lightning-icon>
            </div>
            <h3 class="nqs-success-title">Request Received!</h3>
            <p class="nqs-success-msg">
              Our team has received your request. A dedicated advisor will
              contact you at
              <span class="nqs-success-email">{formEmail}</span>
              within 2 business hours.
            </p>
            <button class="nqs-submit-btn" onclick={handleCloseNewForm}>
              Back to Portal
            </button>
          </div>
        </template>
      </div>
    </div>
  </template>
</template>

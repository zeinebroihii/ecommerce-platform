<template>
  <div class="nos-wrap">
    <!-- ══ Loading ══════════════════════════════════════════════════════════════ -->
    <template if:true={isLoading}>
      <div class="nos-loading-wrap">
        <lightning-spinner
          alternative-text="Loading..."
          size="medium"
        ></lightning-spinner>
      </div>
    </template>

    <!-- ══ Empty state ══════════════════════════════════════════════════════════ -->
    <template if:true={isEmpty}>
      <div class="nos-empty-wrap">
        <lightning-icon icon-name="utility:truck" size="large"></lightning-icon>
        <h3 class="nos-empty-title">No Orders</h3>
        <p class="nos-empty-sub">Your orders will appear here once created.</p>
      </div>
    </template>

    <!-- ══ Main Grid ════════════════════════════════════════════════════════════ -->
    <template if:true={hasOrders}>
      <div class="nos-grid">
        <!-- ── Left: Order Cards ──────────────────────────────────────────────── -->
        <div class="nos-orders-col">
          <template for:each={orders} for:item="order">
            <div key={order.id} class="nos-card">
              <div class="nos-card-inner">
                <!-- Card Left -->
                <div class="nos-card-left">
                  <div>
                    <div class="nos-order-id">{order.id}</div>
                    <div class="nos-order-date">{order.date}</div>
                  </div>
                  <div class="nos-meta-list">
                    <div class="nos-meta-row">
                      <span class="nos-meta-label">Total</span>
                      <span class="nos-meta-val">{order.formattedTotal}</span>
                    </div>
                    <div class="nos-meta-row">
                      <span class="nos-meta-label">Items</span>
                      <span class="nos-meta-val">{order.items}</span>
                    </div>
                  </div>
                  <button
                    class="nos-track-btn"
                    data-id={order.id}
                    onclick={handleOpenDetail}
                  >
                    View Order Details
                  </button>
                </div>

                <!-- Card Right -->
                <div class="nos-card-right">
                  <div class="nos-status-row">
                    <div class="nos-status-left">
                      <span class={order.dotCls}></span>
                      <span class="nos-status-text">{order.status}</span>
                    </div>
                    <div class="nos-eta-block">
                      <span class="nos-eta-label">Estimated Arrival</span>
                      <span class="nos-eta-val">{order.eta}</span>
                    </div>
                  </div>
                  <div class="nos-progress-wrap">
                    <div class="nos-progress-bg">
                      <div
                        class={order.barCls}
                        style={order.progressStyle}
                      ></div>
                    </div>
                    <div class="nos-progress-labels">
                      <span>Shipped</span>
                      <span>In Transit</span>
                      <span>Delivery</span>
                    </div>
                  </div>
                  <div class="nos-location-row">
                    <lightning-icon
                      icon-name="utility:location"
                      size="x-small"
                      class="nos-loc-icon"
                    ></lightning-icon>
                    <span class="nos-location-text">
                      Last location — <strong>{order.location}</strong>
                    </span>
                  </div>
                </div>
              </div>
            </div>
          </template>
        </div>

        <!-- ── Right: Live Tracking + AI Card ─────────────────────────────────── -->
        <div class="nos-side-col">
          <!-- Live Tracking Map -->
          <div class="nos-map-card">
            <div class="nos-map-img">
              <img
                src="https://picsum.photos/seed/map/800/1200"
                alt="Live Map"
                class="nos-map-bg"
              />
            </div>
            <div class="nos-map-overlay"></div>
            <div class="nos-map-content">
              <div class="nos-map-top">
                <div class="nos-live-badge">
                  <span class="nos-live-text">Live Tracking</span>
                </div>
                <span class="nos-live-dot"></span>
              </div>
              <div class="nos-map-bottom">
                <div class="nos-last-update">
                  <div class="nos-update-head">Last Update</div>
                  <div class="nos-update-body">
                    <div class="nos-truck-icon">
                      <lightning-icon
                        icon-name="utility:truck"
                        size="small"
                        variant="inverse"
                      ></lightning-icon>
                    </div>
                    <div>
                      <div class="nos-update-text">
                        Left the distribution center
                      </div>
                      <div class="nos-update-time">12 minutes ago</div>
                    </div>
                  </div>
                </div>
                <button class="nos-fullmap-btn" onclick={handleOpenFullMap}>
                  Open Full Screen Map
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </template>

    <!-- ══ Order Detail Modal ════════════════════════════════════════════════════ -->
    <template if:true={showDetailModal}>
      <div class="nos-overlay" onclick={handleCloseDetail}>
        <div class="nos-modal" onclick={handleStopProp}>
          <!-- Modal Header -->
          <div class="nos-modal-header">
            <div class="nos-modal-header-left">
              <div class="nos-modal-pkg-icon">
                <lightning-icon
                  icon-name="utility:package"
                  size="small"
                  variant="inverse"
                ></lightning-icon>
              </div>
              <div>
                <h3 class="nos-modal-id">{selectedOrder.id}</h3>
                <p class="nos-modal-sub">Order Details &amp; History</p>
              </div>
            </div>
            <button class="nos-modal-close" onclick={handleCloseDetail}>
              ✕
            </button>
          </div>

          <!-- Modal Body -->
          <div class="nos-modal-body">
            <!-- Info Row -->
            <div class="nos-info-grid">
              <div class="nos-info-block">
                <div class="nos-info-label">Shipping Address</div>
                <div class="nos-info-val">{selectedOrder.shippingAddress}</div>
              </div>
              <div class="nos-info-block">
                <div class="nos-info-label">Tracking Number</div>
                <div class="nos-tracking-val">
                  {selectedOrder.trackingNumber}
                </div>
              </div>
              <div class="nos-info-block">
                <div class="nos-info-label">Carrier</div>
                <div class="nos-info-val">{selectedOrder.carrier}</div>
              </div>
            </div>

            <!-- ── Escrow Payment Status (USDC Escrow orders only) ────────── -->
            <template if:true={selectedOrder.isEscrowOrder}>
              <div class="nos-escrow-section">
                <!-- Header row: state badge + locked amount -->
                <div class="nos-escrow-header">
                  <div class={escrowBadgeClass}>
                    <span class="nos-escrow-dot"></span>
                    <span>{escrowStateLabel}</span>
                  </div>
                  <div class="nos-escrow-amount-wrap">
                    <span class="nos-escrow-label">Secured in Escrow</span>
                    <span class="nos-escrow-amount"
                      >{selectedOrder.formattedTotal}</span
                    >
                  </div>
                </div>

                <!-- Countdown timer — shown when delivery confirmed, delay running -->
                <template if:true={escrowCountdownLabel}>
                  <div class="nos-escrow-timer">
                    <lightning-icon
                      icon-name="utility:clock"
                      size="x-small"
                      class="nos-escrow-timer-icon"
                    ></lightning-icon>
                    <span>Auto-release in {escrowCountdownLabel}</span>
                  </div>
                </template>

                <!-- Buyer action buttons -->
                <div class="nos-escrow-actions">
                  <template if:true={canConfirmReceipt}>
                    <button
                      class="nos-confirm-receipt-btn"
                      onclick={handleConfirmReceipt}
                      disabled={escrowActionLoading}
                    >
                      <lightning-icon
                        icon-name="utility:check"
                        size="x-small"
                        variant="inverse"
                      ></lightning-icon>
                      Confirm Receipt &amp; Release Payment
                    </button>
                  </template>

                  <template if:true={canDispute}>
                    <button
                      class="nos-dispute-btn"
                      onclick={handleRaiseDispute}
                      disabled={escrowActionLoading}
                    >
                      <lightning-icon
                        icon-name="utility:warning"
                        size="x-small"
                      ></lightning-icon>
                      Report an Issue
                    </button>
                  </template>
                </div>

                <!-- Frozen / released / refunded status banners -->
                <template if:true={escrowStatusBanner}>
                  <div class={escrowBannerClass}>
                    <lightning-icon
                      icon-name={escrowBannerIcon}
                      size="x-small"
                    ></lightning-icon>
                    <span>{escrowStatusBanner}</span>
                  </div>
                </template>
              </div>
            </template>

            <!-- Two columns: history + items -->
            <div class="nos-detail-cols">
              <!-- Tracking History -->
              <div class="nos-history-col">
                <div class="nos-section-title">
                  <lightning-icon
                    icon-name="utility:clock"
                    size="x-small"
                    class="nos-section-icon"
                  ></lightning-icon>
                  Tracking History
                </div>
                <div class="nos-timeline">
                  <template for:each={selectedOrder.history} for:item="ev">
                    <div key={ev.status} class="nos-event">
                      <div class={ev.dotCls}>
                        <template if:true={ev.isFirst}>
                          <span class="nos-evt-inner-dot"></span>
                        </template>
                      </div>
                      <div class="nos-event-body">
                        <div class="nos-event-top">
                          <span class={ev.statusCls}>{ev.status}</span>
                          <span class="nos-event-time">{ev.time}</span>
                        </div>
                        <div class="nos-event-loc">{ev.location}</div>
                        <div class="nos-event-desc">{ev.description}</div>
                      </div>
                    </div>
                  </template>
                </div>
              </div>

              <!-- Items -->
              <div class="nos-items-col">
                <div class="nos-section-title">
                  <lightning-icon
                    icon-name="utility:package"
                    size="x-small"
                    class="nos-section-icon"
                  ></lightning-icon>
                  Items in this order
                </div>
                <div class="nos-items-list">
                  <template for:each={selectedOrder.products} for:item="item">
                    <div key={item.id} class="nos-item-row">
                      <div class="nos-item-img-wrap">
                        <template if:true={item.image}>
                          <img
                            src={item.image}
                            alt={item.name}
                            class="nos-item-img"
                          />
                        </template>
                        <template if:false={item.image}>
                          <lightning-icon
                            icon-name="utility:product_workspace"
                            size="small"
                          ></lightning-icon>
                        </template>
                      </div>
                      <div class="nos-item-info">
                        <div class="nos-item-name">{item.name}</div>
                        <div class="nos-item-qty">Qty: {item.quantity}</div>
                      </div>
                      <div class="nos-item-price">{item.lineTotal}</div>
                    </div>
                  </template>
                  <!-- Shipping row -->
                  <div class="nos-items-fee-row">
                    <span class="nos-items-fee-label">Shipping</span>
                    <span class="nos-items-fee-val"
                      >{selectedOrder.formattedShipping}</span
                    >
                  </div>
                  <!-- Sparks discount row (only if applied) -->
                  <template if:true={selectedOrder.hasSparksDiscount}>
                    <div class="nos-items-fee-row nos-sparks-row">
                      <span class="nos-items-fee-label">✦ Sparks Discount</span>
                      <span class="nos-sparks-val"
                        >{selectedOrder.formattedSparksDiscount}</span
                      >
                    </div>
                  </template>
                  <div class="nos-items-total-row">
                    <span class="nos-items-total-label">Total Paid</span>
                    <span class="nos-items-total-val"
                      >{selectedOrder.formattedTotal}</span
                    >
                  </div>
                </div>
              </div>
            </div>
          </div>

          <!-- Modal Footer -->
          <div class="nos-modal-footer">
            <!-- Payment choice — only shown for orders with no payment method yet -->
            <template if:true={selectedOrder.isPendingPayment}>
              <div class="nos-payment-group">
                <button
                  class="nos-stripe-btn"
                  onclick={handlePayStripe}
                  disabled={fundingLoading}
                >
                  <svg
                    class="nos-pay-icon"
                    viewBox="0 0 24 16"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <rect x="1" y="1" width="22" height="14" rx="2" />
                    <path d="M1 5h22" />
                  </svg>
                  <span class="nos-btn-inner">
                    <span class="nos-btn-main">Pay with Card</span>
                    <span class="nos-btn-hint">Stripe · instant</span>
                  </span>
                </button>

                <button
                  class="nos-usdc-btn"
                  onclick={handlePayUsdc}
                  disabled={fundingLoading}
                >
                  <template if:true={fundingLoading}>
                    <lightning-spinner
                      size="x-small"
                      alternative-text="Locking funds..."
                      variant="inverse"
                    ></lightning-spinner>
                  </template>
                  <template if:false={fundingLoading}>
                    <span class="nos-usdc-icon">&#9830;</span>
                  </template>
                  <span class="nos-btn-inner">
                    <span class="nos-btn-main">{usdcBtnLabel}</span>
                    <span class="nos-btn-hint"
                      >USDC · Polygon · 5 min delay</span
                    >
                  </span>
                </button>
              </div>
            </template>

            <div class="nos-footer-right">
              <button class="nos-outline-btn" onclick={handleCloseDetail}>
                Close
              </button>
              <button class="nos-primary-btn" onclick={handleDownloadInvoice}>
                Download Invoice
              </button>
            </div>
          </div>
        </div>
      </div>
    </template>

    <!-- ══ USDC Escrow Payment Modal ═══════════════════════════════════════════════ -->
    <template if:true={showEscrowPayModal}>
      <div class="nos-escrow-modal-overlay" onclick={handleCancelEscrowPay}>
        <div class="nos-escrow-modal" onclick={handleStopProp}>
          <!-- ── Step: Review ─────────────────────────────────────────────────── -->
          <template if:true={escrowPayIsReview}>
            <div class="nos-epm-header">
              <div class="nos-epm-step-icon nos-epm-icon-review">
                <lightning-icon
                  icon-name="utility:shield"
                  size="small"
                  variant="inverse"
                ></lightning-icon>
              </div>
              <div>
                <h3 class="nos-epm-title">Review Your Escrow Payment</h3>
                <p class="nos-epm-sub">
                  Your funds will be locked until delivery is confirmed
                </p>
              </div>
            </div>

            <div class="nos-epm-summary">
              <div class="nos-epm-row">
                <span class="nos-epm-row-label">Order</span>
                <span class="nos-epm-row-val nos-epm-mono"
                  >{escrowPayOrderId}</span
                >
              </div>
              <div class="nos-epm-row">
                <span class="nos-epm-row-label">Amount (USDC)</span>
                <span class="nos-epm-row-val nos-epm-amount"
                  >{escrowPayOrderAmount}</span
                >
              </div>
              <div class="nos-epm-row">
                <span class="nos-epm-row-label">Network</span>
                <span class="nos-epm-row-val">
                  <span class="nos-epm-network-badge">Polygon Amoy</span>
                </span>
              </div>
              <div class="nos-epm-row">
                <span class="nos-epm-row-label">Delivery Deadline</span>
                <span class="nos-epm-row-val">{escrowPayDeadline}</span>
              </div>
            </div>

            <div class="nos-epm-how">
              <div class="nos-epm-how-title">How escrow protects you</div>
              <div class="nos-epm-how-item">
                <span class="nos-epm-how-dot nos-epm-dot-blue"></span>
                <span>Funds are locked on-chain — not held by anyone</span>
              </div>
              <div class="nos-epm-how-item">
                <span class="nos-epm-how-dot nos-epm-dot-green"></span>
                <span>Payment releases automatically after delivery + 24h</span>
              </div>
              <div class="nos-epm-how-item">
                <span class="nos-epm-how-dot nos-epm-dot-amber"></span>
                <span
                  >You can dispute and freeze funds at any time before
                  release</span
                >
              </div>
            </div>

            <div class="nos-epm-footer">
              <button
                class="nos-epm-cancel-btn"
                onclick={handleCancelEscrowPay}
              >
                Cancel
              </button>
              <button
                class="nos-epm-confirm-btn"
                onclick={handleConfirmEscrowPay}
              >
                <lightning-icon
                  icon-name="utility:lock"
                  size="x-small"
                  variant="inverse"
                ></lightning-icon>
                Lock Funds in Escrow
              </button>
            </div>
          </template>

          <!-- ── Step: Processing ─────────────────────────────────────────────── -->
          <template if:true={escrowPayIsProcessing}>
            <div class="nos-epm-header nos-epm-header-center">
              <div class="nos-epm-processing-ring">
                <lightning-spinner
                  size="medium"
                  alternative-text="Processing..."
                  variant="brand"
                ></lightning-spinner>
              </div>
              <h3 class="nos-epm-title">Securing Your Payment</h3>
              <p class="nos-epm-sub">Please do not close this window</p>
            </div>

            <div class="nos-epm-steps">
              <div class="nos-epm-step-row">
                <template if:true={processingStep1Done}>
                  <span class="nos-epm-step-check nos-epm-check-done">
                    <lightning-icon
                      icon-name="utility:check"
                      size="x-small"
                      variant="inverse"
                    ></lightning-icon>
                  </span>
                </template>
                <template if:false={processingStep1Done}>
                  <span class="nos-epm-step-check nos-epm-check-active">
                    <lightning-spinner
                      size="x-small"
                      alternative-text="..."
                      variant="inverse"
                    ></lightning-spinner>
                  </span>
                </template>
                <div class="nos-epm-step-text">
                  <span class="nos-epm-step-label"
                    >Step 1 — Authorising USDC transfer</span
                  >
                  <span class="nos-epm-step-hint"
                    >Granting smart contract permission to move your
                    tokens</span
                  >
                </div>
              </div>

              <div class="nos-epm-step-connector"></div>

              <div class="nos-epm-step-row">
                <template if:true={processingStep2Active}>
                  <span class="nos-epm-step-check nos-epm-check-active">
                    <lightning-spinner
                      size="x-small"
                      alternative-text="..."
                      variant="inverse"
                    ></lightning-spinner>
                  </span>
                </template>
                <template if:false={processingStep2Active}>
                  <span class="nos-epm-step-check nos-epm-check-pending"></span>
                </template>
                <div class="nos-epm-step-text">
                  <span class="nos-epm-step-label"
                    >Step 2 — Locking funds in escrow</span
                  >
                  <span class="nos-epm-step-hint"
                    >Depositing USDC into the smart contract on Polygon</span
                  >
                </div>
              </div>
            </div>
          </template>

          <!-- ── Step: Success ────────────────────────────────────────────────── -->
          <template if:true={escrowPayIsSuccess}>
            <div class="nos-epm-success-wrap">
              <div class="nos-epm-success-ring">
                <lightning-icon
                  icon-name="utility:check"
                  size="large"
                  variant="inverse"
                ></lightning-icon>
              </div>
              <h3 class="nos-epm-success-title">Funds Successfully Secured!</h3>
              <p class="nos-epm-success-sub">
                Your USDC is locked in escrow on Polygon. Payment will release
                automatically after delivery is confirmed.
              </p>

              <div class="nos-epm-locked-badge">
                <lightning-icon
                  icon-name="utility:lock"
                  size="x-small"
                  variant="inverse"
                ></lightning-icon>
                <span>Locked in Escrow · Polygon Amoy</span>
              </div>

              <template if:true={escrowPayTxHash}>
                <div class="nos-epm-tx-block">
                  <span class="nos-epm-tx-label">Transaction Hash</span>
                  <span class="nos-epm-tx-val nos-epm-mono"
                    >{escrowPayTxShort}</span
                  >
                  <a
                    class="nos-epm-tx-link"
                    href={escrowPayPolygonscanUrl}
                    target="_blank"
                    rel="noopener noreferrer"
                  >
                    View on Polygonscan ↗
                  </a>
                </div>
              </template>
            </div>

            <div class="nos-epm-footer nos-epm-footer-center">
              <button
                class="nos-epm-confirm-btn"
                onclick={handleCloseEscrowModal}
              >
                Done
              </button>
            </div>
          </template>

          <!-- ── Step: Error ──────────────────────────────────────────────────── -->
          <template if:true={escrowPayIsError}>
            <div class="nos-epm-header nos-epm-header-center">
              <div class="nos-epm-error-icon">
                <lightning-icon
                  icon-name="utility:error"
                  size="large"
                  variant="inverse"
                ></lightning-icon>
              </div>
              <h3 class="nos-epm-title">Payment Failed</h3>
              <p class="nos-epm-sub nos-epm-error-msg">{escrowPayError}</p>
            </div>

            <div class="nos-epm-footer">
              <button
                class="nos-epm-cancel-btn"
                onclick={handleCancelEscrowPay}
              >
                Close
              </button>
              <button
                class="nos-epm-confirm-btn"
                onclick={handleRetryEscrowPay}
              >
                <lightning-icon
                  icon-name="utility:refresh"
                  size="x-small"
                  variant="inverse"
                ></lightning-icon>
                Try Again
              </button>
            </div>
          </template>
        </div>
      </div>
    </template>

    <!-- ══ Full Screen Map Modal ═════════════════════════════════════════════════ -->
    <template if:true={showFullMap}>
      <div class="nos-fullmap-overlay">
        <button class="nos-fullmap-close" onclick={handleCloseFullMap}>
          ✕
        </button>
        <img
          src="https://picsum.photos/seed/fullmap/1920/1080"
          alt="Full Map"
          class="nos-fullmap-img"
        />
        <div class="nos-fullmap-tint"></div>
        <div class="nos-fullmap-info">
          <div class="nos-fullmap-info-header">
            <div class="nos-fullmap-truck">
              <lightning-icon
                icon-name="utility:truck"
                size="small"
                variant="inverse"
              ></lightning-icon>
            </div>
            <div>
              <div class="nos-fullmap-order-id">ORD-2024-001</div>
              <div class="nos-fullmap-order-sub">Live Tracking Active</div>
            </div>
          </div>
          <div class="nos-fullmap-stats">
            <div class="nos-fullmap-stat">
              <span class="nos-pulse-dot nos-dot-emerald"></span>
              <span>Speed : 85 km/h</span>
            </div>
            <div class="nos-fullmap-stat">
              <span class="nos-pulse-dot nos-dot-indigo"></span>
              <span>Destination : Paris, France</span>
            </div>
          </div>
        </div>
      </div>
    </template>
  </div>
</template>

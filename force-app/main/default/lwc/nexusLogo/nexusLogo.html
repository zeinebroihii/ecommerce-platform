<template>
    <div class={containerClass} onclick={handleClick}>

        <!-- ── Icon box + glow ring ───────────────────────────── -->
        <div class="nl-icon-wrap">
            <div class={glowClass}></div>
            <div class={iconBoxClass}>
                <!-- Terminal SVG icon (matches Lucide Terminal) -->
                <svg class={iconSvgClass}
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2.5"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true">
                    <polyline points="4 17 10 11 4 5"></polyline>
                    <line x1="12" y1="19" x2="20" y2="19"></line>
                </svg>
            </div>
        </div>

        <!-- ── Text block ─────────────────────────────────────── -->
        <template if:false={hideText}>
            <div class="nl-text">
                <h1 class={nameClass}>NEXUS</h1>
                <template if:true={hasSubtitle}>
                    <p class="nl-sub">{subtitle}</p>
                </template>
            </div>
        </template>

    </div>
</template>

<template>
    <template if:true={isOpen}>
        <div class="npdm3-overlay" onclick={handleOverlayClick}>
            <div class="npdm3-dialog">

                <!-- Close button -->
                <button class="npdm3-close" onclick={handleClose}>
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
                        <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                </button>

                <!-- ── Left: Image Panel ── -->
                <div class="npdm3-left">
                    <!-- "3D Preview" floating label -->
                    <div class="npdm3-preview-badge">
                        <span class="npdm3-preview-dot"></span>
                        Interactive 3D Preview
                    </div>

                    <!-- Image + glow -->
                    <div class="npdm3-img-container">
                        <div class="npdm3-img-glow" style={glowStyle}></div>
                        <div class="npdm3-img-ring">
                            <img src={currentImage} alt={productName} class="npdm3-img" referrerpolicy="no-referrer"/>
                            <div class="npdm3-img-shine"></div>
                        </div>
                    </div>

                    <!-- Color swatches -->
                    <template if:true={hasColors}>
                        <div class="npdm3-swatches">
                            <span class="npdm3-swatches-label">Select Configuration</span>
                            <div class="npdm3-swatches-row">
                                <template for:each={colorItems} for:item="col">
                                    <button key={col.hex} class={col.btnClass} style={col.bgStyle}
                                            data-idx={col.idx} onclick={handleColorSelect}
                                            title={col.name}>
                                    </button>
                                </template>
                            </div>
                        </div>
                    </template>
                </div>

                <!-- ── Right: Details Panel ── -->
                <div class="npdm3-right">
                    <div class="npdm3-scroll-inner">

                        <!-- Badges -->
                        <div class="npdm3-badge-row">
                            <span class="npdm3-family-badge">{productFamily}</span>
                            <span class="npdm3-newgen-badge">New Gen</span>
                        </div>

                        <!-- Name -->
                        <h2 class="npdm3-name">{productName}</h2>

                        <!-- Rating -->
                        <div class="npdm3-rating-row">
                            <div class="npdm3-stars">
                                <span class="npdm3-star npdm3-star--filled">&#9733;</span>
                                <span class="npdm3-star npdm3-star--filled">&#9733;</span>
                                <span class="npdm3-star npdm3-star--filled">&#9733;</span>
                                <span class="npdm3-star npdm3-star--filled">&#9733;</span>
                                <span class="npdm3-star npdm3-star--dim">&#9733;</span>
                            </div>
                            <span class="npdm3-rating-val">{productRating}</span>
                            <span class="npdm3-rating-sep">&#xb7;</span>
                            <span class="npdm3-arch-tag">Verified Architecture</span>
                        </div>

                        <!-- Price -->
                        <div class="npdm3-price-row">
                            <span class="npdm3-price">{priceFormatted}</span>
                            <span class="npdm3-price-note">Excl. VAT</span>
                        </div>

                        <!-- Description -->
                        <p class="npdm3-desc">{productDescription}</p>

                        <!-- Core Capabilities -->
                        <template if:true={hasFeatures}>
                            <div class="npdm3-features">
                                <h4 class="npdm3-section-label">Core Capabilities</h4>
                                <div class="npdm3-features-list">
                                    <template for:each={featureItems} for:item="feat">
                                        <div key={feat} class="npdm3-feature">
                                            <div class="npdm3-feature-icon">
                                                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.5">
                                                    <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
                                                </svg>
                                            </div>
                                            <span class="npdm3-feature-text">{feat}</span>
                                        </div>
                                    </template>
                                </div>
                            </div>
                        </template>

                        <!-- Specifications -->
                        <template if:true={hasSpecs}>
                            <div class="npdm3-specs">
                                <h4 class="npdm3-section-label">Specifications</h4>
                                <div class="npdm3-specs-grid">
                                    <template for:each={specEntriesDetail} for:item="spec">
                                        <div key={spec.key} class="npdm3-spec-item">
                                            <div class="npdm3-spec-key">{spec.key}</div>
                                            <div class="npdm3-spec-val">{spec.value}</div>
                                        </div>
                                    </template>
                                </div>
                            </div>
                        </template>

                        <!-- Actions -->
                        <div class="npdm3-actions">
                            <div class="npdm3-actions-row">
                                <button class={favBtnClass} onclick={handleFavorite}>
                                    <svg width="20" height="20" viewBox="0 0 24 24" fill={favFill} stroke="currentColor" stroke-width="2" stroke-linecap="round">
                                        <path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/>
                                    </svg>
                                    {favLabel}
                                </button>
                                <button class="npdm3-cart-btn" onclick={handleAddToCart}>
                                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                                        <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
                                        <path d="M1 1h4l2.68 13.39a2 2 0 002 1.61h9.72a2 2 0 001.97-1.67l1.38-7.33H6"/>
                                    </svg>
                                    Add to Cart
                                </button>
                            </div>
                            <button class="npdm3-quote-btn" onclick={handleQuoteRequest}>
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                                    <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/>
                                    <polyline points="14 2 14 8 20 8"/>
                                    <line x1="16" y1="13" x2="8" y2="13"/>
                                    <line x1="16" y1="17" x2="8" y2="17"/>
                                </svg>
                                Request B2B Quote
                            </button>
                        </div>

                    </div>
                </div>

            </div>
        </div>
    </template>
</template>

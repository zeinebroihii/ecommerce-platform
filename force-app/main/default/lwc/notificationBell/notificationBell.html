<template>
    <div class="nb-wrap">

        <!-- ── Bell button ─────────────────────────────────────────────────── -->
        <button class="nb-btn" onclick={togglePanel} title="Notifications">
            <span class="nb-icon">&#x1F514;</span>
            <template if:true={unreadCount}>
                <span class="nb-badge">{unreadCount}</span>
            </template>
        </button>

        <!-- ── Dropdown panel ──────────────────────────────────────────────── -->
        <template if:true={isOpen}>
            <div class="nb-panel">

                <!-- Header -->
                <div class="nb-panel-head">
                    <span class="nb-panel-title">Notifications</span>
                    <template if:true={unreadCount}>
                        <button class="nb-mark-all" onclick={handleMarkAll}>
                            Tout marquer lu
                        </button>
                    </template>
                </div>

                <!-- Loading -->
                <template if:true={isLoading}>
                    <div class="nb-loading">
                        <lightning-spinner size="small" alternative-text="Chargement..."></lightning-spinner>
                    </div>
                </template>

                <!-- Empty -->
                <template if:true={isEmpty}>
                    <div class="nb-empty">
                        <span class="nb-empty-icon">&#x1F4ED;</span>
                        <p>Aucune notification</p>
                    </div>
                </template>

                <!-- List -->
                <template if:true={hasNotifications}>
                    <ul class="nb-list">
                        <template for:each={notifications} for:item="n">
                            <li key={n.Id}
                                class={n.itemClass}
                                onclick={handleNotifClick}
                                data-id={n.Id}
                                data-url={n.RelatedUrl__c}>

                                <span class={n.dotClass}></span>

                                <div class="nb-item-body">
                                    <span class="nb-item-title">{n.Title__c}</span>
                                    <span class="nb-item-msg">{n.Message__c}</span>
                                    <span class="nb-item-date">{n.formattedDate}</span>
                                </div>

                                <span class={n.typeBadgeClass}>{n.Type__c}</span>
                            </li>
                        </template>
                    </ul>
                </template>

            </div>
        </template>

    </div>
</template>

<template>
    <div class="catalog-container">

        <!-- Search and Filter Bar -->
        <div class="filters">
            <lightning-input
                type="search"
                label="Search Products"
                onchange={handleSearch}
                value={searchTerm}
                placeholder="e.g. Dell Laptop...">
            </lightning-input>

            <lightning-combobox
                label="Category"
                options={categoryOptions}
                value={selectedCategory}
                onchange={handleCategoryChange}>
            </lightning-combobox>
        </div>

        <!-- Loading state -->
        <template if:false={products.data}>
            <template if:false={products.error}>
                <div class="loading">
                    <lightning-spinner alternative-text="Loading products..." size="medium"></lightning-spinner>
                </div>
            </template>
        </template>

        <!-- Error state -->
        <template if:true={products.error}>
            <div class="error-state">
                <p>Unable to load products. Please refresh the page.</p>
            </div>
        </template>

        <!-- Product Grid -->
        <template if:true={products.data}>
            <div class="product-grid">
                <template for:each={filteredProducts} for:item="product">
                    <div key={product.Id} class="product-card">
                        <!-- Product Image -->
                        <div class="product-image-wrap">
                            <template if:true={product.imageUrl}>
                                <img src={product.imageUrl} alt={product.Name} class="product-image" />
                            </template>
                            <template if:false={product.imageUrl}>
                                <div class="product-image-placeholder">
                                    <span class="placeholder-icon">&#128247;</span>
                                </div>
                            </template>
                            <span class={product.stockBadgeClass}>{product.stockStatus}</span>
                        </div>

                        <!-- Product Info -->
                        <div class="product-body">
                            <div class="product-family">{product.Family}</div>
                            <h3 class="product-name">{product.Name}</h3>
                            <p class="product-desc">{product.Description}</p>
                        </div>

                        <div class="product-footer">
                            <span class="price">&#163;{product.unitPrice}</span>
                            <template if:true={product.isJustAdded}>
                                <button class="add-btn add-btn-done" disabled>&#x2713; Added!</button>
                            </template>
                            <template if:false={product.isJustAdded}>
                                <lightning-button
                                    label="Add to Cart"
                                    variant="brand"
                                    onclick={handleAddToCart}
                                    data-product-id={product.Id}
                                    disabled={product.isOutOfStock}
                                    class="add-btn">
                                </lightning-button>
                            </template>
                        </div>
                    </div>
                </template>
            </div>

            <!-- Empty state -->
            <template if:true={filteredProducts.length}>
            </template>
        </template>

    </div>
</template>

<template>
    <div class="qm-root">

        <!-- Header -->
        <div class="qm-header">
            <div class="qm-title-wrap">
                <span class="qm-icon">📋</span>
                <h2 class="qm-title">Gestion des Devis</h2>
                <span class="qm-count">{totalCount} devis</span>
            </div>
            <div class="qm-filters">
                <template for:each={filterOptions} for:item="f">
                    <button key={f.value} class={f.cls}
                            data-value={f.value} onclick={handleFilter}>
                        {f.label}
                        <template if:true={f.count}>
                            <span class="filter-badge">{f.count}</span>
                        </template>
                    </button>
                </template>
            </div>
        </div>

        <!-- Loading -->
        <template if:true={loading}>
            <div class="qm-loading">
                <div class="qm-spinner"></div>
            </div>
        </template>

        <!-- Table -->
        <template if:false={loading}>
            <template if:true={hasQuotes}>
                <div class="qm-table-wrap">
                    <table class="qm-table">
                        <thead>
                            <tr>
                                <th>Devis</th>
                                <th>Opportunité</th>
                                <th>Compte</th>
                                <th>Montant</th>
                                <th>Statut</th>
                                <th>Expiration</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <template for:each={quotes} for:item="q">
                                <tr key={q.quoteId} class={q.rowCls}>
                                    <td class="qt-name">{q.name}</td>
                                    <td>
                                        <a href={q.oppUrl} class="qt-link">{q.opportunityName}</a>
                                    </td>
                                    <td class="qt-account">{q.accountName}</td>
                                    <td class="qt-amount">{q.formattedTotal} €</td>
                                    <td><span class={q.statusCls}>{q.status}</span></td>
                                    <td class="qt-date">{q.expirationDate}</td>
                                    <td>
                                        <div class="qt-actions">
                                            <!-- Send email (Draft or Sent) -->
                                            <template if:true={q.canSend}>
                                                <button class="act-btn act-send"
                                                        data-id={q.quoteId}
                                                        data-name={q.name}
                                                        onclick={handleOpenSendModal}
                                                        title="Envoyer par email">
                                                    📧
                                                </button>
                                            </template>
                                            <!-- Resend (Presented) -->
                                            <template if:true={q.isPresented}>
                                                <button class="act-btn act-resend"
                                                        data-id={q.quoteId}
                                                        data-name={q.name}
                                                        onclick={handleOpenSendModal}
                                                        title="Renvoyer">
                                                    🔄
                                                </button>
                                            </template>
                                            <!-- Accept manually -->
                                            <template if:false={q.isAccepted}>
                                                <template if:false={q.isRejected}>
                                                    <button class="act-btn act-accept"
                                                            data-id={q.quoteId}
                                                            onclick={handleAccept}
                                                            title="Marquer Accepté">
                                                        ✅
                                                    </button>
                                                    <button class="act-btn act-reject"
                                                            data-id={q.quoteId}
                                                            onclick={handleReject}
                                                            title="Marquer Rejeté">
                                                        ❌
                                                    </button>
                                                </template>
                                            </template>
                                        </div>
                                    </td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>
            </template>
            <template if:false={hasQuotes}>
                <div class="qm-empty">
                    <span class="qm-empty-icon">📭</span>
                    <p>Aucun devis {emptyLabel}.</p>
                </div>
            </template>
        </template>

        <!-- Send Email Modal -->
        <template if:true={showSendModal}>
            <div class="qm-backdrop" onclick={handleCloseSend}></div>
            <div class="qm-modal">
                <div class="qm-modal-header">
                    <h3>📧 Envoyer le devis</h3>
                    <button class="qm-close" onclick={handleCloseSend}>✕</button>
                </div>
                <div class="qm-modal-body">
                    <p class="send-quote-name">{sendQuoteName}</p>
                    <div class="qm-form-group">
                        <label>Email destinataire *</label>
                        <input type="email" value={sendEmail} data-field="sendEmail"
                               onchange={handleSendField} class="qm-input"
                               placeholder="client@example.com"/>
                    </div>
                    <div class="qm-form-group">
                        <label>BCC</label>
                        <input type="email" value={sendBcc} data-field="sendBcc"
                               onchange={handleSendField} class="qm-input"
                               placeholder="admin@talexo.com"/>
                    </div>
                    <div class="qm-form-group">
                        <label>Objet</label>
                        <input type="text" value={sendSubject} data-field="sendSubject"
                               onchange={handleSendField} class="qm-input"/>
                    </div>
                    <div class="qm-form-group">
                        <label>Message</label>
                        <textarea value={sendNote} data-field="sendNote" rows="3"
                                  onchange={handleSendField} class="qm-input"
                                  placeholder="Message personnalisé…"></textarea>
                    </div>
                </div>
                <div class="qm-modal-footer">
                    <button class="qm-btn-ghost" onclick={handleCloseSend}>Annuler</button>
                    <button class="qm-btn-primary" onclick={handleSend} disabled={sending}>
                        <template if:true={sending}>Envoi…</template>
                        <template if:false={sending}>📧 Envoyer</template>
                    </button>
                </div>
            </div>
        </template>

    </div>
</template>

<template>
    <aside class="npsb-wrap">

        <!-- Brand / Logo -->
        <div class="npsb-brand">
            <div class="npsb-logo">
                <lightning-icon icon-name="utility:zap" size="small" variant="inverse"></lightning-icon>
            </div>
            <div>
                <h1 class="npsb-brand-name">NEXUS</h1>
                <p class="npsb-brand-sub">Customer Portal</p>
            </div>
        </div>

        <!-- Navigation -->
        <nav class="npsb-nav">
            <template for:each={menuItems} for:item="item">
                <button
                    key={item.id}
                    class={item.btnClass}
                    data-tab={item.id}
                    onclick={handleNavClick}
                >
                    <div class="npsb-item-left">
                        <lightning-icon
                            icon-name={item.iconName}
                            size="x-small"
                            variant={item.iconVariant}
                        ></lightning-icon>
                        <span class="npsb-item-label">{item.label}</span>
                    </div>
                    <template if:true={item.showBadge}>
                        <span class="npsb-cart-badge">{item.badge}</span>
                    </template>
                    <template if:false={item.showBadge}>
                        <span class="npsb-chevron">&#8250;</span>
                    </template>
                </button>
            </template>
        </nav>

        <div class="npsb-sep"></div>

        <!-- Support Premium card -->
        <div class="npsb-support">
            <div class="npsb-support-glow"></div>
            <div class="npsb-support-body">
                <h4 class="npsb-support-title">Support Premium</h4>
                <p class="npsb-support-desc">Besoin d&apos;aide pour une commande complexe&nbsp;?</p>
                <button class="npsb-support-btn" onclick={handleContactExpert}>
                    Contacter un expert
                </button>
            </div>
        </div>

        <!-- Logout -->
        <button class="npsb-logout" onclick={handleLogout}>
            <lightning-icon icon-name="utility:logout" size="x-small" class="npsb-logout-icon"></lightning-icon>
            <span>D&eacute;connexion</span>
        </button>

    </aside>
</template>

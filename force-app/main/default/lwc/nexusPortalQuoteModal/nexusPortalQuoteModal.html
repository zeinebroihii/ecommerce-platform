<template>
    <template if:true={isVisible}>
        <div class="npqm-overlay" onclick={handleOverlayClick}>
            <div class="npqm-modal" onclick={stopPropagation}>

                <!-- ── Loading state ─────────────────────────────── -->
                <template if:true={isLoading}>
                    <div class="npqm-loading">
                        <div class="npqm-spinner">
                            <div class="npqm-spinner-ring"></div>
                            <div class="npqm-spinner-core">
                                <lightning-icon icon-name="utility:file" size="small" class="npqm-spinner-icon"></lightning-icon>
                            </div>
                        </div>
                        <h3 class="npqm-title">Salesforce Flow Active</h3>
                        <p class="npqm-sub">Generating Quote Object &amp; PDF...</p>
                        <div class="npqm-loading-steps">
                            <div class="npqm-step npqm-step--done">
                                <div class="npqm-step-dot"></div>
                                <span>Initialising Flow</span>
                            </div>
                            <div class="npqm-step npqm-step--active">
                                <div class="npqm-step-dot"></div>
                                <span>Creating Quote Object</span>
                            </div>
                            <div class="npqm-step">
                                <div class="npqm-step-dot"></div>
                                <span>Generating PDF</span>
                            </div>
                            <div class="npqm-step">
                                <div class="npqm-step-dot"></div>
                                <span>Sending Email</span>
                            </div>
                        </div>
                    </div>
                </template>

                <!-- ── Result state ──────────────────────────────── -->
                <template if:false={isLoading}>
                    <div class="npqm-result">

                        <!-- Top row: check + close -->
                        <div class="npqm-result-top">
                            <div class="npqm-check">&#10003;</div>
                            <button class="npqm-close-btn" onclick={handleClose}>&#x2715;</button>
                        </div>

                        <!-- Title -->
                        <div class="npqm-result-header">
                            <h3 class="npqm-title">Quote Generated</h3>
                            <p class="npqm-sub">
                                A formal PDF has been emailed to
                                <span class="npqm-email">{recipientEmail}</span>
                            </p>
                        </div>

                        <!-- Quote ID chip -->
                        <div class="npqm-quote-chip">
                            <lightning-icon icon-name="utility:file" size="xx-small" class="npqm-chip-icon"></lightning-icon>
                            <span>{quoteId}</span>
                        </div>

                        <!-- Stats grid -->
                        <div class="npqm-stats">
                            <div class="npqm-stat">
                                <div class="npqm-stat-label">Discount Applied</div>
                                <div class="npqm-stat-value npqm-stat--green">{discountLabel}</div>
                            </div>
                            <div class="npqm-stat">
                                <div class="npqm-stat-label">Payment Terms</div>
                                <div class="npqm-stat-value">{paymentTerms}</div>
                            </div>
                            <div class="npqm-stat">
                                <div class="npqm-stat-label">Valid Until</div>
                                <div class="npqm-stat-value">{validUntil}</div>
                            </div>
                            <div class="npqm-stat">
                                <div class="npqm-stat-label">Quote Total</div>
                                <div class="npqm-stat-value npqm-stat--indigo">{quoteTotalLabel}</div>
                            </div>
                        </div>

                        <!-- Agentforce AI banner -->
                        <div class="npqm-ai-banner">
                            <div class="npqm-ai-left">
                                <span class="npqm-ai-tag">
                                    <lightning-icon icon-name="utility:sparkles" size="xx-small" class="npqm-ai-tag-icon"></lightning-icon>
                                    Agentforce Prediction
                                </span>
                                <span class="npqm-ai-label">Acceptance Probability</span>
                            </div>
                            <div class="npqm-ai-right">
                                <div class="npqm-ai-pct">{acceptanceProbability}%</div>
                                <div class="npqm-ai-bar-wrap">
                                    <div class="npqm-ai-bar" style={probabilityBarStyle}></div>
                                </div>
                            </div>
                        </div>

                        <!-- Actions -->
                        <div class="npqm-actions">
                            <button class="npqm-done-btn" onclick={handleClose}>
                                Done
                            </button>
                            <button class="npqm-view-btn" onclick={handleViewQuote}>
                                <lightning-icon icon-name="utility:preview" size="xx-small" class="npqm-view-icon"></lightning-icon>
                                View Quote
                            </button>
                        </div>

                    </div>
                </template>

            </div>
        </div>
    </template>
</template>

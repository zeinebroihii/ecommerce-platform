<template>
    <template if:true={isOpen}>
        <div class="nam-wrap">

            <!-- ── Backdrop (click to close) ──────────────────────────── -->
            <div class="nam-backdrop" onclick={handleClose}></div>

            <!-- ── Modal card ─────────────────────────────────────────── -->
            <div class="nam-modal" onclick={handleModalClick}>

                <!-- Close button -->
                <button class="nam-close-btn" onclick={handleClose} aria-label="Close">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20"
                        viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"/>
                        <line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                </button>

                <!-- Scrollable content -->
                <div class="nam-content">

                    <!-- B2B registration → lead form -->
                    <template if:true={showLeadForm}>
                        <c-nexus-lead-form></c-nexus-lead-form>
                    </template>

                    <!-- All other modes → auth view -->
                    <template if:false={showLeadForm}>
                        <c-nexus-auth-view
                            initial-mode={initialMode}
                            onsignupb2b={handleSignupB2B}>
                        </c-nexus-auth-view>
                    </template>

                </div>
            </div>
        </div>
    </template>
</template>

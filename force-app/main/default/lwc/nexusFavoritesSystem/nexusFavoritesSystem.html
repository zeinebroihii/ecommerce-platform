<template>
  <div class="nfs-wrap">
    <!-- ══ Toolbar ══════════════════════════════════════════════════════════════ -->
    <div class="nfs-toolbar">
      <span class="nfs-count-badge">{savedLabel}</span>
    </div>

    <!-- ══ Empty state ══════════════════════════════════════════════════════════ -->
    <template if:true={isEmpty}>
      <div class="nfs-empty-card">
        <div class="nfs-empty-icon-wrap">
          <lightning-icon
            icon-name="utility:bookmark"
            size="medium"
          ></lightning-icon>
        </div>
        <div class="nfs-empty-text">
          <h3 class="nfs-empty-title">No saved items yet</h3>
          <p class="nfs-empty-desc">
            Browse the catalog and save products for quick access and future
            orders.
          </p>
        </div>
        <button class="nfs-explore-btn" onclick={handleExploreCatalog}>
          Browse Catalog
        </button>
      </div>
    </template>

    <!-- ══ Product Grid ══════════════════════════════════════════════════════════ -->
    <template if:false={isEmpty}>
      <div class="nfs-grid">
        <template for:each={favoritesEnriched} for:item="p">
          <div key={p.id} class="nfs-card">
            <!-- Image area -->
            <div class="nfs-img-wrap">
              <img src={p.image} alt={p.name} class="nfs-img" />
              <div class="nfs-img-overlay"></div>

              <!-- Family badge (top-left) -->
              <div class="nfs-family-badge">{p.family}</div>

              <!-- Heart / remove button (top-right, slides in on hover) -->
              <button
                class="nfs-heart-btn nfs-heart-active"
                data-id={p.id}
                onclick={handleRemoveFavorite}
                title="Remove from favorites"
              >
                <lightning-icon
                  icon-name="utility:heart"
                  size="x-small"
                  variant="inverse"
                ></lightning-icon>
              </button>

              <!-- MSRP price (bottom-left, slides up on hover) -->
              <div class="nfs-price-hover">
                <span class="nfs-price-label">MSRP</span>
                <span class="nfs-price-val">{p.formattedPrice}</span>
              </div>
            </div>

            <!-- Body -->
            <div class="nfs-card-body">
              <div class="nfs-meta-row">
                <span class="nfs-code">SKU: {p.productCode}</span>
                <span class="nfs-family-label">{p.family}</span>
              </div>
              <h4 class="nfs-name">{p.name}</h4>
              <p class="nfs-desc">{p.description}</p>
              <div class="nfs-card-footer">
                <c-nexus-logo variant="slate" size="xs"></c-nexus-logo>
                <button
                  class="nfs-cart-btn"
                  data-id={p.id}
                  onclick={handleAddToCart}
                  title="Add to cart"
                >
                  <lightning-icon
                    icon-name="utility:cart"
                    size="small"
                    variant="inverse"
                  ></lightning-icon>
                </button>
              </div>
            </div>
          </div>
        </template>
      </div>
    </template>
  </div>
</template>

<template>
  <div class="ncp-wrap">
    <!-- ── Browse Popup (AI recommendation while browsing catalog) ── -->
    <template if:true={browsePopupVisible}>
      <div class="nbp-popup">
        <div class="nbp-popup-inner">
          <div class="nbp-popup-left">
            <div class="nbp-popup-icon">
              <lightning-icon
                icon-name="utility:sparkles"
                size="x-small"
                variant="inverse"
              ></lightning-icon>
            </div>
            <div class="nbp-popup-text">
              <p class="nbp-popup-label">Recommended for you</p>
              <p class="nbp-popup-name">{browsePopupProduct.productName}</p>
              <p class="nbp-popup-price">{browsePopupProduct.priceFormatted}</p>
            </div>
          </div>
          <div class="nbp-popup-actions">
            <button class="nbp-popup-cta" onclick={handleBrowsePopupViewOffer}>
              View Offer
            </button>
            <button
              class="nbp-popup-close"
              onclick={handleDismissBrowsePopup}
              aria-label="Dismiss"
            >
              &#x2715;
            </button>
          </div>
        </div>
      </div>
    </template>

    <!-- ── Sparks Info Modal (rendered at top level to escape stacking contexts) ── -->
    <template if:true={_sparksModalOpen}>
      <div class="ncp-sparks-overlay" onclick={handleSparksOverlayClick}>
        <div class="ncp-sparks-modal" onclick={handleSparksModalStopProp}>
          <h3 class="ncp-smodal-title">
            Nexus <span class="ncp-smodal-accent">Sparks</span>
          </h3>
          <p class="ncp-smodal-sub">Your loyalty, amplified by intelligence.</p>
          <div class="ncp-smodal-rows">
            <div class="ncp-smodal-row">
              <span class="ncp-smodal-icon">
                <lightning-icon
                  icon-name="utility:currency"
                  size="x-small"
                ></lightning-icon>
              </span>
              <p class="ncp-smodal-text">
                100 Sparks = $1.00 — Apply at checkout to reduce your total
                instantly.
              </p>
            </div>
            <div class="ncp-smodal-row">
              <span class="ncp-smodal-icon ncp-smodal-icon--amber">
                <lightning-icon
                  icon-name="utility:clock"
                  size="x-small"
                ></lightning-icon>
              </span>
              <p class="ncp-smodal-text">
                <strong>30-day maturation</strong> — Points activate 30 days
                after your purchase to prevent buy-and-return fraud.
              </p>
            </div>
            <div class="ncp-smodal-row">
              <span class="ncp-smodal-icon ncp-smodal-icon--rose">
                <lightning-icon
                  icon-name="utility:date_time"
                  size="x-small"
                ></lightning-icon>
              </span>
              <p class="ncp-smodal-text">
                <strong>90-day expiry</strong> — New purchases reset your
                expiration window. Stay active to keep earning!
              </p>
            </div>
          </div>
          <div class="ncp-smodal-balance-card">
            <div>
              <div class="ncp-smodal-bal-label">Current Balance</div>
              <div class="ncp-smodal-bal-sparks">{sparksBalance} Sparks</div>
            </div>
            <div class="ncp-smodal-bal-right">
              <div class="ncp-smodal-bal-label">Value</div>
              <div class="ncp-smodal-bal-usd">{sparksFormattedValue}</div>
            </div>
          </div>
          <button class="ncp-smodal-close-btn" onclick={handleSparksClose}>
            Close
          </button>
        </div>
      </div>
    </template>

    <!-- catalog full page view (hides sidebar/main structure) -->
    <template if:true={isCatalog}>
      <c-nexus-catalog
        favorites={favorites}
        all-products={_products}
        onaddtocart={handleAddToCartFromCatalog}
        ontogglefavorite={handleToggleFavoriteFromCatalog}
      >
      </c-nexus-catalog>
    </template>

    <!-- checkout full page view (hides sidebar/main structure) -->
    <template if:true={isCheckout}>
      <c-nexus-checkout
        cart-items={cart}
        account-id={profileAccountId}
        profile-street={profileStreet}
        profile-city={profileCity}
        profile-postal-code={profilePostalCode}
        profile-country={profileCountry}
        sparks-discount={sparksDiscount}
        onnavigate={handleNavigateFromCart}
      ></c-nexus-checkout>
    </template>

    <template if:false={isCatalogOrCheckout}>
      <!-- ══ Sidebar ═══════════════════════════════════════════════════════════ -->
      <aside class="ncp-sidebar">
        <!-- Brand / Logo -->
        <div class="ncp-brand-header">
          <c-nexus-logo
            variant="emerald"
            size="lg"
            subtitle="Customer Portal"
          ></c-nexus-logo>
        </div>

        <!-- Scrollable nav area -->
        <div class="ncp-nav-scroll">
          <!-- ── Main Menu ── -->
          <div class="ncp-nav-section">
            <p class="ncp-nav-section-label">Main Menu</p>
            <template for:each={mainNavTabs} for:item="tab">
              <button
                key={tab.id}
                class={tab.cls}
                onclick={handleTabChange}
                data-id={tab.id}
              >
                <div class="ncp-nav-left">
                  <lightning-icon
                    icon-name={tab.icon}
                    size="small"
                    variant={tab.iconVariant}
                  ></lightning-icon>
                  <span>{tab.label}</span>
                </div>
                <template if:true={tab.hasBadge}>
                  <span class="ncp-cart-badge">{tab.badge}</span>
                </template>
                <template if:false={tab.hasBadge}>
                  <span class={tab.chevronCls}>&#8250;</span>
                </template>
              </button>
            </template>
          </div>

          <!-- ── Advanced Tools ── -->
          <div class="ncp-nav-section">
            <p class="ncp-nav-section-label">Advanced Tools</p>
            <template for:each={toolsNavTabs} for:item="tab">
              <button
                key={tab.id}
                class={tab.cls}
                onclick={handleTabChange}
                data-id={tab.id}
              >
                <div class="ncp-nav-left">
                  <lightning-icon
                    icon-name={tab.icon}
                    size="small"
                    variant={tab.iconVariant}
                  ></lightning-icon>
                  <span>{tab.label}</span>
                </div>
                <span class={tab.chevronCls}>&#8250;</span>
              </button>
            </template>
          </div>

          <!-- ── Account & Support ── -->
          <div class="ncp-nav-section">
            <p class="ncp-nav-section-label">Account &amp; Support</p>
            <template for:each={accountNavTabs} for:item="tab">
              <button
                key={tab.id}
                class={tab.cls}
                onclick={handleTabChange}
                data-id={tab.id}
              >
                <div class="ncp-nav-left">
                  <lightning-icon
                    icon-name={tab.icon}
                    size="small"
                    variant={tab.iconVariant}
                  ></lightning-icon>
                  <span>{tab.label}</span>
                </div>
                <span class={tab.chevronCls}>&#8250;</span>
              </button>
            </template>
          </div>

          <!-- ── Premium Support Card (indigo) ── -->
          <div class="ncp-premium-section">
            <div class="ncp-premium-card-indigo">
              <div class="ncp-premium-inner">
                <div class="ncp-premium-sparkle-icon">
                  <lightning-icon
                    icon-name="utility:sparkles"
                    size="x-small"
                    variant="inverse"
                  ></lightning-icon>
                </div>
                <h4 class="ncp-premium-title-white">Premium Support</h4>
                <p class="ncp-premium-desc-light">
                  Need help with a complex enterprise order?
                </p>
                <button class="ncp-premium-cta" onclick={handleCasesTab}>
                  Contact an expert
                </button>
              </div>
              <div class="ncp-premium-glow-orb"></div>
            </div>
          </div>
        </div>

        <!-- Footer / User Profile -->
        <div class="ncp-user-footer">
          <div class="ncp-user-row">
            <div class="ncp-user-avatar-wrap">
              <img
                src="https://picsum.photos/seed/user/100/100"
                class="ncp-user-avatar"
                alt="User"
              />
              <div class="ncp-user-online-dot"></div>
            </div>
            <div class="ncp-user-info">
              <h5 class="ncp-user-name">{profileName}</h5>
              <p class="ncp-user-role">{profileRole}</p>
            </div>
            <button class="ncp-settings-btn" onclick={handleSettingsTab}>
              <lightning-icon
                icon-name="utility:settings"
                size="x-small"
              ></lightning-icon>
            </button>
          </div>
          <button class="ncp-logout-new-btn">
            <lightning-icon
              icon-name="utility:logout"
              size="x-small"
            ></lightning-icon>
            <span>Logout System</span>
          </button>
        </div>
      </aside>

      <!-- ══ Main content ═══════════════════════════════════════════════════════ -->
      <main class="ncp-main">
        <!-- ─ Dashboard ──────────────────────────────────────────────────── -->
        <template if:true={isDashboard}>
          <div class="ncp-section ncp-dash-section">
            <!-- AI Hero Banner + Sparks side by side -->
            <div class="ncp-banner-sparks-row">
              <section class="ncp-ai-banner">
                <div class="ncp-ai-inner">
                  <div class="ncp-ai-left">
                    <div class="ncp-ai-badge">
                      <lightning-icon
                        icon-name="utility:sparkles"
                        size="x-small"
                      ></lightning-icon>
                      <span>Nexus AI Intelligence</span>
                    </div>
                    <h2 class="ncp-ai-title">
                      YOUR <span class="ncp-ai-accent">INTELLIGENT</span> PORTAL
                    </h2>
                    <p class="ncp-ai-desc">
                      Nexus AI has analysed your account. Discover your
                      consumption forecasts and personalised recommendations.
                    </p>
                    <div class="ncp-ai-btns">
                      <button class="ncp-ai-cta" onclick={handleGoToInsights}>
                        View Insights
                      </button>
                      <button
                        class="ncp-ai-cta-secondary"
                        onclick={handleGoToTimeline}
                      >
                        Timeline 360°
                      </button>
                    </div>
                  </div>
                  <div class="ncp-ai-stats">
                    <div class="ncp-stat-mini">
                      <div class="ncp-stat-value ncp-stat-emerald">98%</div>
                      <div class="ncp-stat-label">Health Score</div>
                    </div>
                    <div class="ncp-stat-mini">
                      <div class="ncp-stat-value ncp-stat-indigo">15%</div>
                      <div class="ncp-stat-label">AI Savings</div>
                    </div>
                    <div class="ncp-stat-mini">
                      <div class="ncp-stat-value ncp-stat-amber">+12%</div>
                      <div class="ncp-stat-label">Forecast Usage</div>
                    </div>
                    <div class="ncp-stat-mini">
                      <div class="ncp-stat-value ncp-stat-emerald">100%</div>
                      <div class="ncp-stat-label">SLA Status</div>
                    </div>
                  </div>
                </div>
                <div class="ncp-ai-glow"></div>
                <div class="ncp-ai-gradient"></div>
              </section>

              <!-- Nexus Sparks Banner -->
              <div class="ncp-sparks-row">
                <c-nexus-sparks
                  sparks-balance={sparksBalance}
                  onignite={handleSparksIgnite}
                ></c-nexus-sparks>
              </div>
            </div>
            <!-- end ncp-banner-sparks-row -->

            <!-- KPI Grid -->
            <div class="ncp-kpi-grid">
              <div class="ncp-kpi-card">
                <div class="ncp-kpi-icon ncp-kpi-icon-indigo">
                  <lightning-icon
                    icon-name="utility:package"
                    size="small"
                  ></lightning-icon>
                </div>
                <div class="ncp-kpi-value">12</div>
                <div class="ncp-kpi-label">Active Orders</div>
              </div>
              <div class="ncp-kpi-card">
                <div class="ncp-kpi-icon ncp-kpi-icon-emerald">
                  <lightning-icon
                    icon-name="utility:trending_up"
                    size="small"
                  ></lightning-icon>
                </div>
                <div class="ncp-kpi-value">2 450 $</div>
                <div class="ncp-kpi-label">Économies Totales</div>
              </div>
              <div class="ncp-kpi-card">
                <div class="ncp-kpi-icon ncp-kpi-icon-amber">
                  <lightning-icon
                    icon-name="utility:clock"
                    size="small"
                  ></lightning-icon>
                </div>
                <div class="ncp-kpi-value">1.2h</div>
                <div class="ncp-kpi-label">Temps de Réponse</div>
              </div>
              <div class="ncp-kpi-card">
                <div class="ncp-kpi-icon ncp-kpi-icon-indigo">
                  <lightning-icon
                    icon-name="utility:connected_apps"
                    size="small"
                  ></lightning-icon>
                </div>
                <div class="ncp-kpi-value">Actif</div>
                <div class="ncp-kpi-label">Scanner d'Actifs</div>
              </div>
            </div>

            <!-- AI Recommendations (Agentforce-powered) -->
            <c-nexus-recommendations
              onaddtocart={handleAddToCartFromRec}
              onviewoffer={handleViewOfferFromRec}
              onviewproduct={handleViewProductFromRec}
            ></c-nexus-recommendations>

            <!-- Top Deals -->
            <c-nexus-portal-deals-section
              onaddtocart={handleDealsAddToCartPortal}
              onviewdetails={handleDealsViewDetailsPortal}
            >
            </c-nexus-portal-deals-section>

            <!-- Recent Activity (real data) -->
            <div class="ncp-activity-card">
              <div class="ncp-card-header">
                <h3 class="ncp-card-title">Activité Récente</h3>
                <button
                  class="ncp-view-all-btn"
                  onclick={handleViewAllActivity}
                >
                  Tout voir
                </button>
              </div>

              <!-- Skeleton while loading -->
              <template if:true={isActivityLoading}>
                <div class="ncp-activity-list">
                  <div class="ncp-activity-row ncp-act-skeleton-row">
                    <div class="ncp-act-skel ncp-act-skel-icon"></div>
                    <div class="ncp-act-skel-body">
                      <div class="ncp-act-skel ncp-act-skel-title"></div>
                      <div class="ncp-act-skel ncp-act-skel-sub"></div>
                    </div>
                    <div class="ncp-act-skel ncp-act-skel-pill"></div>
                  </div>
                  <div class="ncp-activity-row ncp-act-skeleton-row">
                    <div class="ncp-act-skel ncp-act-skel-icon"></div>
                    <div class="ncp-act-skel-body">
                      <div
                        class="ncp-act-skel ncp-act-skel-title"
                        style="width: 55%"
                      ></div>
                      <div
                        class="ncp-act-skel ncp-act-skel-sub"
                        style="width: 40%"
                      ></div>
                    </div>
                    <div class="ncp-act-skel ncp-act-skel-pill"></div>
                  </div>
                  <div class="ncp-activity-row ncp-act-skeleton-row">
                    <div class="ncp-act-skel ncp-act-skel-icon"></div>
                    <div class="ncp-act-skel-body">
                      <div
                        class="ncp-act-skel ncp-act-skel-title"
                        style="width: 70%"
                      ></div>
                      <div
                        class="ncp-act-skel ncp-act-skel-sub"
                        style="width: 35%"
                      ></div>
                    </div>
                    <div class="ncp-act-skel ncp-act-skel-pill"></div>
                  </div>
                </div>
              </template>

              <!-- Real activity rows (dashboard: first 3 only) -->
              <template if:true={hasActivityItems}>
                <div class="ncp-activity-list">
                  <template for:each={dashboardActivityItems} for:item="act">
                    <div
                      key={act.key}
                      class="ncp-activity-row ncp-activity-row-clickable"
                      data-id={act.itemId}
                      data-type={act.type}
                      onclick={handleActivityRowClick}
                    >
                      <div class="ncp-activity-icon">
                        <lightning-icon
                          icon-name={act.icon}
                          size="small"
                        ></lightning-icon>
                      </div>
                      <div class="ncp-activity-info">
                        <div class="ncp-activity-name">{act.title}</div>
                        <div class="ncp-activity-sub">
                          {act.dateLabel} · {act.subtitle}
                        </div>
                      </div>
                      <span class={act.pillClass}>{act.status}</span>
                      <span class="ncp-row-chevron">&#8250;</span>
                    </div>
                  </template>
                </div>
              </template>

              <!-- Empty state -->
              <template if:true={isActivityEmpty}>
                <div class="ncp-act-empty">
                  <lightning-icon
                    icon-name="utility:clock"
                    size="small"
                  ></lightning-icon>
                  <p>Aucune activité récente</p>
                </div>
              </template>
            </div>
          </div>

          <!-- Engagement drawers (Activity History + Offer Detail) -->
          <c-nexus-engagement-system
            activity-items={_activityItems}
            onaddtocart={handleEngagementAddToCart}
            onactivityclick={handleEngagementActivityClick}
          ></c-nexus-engagement-system>

          <!-- Product detail overlay for deals or other quick views -->
          <template if:true={isDetailViewOpen}>
            <c-nexus-product-detail-view
              product={detailProduct}
              favorites={favorites}
              all-products={_products}
              onclose={handleDetailClose}
              onaddtocart={handleDetailAddToCart}
              ontogglefavorite={handleDetailToggleFavorite}
            >
            </c-nexus-product-detail-view>
          </template>
        </template>

        <!-- ─ Favoris ──────────────────────────────────────────────────── -->
        <template if:true={isFavorites}>
          <div class="ncp-section ncp-fullbleed">
            <c-nexus-favorites-system
              favorites={favorites}
              onremovefavorite={handleRemoveFavorite}
              onaddtocart={handleDealsAddToCartPortal}
              onexplorecatalog={handleGoToCatalog}
            >
            </c-nexus-favorites-system>
          </div>
        </template>

        <!-- ─ Panier ───────────────────────────────────────────────────── -->
        <template if:true={isCart}>
          <div class="ncp-section">
            <c-nexus-portal-cart
              sparks-balance={sparksBalance}
              is-b2-c={isB2C}
              onnavigate={handleNavigateFromCart}
              oncartchanged={handleCartChanged}
            ></c-nexus-portal-cart>
          </div>
        </template>

        <!-- ─ Commandes ────────────────────────────────────────────────── -->
        <template if:true={isOrders}>
          <div class="ncp-section ncp-fullbleed">
            <c-nexus-order-system></c-nexus-order-system>
          </div>
        </template>

        <!-- ─ Devis (B2B only) ─────────────────────────────────────────── -->
        <template if:true={isB2B}>
          <template if:true={isQuotations}>
            <div class="ncp-section ncp-fullbleed">
              <c-nexus-quotation-system></c-nexus-quotation-system>
            </div>
          </template>
        </template>

        <!-- ─ Eco Swap ─────────────────────────────────────────────────── -->
        <template if:true={isSwap}>
          <div class="ncp-section ncp-fullbleed">
            <c-nexus-swap></c-nexus-swap>
          </div>
        </template>

        <!-- ─ Passeport Digital ───────────────────────────────────────── -->
        <template if:true={isPassport}>
          <div class="ncp-section ncp-fullbleed">
            <c-nexus-digital-passport></c-nexus-digital-passport>
          </div>
        </template>

        <!-- ─ Timeline 360° ───────────────────────────────────────────── -->
        <template if:true={isTimeline}>
          <div class="ncp-section ncp-fullbleed">
            <c-nexus-time-machine></c-nexus-time-machine>
          </div>
        </template>

        <!-- ─ War Room ────────────────────────────────────────────────── -->
        <template if:true={isWarRoom}>
          <div class="ncp-section ncp-fullbleed">
            <c-nexus-war-room></c-nexus-war-room>
          </div>
        </template>

        <!-- ─ Profil ───────────────────────────────────────────────────── -->
        <template if:true={isProfile}>
          <div class="ncp-section">
            <!-- Avatar + Identity header -->
            <div class="ncp-profile-head">
              <div class="ncp-profile-avatar-wrap">
                <div class="ncp-avatar-lg">
                  <lightning-icon
                    icon-name="utility:user"
                    size="large"
                  ></lightning-icon>
                </div>
                <div class="ncp-avatar-camera">
                  <lightning-icon
                    icon-name="utility:camera"
                    size="x-small"
                    variant="inverse"
                  ></lightning-icon>
                </div>
                <div class="ncp-avatar-verified">
                  <lightning-icon
                    icon-name="utility:check"
                    size="x-small"
                    variant="inverse"
                  ></lightning-icon>
                </div>
              </div>
              <div class="ncp-profile-id">
                <span class="ncp-verified-badge">Verified Account</span>
                <h2 class="ncp-profile-name">{profileAccountName}</h2>
                <div class="ncp-profile-email-row">
                  <lightning-icon
                    icon-name="utility:email"
                    size="x-small"
                  ></lightning-icon>
                  <span>{profileEmail}</span>
                </div>
              </div>
            </div>

            <!-- Cards grid -->
            <div class="ncp-profile-grid">
              <div class="ncp-info-card">
                <h4 class="ncp-info-title">General Information</h4>
                <div class="ncp-field">
                  <label class="ncp-label">Full Name / Company</label>
                  <input
                    class="ncp-input"
                    type="text"
                    value={profileAccountName}
                    readonly
                  />
                </div>
                <div class="ncp-field">
                  <label class="ncp-label">Email</label>
                  <input
                    class="ncp-input"
                    type="email"
                    value={profileEmail}
                    readonly
                  />
                </div>
                <div class="ncp-field">
                  <label class="ncp-label">Phone</label>
                  <input class="ncp-input" type="tel" value={profilePhone} />
                </div>
              </div>

              <div class="ncp-info-card">
                <h4 class="ncp-info-title">Security</h4>
                <div class="ncp-security-row">
                  <div class="ncp-security-icon">
                    <lightning-icon
                      icon-name="utility:shield"
                      size="small"
                    ></lightning-icon>
                  </div>
                  <div class="ncp-security-info">
                    <div class="ncp-security-label">Password</div>
                    <div class="ncp-security-sub">Click Edit to change</div>
                  </div>
                  <button
                    class="ncp-modify-btn"
                    onclick={handleTogglePasswordForm}
                  >
                    {pwdToggleLabel}
                  </button>
                </div>

                <template if:true={showPasswordForm}>
                  <div class="ncp-pwd-form">
                    <div class="ncp-field">
                      <label class="ncp-label">Current Password</label>
                      <div class="ncp-input-eye-wrap">
                        <input
                          class="ncp-input ncp-input-eye"
                          type={oldPwdType}
                          value={_oldPassword}
                          onchange={handleOldPwd}
                          placeholder="••••••••"
                        />
                        <button
                          class="ncp-eye-btn"
                          type="button"
                          onclick={handleToggleOldPwd}
                        >
                          <template if:true={showOldPwd}>
                            <svg
                              width="16"
                              height="16"
                              viewBox="0 0 24 24"
                              fill="none"
                              stroke="currentColor"
                              stroke-width="2"
                            >
                              <path
                                d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"
                              />
                              <line x1="1" y1="1" x2="23" y2="23" />
                            </svg>
                          </template>
                          <template if:false={showOldPwd}>
                            <svg
                              width="16"
                              height="16"
                              viewBox="0 0 24 24"
                              fill="none"

                <span class="ncat-modal-arch">· Verified Architecture</span>
              </div>
              <div class="ncat-modal-price">{selectedProduct.priceDisplay}</div>
              <p class="ncat-modal-desc">{selectedProduct.description}</p>
              <div class="ncat-modal-features-section">
                <div class="ncat-modal-features-label">Core Capabilities</div>
                <template for:each={selectedProduct.features} for:item="feat">
                  <div key={feat} class="ncat-modal-feat-row">
                    <div class="ncat-feat-icon-wrap">
                      <lightning-icon
                        icon-name="utility:zap"
                        size="x-small"
                        variant="inverse"
                      ></lightning-icon>
                    </div>
                    <span class="ncat-feat-text">{feat}</span>
                  </div>
                </template>
              </div>
              <div class="ncat-modal-action-row">
                <button
                  class={selectedProduct.favBtnCls}
                  onclick={handleToggleFavoriteFromModal}
                  data-id={selectedProduct.id}
                >
                  <lightning-icon
                    icon-name="utility:heart"
                    size="x-small"
                  ></lightning-icon>
                  <span>{selectedProduct.favLabel}</span>
                </button>
                <button
                  class="ncat-modal-add-cart"
                  onclick={handleAddToCartFromModal}
                >
                  <lightning-icon
                    icon-name="utility:cart"
                    size="x-small"
                    variant="inverse"
                  ></lightning-icon>
                  <span>Add to Cart</span>
                </button>
              </div>
              <template if:true={isB2B}>
                <button
                  class="ncat-modal-quote-full"
                  onclick={handleOpenQuoteFromModal}
                >
                  <lightning-icon
                    icon-name="utility:file"
                    size="x-small"
                  ></lightning-icon>
                  <span>Request B2B Quote</span>
                </button>
              </template>
            </div>
          </div>
        </div>
      </template>

      <!-- ══ B2B Quote Modal (B2B only) ════════════════════════════════════ -->
      <template if:true={isB2B}>
        <template if:true={showQuoteModal}>
          <div class="ncat-modal-overlay" onclick={handleCloseQuoteModal}>
            <div class="ncat-quote-panel" onclick={handleStopPropagation}>
              <!-- Form step -->
              <template if:true={isQuoteForm}>
                <div class="ncat-quote-header">
                  <div class="ncat-quote-header-left">
                    <div class="ncat-quote-header-icon">
                      <lightning-icon
                        icon-name="utility:company"
                        size="small"
                        variant="inverse"
                      ></lightning-icon>
                    </div>
                    <div>
                      <h3 class="ncat-quote-title">B2B Quote Request</h3>
                      <p class="ncat-quote-subtitle">
                        Enterprise Solutions Division
                      </p>
                    </div>
                  </div>
                  <button
                    class="ncat-quote-close-btn"
                    onclick={handleCloseQuoteModal}
                  >
                    <lightning-icon
                      icon-name="utility:close"
                      size="x-small"
                    ></lightning-icon>
                  </button>
                </div>
                <div class="ncat-quote-body">
                  <template if:true={quoteProduct}>
                    <div class="ncat-quote-product-row">
                      <img
                        src={quoteProduct.image}
                        alt={quoteProduct.name}
                        class="ncat-quote-product-img"
                      />
                      <div>
                        <div class="ncat-quote-product-name">
                          {quoteProduct.name}
                        </div>
                        <div class="ncat-quote-product-code">
                          Product ID: {quoteProduct.productCode}
                        </div>
                      </div>
                    </div>
                  </template>
                  <div class="ncat-quote-form-row">
                    <div class="ncat-qfield">
                      <label class="ncat-qlabel">Company Name</label>
                      <input
                        class="ncat-qinput"
                        type="text"
                        placeholder="e.g. Nexus Corp"
                        value={_quoteCompany}
                        onchange={handleQuoteCompany}
                      />
                    </div>
                    <div class="ncat-qfield">
                      <label class="ncat-qlabel">Business Email</label>
                      <input
                        class="ncat-qinput"
                        type="email"
                        placeholder="name@company.com"
                        value={_quoteEmail}
                        onchange={handleQuoteEmail}
                      />
                    </div>
                  </div>
                  <div class="ncat-quote-form-row">
                    <div class="ncat-qfield">
                      <label class="ncat-qlabel">Estimated Quantity</label>
                      <input
                        class="ncat-qinput"
                        type="number"
                        min="1"
                        value={_quoteQty}
                        onchange={handleQuoteQty}
                      />
                    </div>
                    <div class="ncat-qfield">
                      <label class="ncat-qlabel">Industry</label>
                      <select
                        class="ncat-qinput ncat-qselect"
                        onchange={handleQuoteIndustry}
                      >
                        <option value="Technology">Technology</option>
                        <option value="Manufacturing">Manufacturing</option>
                        <option value="Healthcare">Healthcare</option>
                        <option value="Logistics">Logistics</option>
                        <option value="Other">Other</option>
                      </select>
                    </div>
                  </div>
                  <div class="ncat-qfield">
                    <label class="ncat-qlabel">Specific Requirements</label>
                    <textarea
                      class="ncat-qtextarea"
                      rows="3"
                      placeholder="Tell us about your project..."
                      onchange={handleQuoteMessage}
                    ></textarea>
                  </div>
                  <button
                    class="ncat-quote-submit-btn"
                    onclick={handleQuoteSubmit}
                  >
                    <lightning-icon
                      icon-name="utility:send"
                      size="x-small"
                      variant="inverse"
                    ></lightning-icon>
                    <span>Submit Quote Request</span>
                  </button>
                </div>
              </template>

              <!-- Success step -->
              <template if:true={isQuoteSuccess}>
                <div class="ncat-quote-success">
                  <div class="ncat-quote-success-icon">
                    <lightning-icon
                      icon-name="utility:success"
                      size="large"
                    ></lightning-icon>
                  </div>
                  <h3 class="ncat-quote-success-title">Request Received</h3>
                  <p class="ncat-quote-success-msg">
                    Our Enterprise team has received your request. A dedicated
                    account manager will contact you within 2 business hours.
                  </p>
                  <button
                    class="ncat-quote-submit-btn"
                    onclick={handleCloseQuoteModal}
                  >
                    Back to Catalog
                  </button>
                </div>
              </template>
            </div>
          </div>
        </template> </template
      ><!-- end isB2B quote modal --> </template
    ><!-- end if:false={isCatalog} -->

    <!-- ── Nexus Combo Builder panel (always present, overlaid on every tab) ── -->
    <c-nexus-combo-builder is-combo-page={isComboDeals}></c-nexus-combo-builder>

    <!-- ── Custom Cart Toast ── -->
    <template if:true={_cartToastVisible}>
      <div class="ncp-cart-toast">
        <div class="ncp-cart-toast-left">
          <div class="ncp-cart-toast-icon">
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z" />
              <line x1="3" y1="6" x2="21" y2="6" />
              <path d="M16 10a4 4 0 01-8 0" />
            </svg>
          </div>
          <div class="ncp-cart-toast-body">
            <span class="ncp-cart-toast-label">Ajouté au panier</span>
            <span class="ncp-cart-toast-name">{_cartToastName}</span>
            <template if:true={_cartToastPrice}>
              <span class="ncp-cart-toast-price">{_cartToastPrice}</span>
            </template>
          </div>
        </div>
        <button class="ncp-cart-toast-close" onclick={handleCartToastClose}>
          <svg
            width="14"
            height="14"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
          >
            <line x1="18" y1="6" x2="6" y2="18" />
            <line x1="6" y1="6" x2="18" y2="18" />
          </svg>
        </button>
        <div class="ncp-cart-toast-bar"></div>
      </div>
    </template>
  </div>
</template>

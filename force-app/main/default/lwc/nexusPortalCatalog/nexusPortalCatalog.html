<template>
    <div class="npcal-wrap">

        <!-- ── Hero ───────────────────────────────────────────────── -->
        <div class="npcal-hero">
            <div class="npcal-hero-grid">

                <!-- Left: copy -->
                <div class="npcal-hero-copy">
                    <div class="npcal-hero-tag">
                        <lightning-icon icon-name="utility:sparkles" size="xx-small" class="npcal-tag-icon"></lightning-icon>
                        <span>Nexus Premium Selection</span>
                    </div>
                    <h2 class="npcal-hero-title">
                        CATALOGUE
                        <span class="npcal-hero-title--indigo">COMPLET</span>
                    </h2>
                    <p class="npcal-hero-subtitle">
                        Explorez notre gamme complète de solutions Nexus.
                        Des technologies de pointe pour transformer votre infrastructure.
                    </p>
                </div>

                <!-- Right: animated orb -->
                <div class="npcal-orb-wrap">
                    <div class="npcal-orb-glow"></div>
                    <div class="npcal-orb-ring1"></div>
                    <div class="npcal-orb-ring2"></div>
                    <div class="npcal-orb-center">
                        <lightning-icon icon-name="utility:package" size="large" class="npcal-orb-icon"></lightning-icon>
                    </div>
                </div>

            </div>
        </div>

        <!-- ── Toolbar ─────────────────────────────────────────────── -->
        <div class="npcal-toolbar">

            <!-- Category tabs -->
            <div class="npcal-cats">
                <template for:each={categoryTabs} for:item="cat">
                    <button
                        key={cat.id}
                        class={cat.btnClass}
                        data-id={cat.id}
                        onclick={handleCategoryChange}
                    >{cat.label}</button>
                </template>
            </div>

            <!-- Search -->
            <div class="npcal-search-wrap">
                <lightning-icon icon-name="utility:search" size="xx-small" class="npcal-search-icon"></lightning-icon>
                <input
                    type="text"
                    class="npcal-search"
                    placeholder="Rechercher un produit..."
                    oninput={handleSearch}
                />
            </div>

        </div>

        <!-- ── Product grid ────────────────────────────────────────── -->
        <template if:true={hasProducts}>
            <div class="npcal-grid">
                <template for:each={products} for:item="product">
                    <c-nexus-portal-product-card
                        key={product.productId}
                        product-id={product.productId}
                        product-name={product.name}
                        product-description={product.description}
                        product-family={product.family}
                        image-url={product.imageUrl}
                        unit-price={product.unitPrice}
                        quantity-available={product.quantityAvailable}
                        is-out-of-stock={product.isOutOfStock}
                        onaddtocart={handleAddToCart}
                        onviewdetails={handleViewDetails}
                    ></c-nexus-portal-product-card>
                </template>
            </div>
        </template>

        <!-- ── Empty state ─────────────────────────────────────────── -->
        <template if:false={hasProducts}>
            <div class="npcal-empty">
                <div class="npcal-empty-icon">
                    <lightning-icon icon-name="utility:search" size="large" class="npcal-empty-ico"></lightning-icon>
                </div>
                <h3 class="npcal-empty-title">Aucun produit trouvé</h3>
                <p class="npcal-empty-sub">Essayez d&apos;ajuster vos filtres ou votre recherche.</p>
                <button class="npcal-reset-btn" onclick={handleResetFilters}>
                    Réinitialiser les filtres
                </button>
            </div>
        </template>

        <!-- ── Add-to-cart toast ───────────────────────────────────── -->
        <template if:true={showToast}>
            <div class="npcal-toast">
                <div class="npcal-toast-check">&#10003;</div>
                <div class="npcal-toast-text">
                    <span class="npcal-toast-title">{toastName}</span>
                    <span class="npcal-toast-sub">Ajouté au panier !</span>
                </div>
                <button class="npcal-toast-cart" onclick={handleGoCart}>
                    Voir le panier
                </button>
            </div>
        </template>

    </div>
</template>

<template>
  <div class={outerClass}>
    <div class="nav-split-card">
      <!-- ══ LEFT — Brand Panel ══ -->
      <div class="nav-brand-panel">
        <div class="nav-brand-inner">
          <div class="nav-brand-pill">
            <lightning-icon
              icon-name="utility:zap"
              size="x-small"
              variant="inverse"
            ></lightning-icon>
            &nbsp;Nexus AI Intelligence
          </div>
          <h1 class="nav-brand-title">
            NEXUS<br />
            <span class="nav-brand-gradient">SYSTEMS</span>
          </h1>
          <p class="nav-brand-desc">
            Secure your access by setting<br />
            a strong and unique password.
          </p>
          <div class="nav-brand-stats">
            <div class="nav-stat">
              <div class="nav-stat-val">AES</div>
              <div class="nav-stat-lbl">Encryption</div>
            </div>
            <div class="nav-stat">
              <div class="nav-stat-val">SSL</div>
              <div class="nav-stat-lbl">Protocole</div>
            </div>
            <div class="nav-stat">
              <div class="nav-stat-val">2FA</div>
              <div class="nav-stat-lbl">Available</div>
            </div>
          </div>
        </div>
      </div>

      <!-- ══ RIGHT — Form Panel ══ -->
      <div class="nav-form-panel">
        <!-- ── SUCCESS STATE ── -->
        <template if:true={isSuccess}>
          <div class="nav-center">
            <div class="ncp-success-icon">
              <lightning-icon
                icon-name="utility:check"
                size="medium"
                variant="inverse"
              ></lightning-icon>
            </div>
            <h2 class="nav-h2">Password set!</h2>
            <p class="nav-subtext nav-mt-md">
              Your account is secured. Redirecting to your portal&hellip;
            </p>
          </div>
        </template>

        <!-- ── FORM STATE ── -->
        <template if:false={isSuccess}>
          <div class="nav-center nav-mb-lg">
            <span class="nav-badge-pill">
              <lightning-icon
                icon-name="utility:lock"
                size="x-small"
              ></lightning-icon>
              &nbsp;First Login
            </span>
            <h2 class="nav-h2">Set Your Password</h2>
            <p class="nav-subtext">
              Choose a secure password to activate your account.
            </p>
          </div>

          <form onsubmit={handleSubmit} class="nav-form">
            <!-- New password -->
            <div class="nav-input-wrap">
              <lightning-icon
                icon-name="utility:lock"
                size="x-small"
                class="nav-input-icon"
              ></lightning-icon>
              <input
                class="nav-input nav-input-padded"
                type={newPwdType}
                placeholder="New Password"
                data-field="newPassword"
                required
                oninput={handleNewPwdInput}
              />
              <button
                type="button"
                class="nav-eye-btn"
                onclick={handleToggleNew}
              >
                <lightning-icon
                  icon-name={newEyeIcon}
                  size="x-small"
                ></lightning-icon>
              </button>
            </div>

            <!-- Confirm password -->
            <div class="nav-input-wrap">
              <lightning-icon
                icon-name="utility:lock"
                size="x-small"
                class="nav-input-icon"
              ></lightning-icon>
              <input
                class="nav-input nav-input-padded"
                type={confirmPwdType}
                placeholder="Confirm Password"
                data-field="confirmPassword"
                required
                oninput={handleConfirmPwdInput}
              />
              <button
                type="button"
                class="nav-eye-btn"
                onclick={handleToggleConfirm}
              >
                <lightning-icon
                  icon-name={confirmEyeIcon}
                  size="x-small"
                ></lightning-icon>
              </button>
            </div>

            <!-- Password rules checklist -->
            <div class="ncp-rules">
              <div class={ruleClass8}>
                <lightning-icon
                  icon-name={ruleIcon8}
                  size="x-small"
                  class="ncp-rule-icon"
                ></lightning-icon>
                At least 8 characters
              </div>
              <div class={ruleClassUpper}>
                <lightning-icon
                  icon-name={ruleIconUpper}
                  size="x-small"
                  class="ncp-rule-icon"
                ></lightning-icon>
                One uppercase letter (A&ndash;Z)
              </div>
              <div class={ruleClassLower}>
                <lightning-icon
                  icon-name={ruleIconLower}
                  size="x-small"
                  class="ncp-rule-icon"
                ></lightning-icon>
                One lowercase letter (a&ndash;z)
              </div>
              <div class={ruleClassNumber}>
                <lightning-icon
                  icon-name={ruleIconNumber}
                  size="x-small"
                  class="ncp-rule-icon"
                ></lightning-icon>
                One number (0&ndash;9)
              </div>
              <div class={ruleClassSpecial}>
                <lightning-icon
                  icon-name={ruleIconSpecial}
                  size="x-small"
                  class="ncp-rule-icon"
                ></lightning-icon>
                One special character (!&nbsp;@&nbsp;#&nbsp;$&hellip;)
              </div>
              <template if:true={confirmPwdValue}>
                <div class={ruleClassMatch}>
                  <lightning-icon
                    icon-name={ruleIconMatch}
                    size="x-small"
                    class="ncp-rule-icon"
                  ></lightning-icon>
                  Passwords match
                </div>
              </template>
            </div>

            <!-- Error message -->
            <template if:true={errorMsg}>
              <div class="ncp-error">{errorMsg}</div>
            </template>

            <button
              type="submit"
              class="nav-btn-submit"
              disabled={isSubmitDisabled}
            >
              <template if:false={isLoading}>Confirm Password &rarr;</template>
              <template if:true={isLoading}>Saving&hellip;</template>
            </button>
          </form>
        </template>
      </div>
    </div>
  </div>
</template>

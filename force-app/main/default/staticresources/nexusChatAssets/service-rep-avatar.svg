<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- Dark navy background -->
  <rect width="120" height="120" rx="28" fill="#0F172A"/>

  <!-- Subtle green radial glow from bottom -->
  <ellipse cx="60" cy="100" rx="52" ry="28" fill="#059669" opacity="0.12"/>

  <!-- Body / suit -->
  <path d="M14 116 C14 86 32 74 60 74 C88 74 106 86 106 116 Z" fill="#1E293B"/>

  <!-- Shirt collar (white V) -->
  <path d="M52 74 L60 84 L68 74" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.85"/>

  <!-- Nexus ID badge -->
  <rect x="42" y="88" width="36" height="16" rx="4" fill="#059669"/>
  <text x="60" y="100" text-anchor="middle" font-family="Arial,sans-serif" font-weight="900" font-size="7" letter-spacing="1.5" fill="#FFFFFF">NEXUS</text>

  <!-- Head -->
  <circle cx="60" cy="46" r="25" fill="#334155"/>

  <!-- Hair -->
  <path d="M35 40 Q35 22 60 20 Q85 22 85 40 Q83 30 60 28 Q37 30 35 40 Z" fill="#1E293B"/>

  <!-- Eyes -->
  <ellipse cx="51" cy="44" rx="5" ry="5.5" fill="#0F172A"/>
  <ellipse cx="69" cy="44" rx="5" ry="5.5" fill="#0F172A"/>
  <circle cx="52.5" cy="42.5" r="2" fill="#FFFFFF"/>
  <circle cx="70.5" cy="42.5" r="2" fill="#FFFFFF"/>

  <!-- Eyebrows -->
  <path d="M44 36 Q51 33 58 36" stroke="#475569" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M62 36 Q69 33 76 36" stroke="#475569" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Smile -->
  <path d="M51 57 Q60 64 69 57" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- Ears -->
  <ellipse cx="35" cy="46" rx="5" ry="7" fill="#334155"/>
  <ellipse cx="85" cy="46" rx="5" ry="7" fill="#334155"/>

  <!-- Headset arc -->
  <path d="M30 44 Q30 18 60 18 Q90 18 90 44" stroke="#059669" stroke-width="3.5" stroke-linecap="round" fill="none"/>

  <!-- Headset earcups -->
  <rect x="24" y="40" width="12" height="18" rx="6" fill="#059669"/>
  <rect x="84" y="40" width="12" height="18" rx="6" fill="#059669"/>

  <!-- Mic boom arm -->
  <path d="M24 54 Q16 64 20 70" stroke="#059669" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <circle cx="20" cy="71" r="3.5" fill="#10B981"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <radialGradient id="botBg" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </radialGradient>
  </defs>

  <!-- Green rounded background with gradient -->
  <rect width="120" height="120" rx="28" fill="url(#botBg)"/>

  <!-- Antenna -->
  <line x1="60" y1="28" x2="60" y2="13" stroke="#ECFDF5" stroke-width="3" stroke-linecap="round"/>
  <circle cx="60" cy="10" r="5" fill="#ECFDF5"/>
  <circle cx="60" cy="10" r="2.5" fill="#34D399"/>

  <!-- Robot head -->
  <rect x="18" y="28" width="84" height="72" rx="18" fill="#020617"/>
  <rect x="21" y="31" width="78" height="66" rx="15" fill="#0F172A"/>

  <!-- Left eye housing -->
  <rect x="26" y="42" width="28" height="22" rx="8" fill="#020617"/>
  <rect x="29" y="45" width="22" height="16" rx="6" fill="#10B981"/>
  <circle cx="34" cy="52" r="4.5" fill="#059669"/>
  <circle cx="34" cy="52" r="2.5" fill="#34D399"/>
  <circle cx="32.5" cy="50" r="1.2" fill="#ECFDF5"/>

  <!-- Right eye housing -->
  <rect x="66" y="42" width="28" height="22" rx="8" fill="#020617"/>
  <rect x="69" y="45" width="22" height="16" rx="6" fill="#10B981"/>
  <circle cx="74" cy="52" r="4.5" fill="#059669"/>
  <circle cx="74" cy="52" r="2.5" fill="#34D399"/>
  <circle cx="72.5" cy="50" r="1.2" fill="#ECFDF5"/>

  <!-- Mouth bar -->
  <rect x="30" y="74" width="60" height="14" rx="7" fill="#020617"/>
  <rect x="34" y="78" width="13" height="6" rx="3" fill="#059669"/>
  <rect x="53.5" y="78" width="13" height="6" rx="3" fill="#059669"/>
  <rect x="73" y="78" width="13" height="6" rx="3" fill="#059669"/>

  <!-- Side ports -->
  <rect x="8" y="46" width="10" height="18" rx="5" fill="#0F172A" stroke="#059669" stroke-width="1.5"/>
  <circle cx="13" cy="55" r="2" fill="#059669"/>
  <rect x="102" y="46" width="10" height="18" rx="5" fill="#0F172A" stroke="#059669" stroke-width="1.5"/>
  <circle cx="107" cy="55" r="2" fill="#059669"/>
</svg>

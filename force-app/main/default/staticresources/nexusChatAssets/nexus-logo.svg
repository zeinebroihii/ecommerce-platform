<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 80" fill="none">
  <!-- Dark navy background -->
  <rect width="260" height="80" fill="#020617"/>

  <!-- Hexagon icon -->
  <g transform="translate(14, 10)">
    <!-- Outer hex fill (subtle) -->
    <polygon points="26,0 52,14 52,42 26,56 0,42 0,14" fill="#059669" opacity="0.12"/>
    <!-- Hex border -->
    <polygon points="26,0 52,14 52,42 26,56 0,42 0,14" fill="none" stroke="#059669" stroke-width="1.8"/>
    <!-- N letterform inside hex -->
    <path d="M13 40 L13 16 L26 40 L39 16 L39 40" stroke="#059669" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- NEXUS wordmark -->
  <text x="80" y="51" font-family="Arial,sans-serif" font-weight="900" font-size="30" fill="#FFFFFF" letter-spacing="5">NEXUS</text>

  <!-- Tagline -->
  <text x="81" y="65" font-family="Arial,sans-serif" font-size="8" font-weight="600" fill="#64748B" letter-spacing="3">ENTERPRISE PLATFORM</text>

  <!-- Pulsing dot accent (top-right) -->
  <circle cx="247" cy="16" r="5" fill="#059669" opacity="0.25"/>
  <circle cx="247" cy="16" r="3" fill="#10B981"/>
</svg>
